name: Deploy Tendy Quest to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stamp build version for mobile cache-busting
        run: |
          SHORT_SHA="${GITHUB_SHA:0:8}"
          printf '{"v":"%s"}\n' "$SHORT_SHA" > dist/web/version.json
          sed -i "s/__TQ_BUILD_ID__/${SHORT_SHA}/g" dist/web/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/web"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

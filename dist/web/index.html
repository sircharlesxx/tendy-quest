<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tendy Quest — Giant Kitchen</title>
  
  
  
  <script>
    window.tendySave = {
      saveCheckpoint(json) {
        try {
          localStorage.setItem("tendy_quest_save_v1", String(json || ""));
        } catch (_) {}
      },
      loadCheckpoint() {
        try {
          return localStorage.getItem("tendy_quest_save_v1") || "";
        } catch (_) {
          return "";
        }
      },
      clearCheckpoint() {
        try {
          localStorage.removeItem("tendy_quest_save_v1");
        } catch (_) {}
      },
      markMomDefeated() {
        try {
          localStorage.setItem("tendy_quest_mom_defeated_v1", "1");
        } catch (_) {}
      },
      hasDefeatedMom() {
        try {
          return localStorage.getItem("tendy_quest_mom_defeated_v1") === "1";
        } catch (_) {
          return false;
        }
      },
      clearAllProgress() {
        try {
          localStorage.removeItem("tendy_quest_save_v1");
          localStorage.removeItem("tendy_quest_mom_defeated_v1");
        } catch (_) {}
      },
    };
    window.tendyTelemetry = {
      state: "Tutorial",
      hearts: 5,
      tendies: 0,
      stamina: 100,
      bossHp: 100,
      credits: 0,
      inCity: false,
      update(state, hearts, tendies, stamina, bossHp, credits, inCity) {
        this.state = state;
        this.hearts = hearts;
        this.tendies = tendies;
        this.stamina = stamina;
        this.bossHp = bossHp;
        this.credits = credits;
        this.inCity = inCity;
      },
    };
    // Loading screen handoff. The game boots behind its own black fade overlay and calls
    // ready() once the hero + Level 1 scenes have loaded (or its timeout passes). The HTML
    // loading screen then fades out (CSS opacity transition) instead of vanishing, and the game
    // fades in from black underneath it. A fallback timer fades it anyway if ready() never comes.
    window.tendyBoot = {
      isReady: false,
      hidden: false,
      ready() {
        this.isReady = true;
        this.hide();
      },
      hide() {
        if (this.hidden) return;
        const el = document.getElementById("loading");
        if (!el) return;
        this.hidden = true;
        el.style.pointerEvents = "none";
        el.style.opacity = "0";
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          el.style.display = "none";
        };
        el.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 700);
      },
    };
    window.tendyAudio = (() => {
      const SFX_NAMES = [
        "jump", "double_jump", "dash", "tendy", "powerup",
        "hit", "shield", "step", "lunge", "win", "lose"
      ];
      let ctx = null;
      let masterGain = null;
      let bgmGain = null;
      let ambGain = null;
      let bgmSource = null;
      let ambSource = null;
      let bgmRequested = false;
      let bgmStarted = false;
      let ambStarted = false;
      let muted = false;
      const buffers = {};
      const loading = {};

      function ensureCtx() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          masterGain = ctx.createGain();
          masterGain.gain.value = muted ? 0.0 : 1.0;
          masterGain.connect(ctx.destination);

          bgmGain = ctx.createGain();
          bgmGain.gain.value = 0.42;
          bgmGain.connect(masterGain);

          ambGain = ctx.createGain();
          ambGain.gain.value = 0.14;
          ambGain.connect(masterGain);
        }
        return ctx;
      }

      async function loadBuffer(key, url) {
        if (buffers[key]) return buffers[key];
        if (loading[key]) return loading[key];
        const ac = ensureCtx();
        if (!ac) return null;
        loading[key] = fetch(url)
          .then((res) => (res.ok ? res.arrayBuffer() : null))
          .then((arr) => (arr ? ac.decodeAudioData(arr) : null))
          .then((buf) => {
            if (buf) buffers[key] = buf;
            return buf;
          })
          .catch(() => null);
        return loading[key];
      }

      function preloadAll() {
        try {
          loadBuffer("bgm", "assets/audio/tendies_from_the_sun.mp3").then(() => {
            if (bgmRequested) startLoops();
          });
          loadBuffer("ambience", "assets/audio/kitchen_ambience.mp3").then(() => {
            if (bgmRequested) startLoops();
          });
          for (const name of SFX_NAMES) {
            loadBuffer(name, `assets/audio/${name}.wav`);
          }
        } catch (_) {}
      }

      let droneOsc1 = null;
      let droneOsc2 = null;
      let droneGain = null;
      let bossTimer = null;
      let bossStep = 0;
      let vikingTimer = null;
      let vikingStep = 0;
      let headphoneTimer = null;
      let headphoneStep = 0;

      // Music changes crossfade instead of hard-stopping: every procedural track plays through
      // its own bus gain that ramps in over MUSIC_FADE_S; on a change the old bus ramps out while
      // its sequencer keeps ticking into it, and is torn down once silent. The looped bgm/ambience
      // buffers just ramp their gains. This removes the clicks from cutting oscillators mid-cycle.
      const MUSIC_FADE_S = 0.3;
      let musicBus = null;
      let currentTrack = "";
      let trackStartedMs = -1e9;

      function rampGain(param, target, secs) {
        if (!ctx || !param) return;
        const now = ctx.currentTime;
        try {
          if (param.cancelAndHoldAtTime) {
            param.cancelAndHoldAtTime(now);
          } else {
            const v = param.value;
            param.cancelScheduledValues(now);
            param.setValueAtTime(v, now);
          }
          param.linearRampToValueAtTime(target, now + secs);
        } catch (_) {
          try { param.setValueAtTime(target, now); } catch (_) {}
        }
      }

      // Fresh fading-in output bus for the track being started; returns its input node.
      function newMusicBus(ac) {
        const bus = ac.createGain();
        bus.gain.setValueAtTime(0.0, ac.currentTime);
        bus.gain.linearRampToValueAtTime(1.0, ac.currentTime + MUSIC_FADE_S);
        bus.connect(masterGain);
        musicBus = bus;
        return bus;
      }

      // Several systems can ask for the same track in one frame (e.g. a cutscene exit and the
      // OnEnter of the state it returns to). Restarting it would just re-trigger the fade.
      function isTrackRestart(name) {
        const now = performance.now();
        if (name === currentTrack && now - trackStartedMs < 250) return true;
        currentTrack = name;
        trackStartedMs = now;
        return false;
      }

      function stopSpecialAudio() {
        try {
          const timers = [bossTimer, vikingTimer, headphoneTimer];
          const oscs = [droneOsc1, droneOsc2];
          const oldDrone = droneGain;
          const oldBus = musicBus;
          bossTimer = null;
          vikingTimer = null;
          headphoneTimer = null;
          droneOsc1 = null;
          droneOsc2 = null;
          droneGain = null;
          musicBus = null;
          if (ctx) {
            const end = ctx.currentTime + MUSIC_FADE_S + 0.05;
            if (oldBus) rampGain(oldBus.gain, 0.0, MUSIC_FADE_S);
            for (const o of oscs) {
              if (o) { try { o.stop(end); } catch (_) {} }
            }
          }
          setTimeout(() => {
            for (const t of timers) { if (t) clearInterval(t); }
            for (const o of oscs) { if (o) { try { o.disconnect(); } catch (_) {} } }
            try { if (oldDrone) oldDrone.disconnect(); } catch (_) {}
            try { if (oldBus) oldBus.disconnect(); } catch (_) {}
          }, (MUSIC_FADE_S + 0.1) * 1000);
          if (bgmGain) rampGain(bgmGain.gain, 0.0, MUSIC_FADE_S);
          if (ambGain) rampGain(ambGain.gain, 0.0, MUSIC_FADE_S);
        } catch (_) {}
      }

      // Short band-passed white-noise burst (snares, crunches, door thuds), shaped like the
      // mkOsc envelopes: quick attack, exponential decay. Routes to the SFX master unless a
      // destination bus is passed (music loops pass their own bus).
      let sfxNoiseBuf = null;
      function mkNoise(dur, gainPeak, freq, dest) {
        const ac = ensureCtx();
        if (!ac || !masterGain) return;
        if (!sfxNoiseBuf || sfxNoiseBuf.sampleRate !== ac.sampleRate) {
          const len = Math.floor(ac.sampleRate * 1.0);
          sfxNoiseBuf = ac.createBuffer(1, len, ac.sampleRate);
          const d = sfxNoiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        }
        const now = ac.currentTime;
        const src = ac.createBufferSource();
        src.buffer = sfxNoiseBuf;
        const bp = ac.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = freq;
        bp.Q.value = 0.9;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(gainPeak, now + 0.008);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        src.connect(bp);
        bp.connect(g);
        g.connect(dest || masterGain);
        src.start(now);
        src.stop(now + dur + 0.02);
      }

      function synthProcSfx(name) {
        const ac = ensureCtx();
        if (!ac || !masterGain) return false;
        const now = ac.currentTime;
        const mkOsc = (type, f0, f1, dur, gainPeak) => {
          const osc = ac.createOscillator();
          const g = ac.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(f0, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(gainPeak, now + 0.015);
          g.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(g);
          g.connect(masterGain);
          osc.start(now);
          osc.stop(now + dur + 0.02);
        };
        if (name === "saber_ignite") {
          mkOsc("sawtooth", 110, 420, 0.36, 0.28);
          mkOsc("triangle", 220, 140, 0.45, 0.22);
          return true;
        }
        if (name === "saber_swing") {
          mkOsc("sawtooth", 340, 135, 0.19, 0.22);
          mkOsc("sine", 560, 210, 0.17, 0.14);
          return true;
        }
        if (name === "saber_hit") {
          mkOsc("square", 680, 120, 0.16, 0.30);
          mkOsc("sawtooth", 980, 240, 0.14, 0.20);
          return true;
        }
        if (name === "dodge_roll") {
          mkOsc("sine", 240, 520, 0.18, 0.22);
          return true;
        }
        if (name === "saber_block") {
          mkOsc("square", 1250, 620, 0.12, 0.20);
          mkOsc("sawtooth", 180, 90, 0.16, 0.22);
          return true;
        }
        if (name === "saber_parry") {
          mkOsc("square", 1500, 1900, 0.10, 0.20);
          mkOsc("triangle", 2400, 1200, 0.24, 0.18);
          mkOsc("sawtooth", 220, 110, 0.18, 0.20);
          return true;
        }
        if (name === "guard_break") {
          mkOsc("sawtooth", 420, 70, 0.32, 0.30);
          mkOsc("square", 160, 60, 0.30, 0.20);
          return true;
        }
        if (name === "thunder") {
          mkOsc("sawtooth", 95, 32, 0.75, 0.36);
          return true;
        }
        if (name === "mom_yell") {
          mkOsc("sawtooth", 540, 380, 0.32, 0.26);
          mkOsc("square", 720, 460, 0.24, 0.14);
          return true;
        }
        if (name === "garlic_throw") {
          mkOsc("sawtooth", 210, 95, 0.28, 0.26);
          mkOsc("triangle", 340, 150, 0.24, 0.18);
          return true;
        }
        if (name === "car_horn") {
          mkOsc("sawtooth", 392, 388, 0.22, 0.22);
          mkOsc("square", 494, 490, 0.22, 0.16);
          return true;
        }
        if (name === "car_door") {
          mkOsc("triangle", 190, 72, 0.11, 0.24);
          mkNoise(0.06, 0.16, 450);
          return true;
        }
        if (name === "car_drift") {
          mkNoise(0.18, 0.14, 1850);
          mkOsc("sawtooth", 580, 520, 0.14, 0.06);
          return true;
        }
        if (name === "car_crash") {
          mkNoise(0.24, 0.34, 900);
          mkOsc("sawtooth", 140, 48, 0.22, 0.28);
          return true;
        }
        if (name === "estus_drink") {
          mkOsc("sine", 523, 784, 0.28, 0.22);
          mkOsc("triangle", 659, 1046, 0.34, 0.16);
          return true;
        }
        if (name === "hack_blip") {
          mkOsc("square", 880, 1320, 0.05, 0.14);
          return true;
        }
        if (name === "hack_deny") {
          mkOsc("sawtooth", 190, 120, 0.14, 0.20);
          return true;
        }
        if (name === "hack_success") {
          mkOsc("square", 523, 1046, 0.16, 0.22);
          setTimeout(() => mkOsc("sine", 784, 1568, 0.22, 0.22), 90);
          return true;
        }
        if (name === "smoke_puff") {
          mkNoise(0.45, 0.16, 650);
          mkOsc("sine", 240, 360, 0.35, 0.12);
          return true;
        }
        if (name === "killbill_siren") {
          mkOsc("sawtooth", 680, 960, 0.35, 0.22);
          setTimeout(() => mkOsc("sawtooth", 960, 620, 0.42, 0.20), 260);
          return true;
        }
        if (name === "headphone_crunch") {
          mkOsc("sawtooth", 620, 75, 0.34, 0.34);
          mkOsc("square", 1180, 140, 0.26, 0.28);
          mkOsc("triangle", 290, 48, 0.42, 0.30);
          return true;
        }
        if (name === "rage_swell") {
          mkOsc("sawtooth", 85, 175, 0.22, 0.22);
          mkOsc("sine", 55, 115, 0.24, 0.26);
          return true;
        }
        return false;
      }

      function startLoops() {
        const ac = ensureCtx();
        if (!ac || ac.state !== "running") return;
        if (!bgmStarted && buffers["bgm"]) {
          bgmStarted = true;
          bgmSource = ac.createBufferSource();
          bgmSource.buffer = buffers["bgm"];
          bgmSource.loop = true;
          bgmSource.connect(bgmGain);
          bgmSource.start(0);
        }
        if (!ambStarted && buffers["ambience"]) {
          ambStarted = true;
          ambSource = ac.createBufferSource();
          ambSource.buffer = buffers["ambience"];
          ambSource.loop = true;
          ambSource.connect(ambGain);
          ambSource.start(0);
        }
      }

      function unlockAndMaybeStart() {
        try {
          const ac = ensureCtx();
          if (!ac) return;
          if (ac.state === "suspended") {
            ac.resume().then(() => {
              if (bgmRequested) startLoops();
            }).catch(() => {});
          } else if (bgmRequested) {
            startLoops();
          }
        } catch (_) {}
      }

      window.addEventListener("pointerdown", () => {
        preloadAll();
        unlockAndMaybeStart();
      });
      window.addEventListener("keydown", () => {
        preloadAll();
        unlockAndMaybeStart();
      });
      window.addEventListener("load", preloadAll);

      return {
        playBgm() {
          if (isTrackRestart("bgm")) return;
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (ac && bgmGain) rampGain(bgmGain.gain, 0.42, MUSIC_FADE_S);
            if (ac && ambGain) rampGain(ambGain.gain, 0.14, MUSIC_FADE_S);
            if (bgmSource) bgmSource.playbackRate.value = 1.0;
          } catch (_) {}
        },
        playCutsceneMusic() {
          if (isTrackRestart("cutscene")) return;
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (!ac || !masterGain) return;
            const out = newMusicBus(ac);
            if (bgmGain) rampGain(bgmGain.gain, 0.0, MUSIC_FADE_S);
            if (ambGain) rampGain(ambGain.gain, 0.06, MUSIC_FADE_S);
            const filter = ac.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.value = 240;
            droneGain = ac.createGain();
            droneGain.gain.value = 0.22;
            filter.connect(droneGain);
            droneGain.connect(out);
            droneOsc1 = ac.createOscillator();
            droneOsc1.type = "sawtooth";
            droneOsc1.frequency.value = 55;
            droneOsc2 = ac.createOscillator();
            droneOsc2.type = "sawtooth";
            droneOsc2.frequency.value = 82.41;
            droneOsc1.connect(filter);
            droneOsc2.connect(filter);
            droneOsc1.start();
            droneOsc2.start();
          } catch (_) {}
        },
        playHeadphoneMusic(level = 1) {
          if (isTrackRestart("headphone" + level)) return;
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (!ac || !masterGain) return;
            const out = newMusicBus(ac);
            const lv = Math.max(1, level | 0);
            const uzumaki = lv >= 2;
            if (bgmGain) rampGain(bgmGain.gain, 0.0, MUSIC_FADE_S);
            if (ambGain) rampGain(ambGain.gain, 0.03, MUSIC_FADE_S);
            // Ominous D1 + G#1 tritone sub-drone (deepens & warps in Uzumaki 2nd+ trigger)
            const filter = ac.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.value = uzumaki ? 280 : 190;
            droneGain = ac.createGain();
            droneGain.gain.value = uzumaki ? 0.21 : 0.16;
            filter.connect(droneGain);
            droneGain.connect(out);
            droneOsc1 = ac.createOscillator();
            droneOsc1.type = "triangle";
            droneOsc1.frequency.value = uzumaki ? 32.7 : 36.71;
            droneOsc2 = ac.createOscillator();
            droneOsc2.type = "sawtooth";
            droneOsc2.frequency.value = uzumaki ? 48.99 : 51.91;
            droneOsc1.connect(filter);
            droneOsc2.connect(filter);
            droneOsc1.start();
            droneOsc2.start();

            const glassBells = uzumaki
              ? [622.25, 587.33, 554.37, 466.16, 415.30, 392.0, 311.13, 277.18]
              : [587.33, 554.37, 466.16, 440.0, 392.0, 349.23, 329.63, 277.18];
            headphoneStep = 0;
            headphoneTimer = setInterval(() => {
              if (muted || ac.state !== "running") return;
              const now = ac.currentTime;
              const step = headphoneStep % 8;
              headphoneStep += 1;

              // Double-heartbeat sub-thump on beats 0 and 2
              if (step === 0 || step === 2 || (uzumaki && step === 5)) {
                const thump = ac.createOscillator();
                const tg = ac.createGain();
                thump.type = "sine";
                thump.frequency.setValueAtTime(uzumaki ? 112 : 96, now);
                thump.frequency.exponentialRampToValueAtTime(26, now + 0.18);
                tg.gain.setValueAtTime(uzumaki ? 0.34 : 0.28, now);
                tg.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
                thump.connect(tg);
                tg.connect(out);
                thump.start(now);
                thump.stop(now + 0.20);
              }

              // Haunting descending diminished shattered-glass bell arpeggio
              const freq = glassBells[step];
              const bell = ac.createOscillator();
              const shimmer = ac.createOscillator();
              const bg = ac.createGain();
              bell.type = "sine";
              shimmer.type = uzumaki ? "sawtooth" : "triangle";
              bell.frequency.setValueAtTime(freq, now);
              shimmer.frequency.setValueAtTime(freq * (uzumaki ? 1.028 : 1.007), now);
              bg.gain.setValueAtTime(0.001, now);
              bg.gain.linearRampToValueAtTime(uzumaki ? 0.095 : 0.085, now + 0.015);
              bg.gain.exponentialRampToValueAtTime(0.0008, now + 0.38);
              bell.connect(bg);
              shimmer.connect(bg);
              bg.connect(out);
              bell.start(now);
              shimmer.start(now);
              bell.stop(now + 0.40);
              shimmer.stop(now + 0.40);

              // Uzumaki spiral frequency glissando sweep on 2nd+ trigger
              if (uzumaki) {
                const spiralOsc = ac.createOscillator();
                const sg = ac.createGain();
                const f0 = step % 2 === 0 ? 190 : 410;
                const f1 = step % 2 === 0 ? 430 : 165;
                spiralOsc.type = "sine";
                spiralOsc.frequency.setValueAtTime(f0, now);
                spiralOsc.frequency.exponentialRampToValueAtTime(f1, now + 0.16);
                sg.gain.setValueAtTime(0.001, now);
                sg.gain.linearRampToValueAtTime(0.055, now + 0.02);
                sg.gain.exponentialRampToValueAtTime(0.0008, now + 0.17);
                spiralOsc.connect(sg);
                sg.connect(out);
                spiralOsc.start(now);
                spiralOsc.stop(now + 0.18);
              }

              // High metallic glass-crack tick on beat 4
              if (step === 4) {
                const tick = ac.createOscillator();
                const tk = ac.createGain();
                tick.type = "square";
                tick.frequency.setValueAtTime(1661.22, now);
                tick.frequency.exponentialRampToValueAtTime(622.25, now + 0.09);
                tk.gain.setValueAtTime(0.045, now);
                tk.gain.exponentialRampToValueAtTime(0.0008, now + 0.10);
                tick.connect(tk);
                tk.connect(out);
                tick.start(now);
                tick.stop(now + 0.11);
              }
            }, uzumaki ? 165 : 220);
          } catch (_) {}
        },
        playBossMusic() {
          if (isTrackRestart("boss")) return;
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (!ac || !masterGain) return;
            const out = newMusicBus(ac);
            if (bgmGain) rampGain(bgmGain.gain, 0.0, MUSIC_FADE_S);
            if (ambGain) rampGain(ambGain.gain, 0.0, MUSIC_FADE_S);
            // Epic 150 BPM Chicken-Tendy boss riff + driving synth drums
            const notes = [146.83, 174.61, 220.0, 261.63, 293.66, 261.63, 220.0, 174.61];
            const bass = [73.42, 73.42, 87.31, 87.31, 98.0, 98.0, 110.0, 82.41];
            bossStep = 0;
            bossTimer = setInterval(() => {
              if (muted || ac.state !== "running") return;
              const now = ac.currentTime;
              const step = bossStep % 16;
              bossStep += 1;
              // Kick on 0, 4, 8, 12 + syncopated hits
              if (step % 4 === 0 || step === 10) {
                const ko = ac.createOscillator();
                const kg = ac.createGain();
                ko.type = "sine";
                ko.frequency.setValueAtTime(135, now);

      let attackQueued = false;
      // SABER held (touch) / RB or RT held (gamepad): boss-mode heavy charge. Tap = light swing.
      let attackTouchHeld = false;
      let gpAttackHeld = false;
      let bossModeActive = false;
      let blockHeld = false;
      let actionTapQueued = false;
      let helpQueued = false;

      let joyTouchId = null;
      let lookTouchId = null;
      const lookTouches = new Map();
      let lastPinchDist = null;
      let lastPinchMidX = 0;
      let lastPinchMidY = 0;
      let lookLastX = 0;
      let lookLastY = 0;
      let lookMoved = 0;
      const maxR = 46;

      const touchControls = document.getElementById("touch-controls");
      const joyZone = document.getElementById("joystick-zone");
      const joyKnob = document.getElementById("joystick-knob");
      const btnJump = document.getElementById("btn-jump");
      const btnDash = document.getElementById("btn-dash");
      const btnAttack = document.getElementById("btn-attack");
      const btnBlock = document.getElementById("btn-block");
      const btnHelp = document.getElementById("btn-help");
      const btnMute = document.getElementById("btn-mute");
      const btnFullscreen = document.getElementById("btn-fullscreen");
      const fsPrompt = document.getElementById("fullscreen-prompt");
      const btnFsPrompt = document.getElementById("btn-fullscreen-prompt");
      const btnFsDismiss = document.getElementById("btn-fullscreen-dismiss");
      let fsDismissed = false;
      let autoFsAttempted = false;
      let isPlayingState = false;

      const isMobileViewport = () =>
        (window.matchMedia &&
          (window.matchMedia("(pointer: coarse)").matches ||
            window.matchMedia("(max-width: 960px)").matches)) ||
        "ontouchstart" in window ||
        navigator.maxTouchPoints > 0;

        Boolean(
          document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.mozFullScreenElement ||
            document.msFullscreenElement

      async function requestOptimalFullscreen() {
        if (isFullscreen()) {
          syncFullscreenUI();
          return true;
        }
        const el = document.documentElement;
        const req =
          el.requestFullscreen ||
          el.webkitRequestFullscreen ||
          el.mozRequestFullScreen ||
          el.msRequestFullscreen;
        if (!req) {
          try { window.scrollTo(0, 1); } catch (_) {}
          syncFullscreenUI();
          return false;
        }
        try {
          if (el.requestFullscreen) {
            try {
              await el.requestFullscreen({ navigationUI: "hide" });
            } catch (_) {
              await el.requestFullscreen();
            }
          } else {
            await Promise.resolve(req.call(el));
          }
          syncFullscreenUI();
          return true;
        } catch (_) {
          syncFullscreenUI();
          return false;
        }
      }

      async function toggleFullscreen() {
        try {
          if (isFullscreen()) {
            const exit =
              document.exitFullscreen ||
              document.webkitExitFullscreen ||
              document.mozCancelFullScreen ||
              document.msExitFullscreen;
            if (exit) await Promise.resolve(exit.call(document));
          } else {
            await requestOptimalFullscreen();
          }

      }

      function syncFullscreenUI() {
        const fs = isFullscreen();
        if (btnFullscreen) {
          btnFullscreen.textContent = fs ? "EXIT" : "FULL";
          btnFullscreen.classList.toggle("highlight", !fs);
        }
        const inCutsceneInit = /cutscene=1|anime=1|city_intro=1|headphones=1|headphones=2|uzumaki=1/.test(
          window.location.search
        );
        if (fsPrompt) {
          const shouldShow =
            isMobileViewport() && !fs && !fsDismissed && !isPlayingState && !inCutsceneInit;
          fsPrompt.classList.toggle("visible", shouldShow);
        }
      }

      document.addEventListener("fullscreenchange", syncFullscreenUI);
      document.addEventListener("webkitfullscreenchange", syncFullscreenUI);
      window.addEventListener("resize", syncFullscreenUI);

      if (btnFsPrompt) {
        let lastFsTap = 0;
        const onFsTap = (e) => {
          const now = Date.now();
          if (now - lastFsTap < 250) return;
          lastFsTap = now;
          e.preventDefault();
          e.stopPropagation();
          window.tendyAudio.touchUnlock();
          autoFsAttempted = true;
          requestOptimalFullscreen().then((ok) => {
            if (ok && fsPrompt) fsPrompt.classList.remove("visible");
          });
        };
        btnFsPrompt.addEventListener("touchend", onFsTap, { passive: false });
        btnFsPrompt.addEventListener("click", onFsTap);
      }

      if (btnFsDismiss) {
        const onDismiss = (e) => {
          e.preventDefault();
          e.stopPropagation();
          fsDismissed = true;
          syncFullscreenUI();
        };
        btnFsDismiss.addEventListener("touchend", onDismiss, { passive: false });
        btnFsDismiss.addEventListener("click", onDismiss);
      }

      if (btnFullscreen) {
        let lastToggle = 0;
        const onToggle = (e) => {
          const now = Date.now();
          if (now - lastToggle < 250) return;
          lastToggle = now;
          e.preventDefault();
          e.stopPropagation();
          window.tendyAudio.touchUnlock();
          toggleFullscreen();
        };

        btnFullscreen.addEventListener("click", onToggle);
      }

      function showTouchControls() {
        if (touchControls) touchControls.classList.add("active");
        syncFullscreenUI();
      }

      function updateJoyFromPoint(clientX, clientY) {
        const rect = joyZone.getBoundingClientRect();
        const cx = rect.left + rect.width * 0.5;
        const cy = rect.top + rect.height * 0.5;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > maxR) {
          dx = (dx / dist) * maxR;
          dy = (dy / dist) * maxR;
        }
        joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        const nx = dx / maxR;
        const ny = -dy / maxR;
        const mag = Math.hypot(nx, ny);
        if (mag < 0.12) {
          joyX = 0.0;
          joyY = 0.0;
        } else {
          joyX = nx;
          joyY = ny;
        }
      }

      function resetJoy() {
        joyTouchId = null;
        joyX = 0.0;
        joyY = 0.0;
        joyKnob.style.transform = "translate(0px, 0px)";
      }

      function isInJoystickArea(clientX, clientY) {
        if (!touchControls || !touchControls.classList.contains("playing") || !joyZone) {
          return false;
        }
        const r = joyZone.getBoundingClientRect();
        if (r.width <= 0 || r.height <= 0) return false;
        const pad = 42;
        return (
          clientX >= r.left - pad &&
          clientX <= r.right + pad &&
          clientY >= r.top - pad &&
          clientY <= r.bottom + pad
        );
      }

      function syncActiveTouches(e) {
        const live = new Set();
        if (e && e.touches) {
          for (const t of e.touches) live.add(t.identifier);

          resetJoy();
        }
        for (const id of lookTouches.keys()) {
          if (!live.has(id) || id === joyTouchId) {

          }
        }
        if (lookTouches.size === 0) {
          lookTouchId = null;
          lastPinchDist = null;
        } else if (lookTouches.size < 2) {
          lastPinchDist = null;
        }
      }

      function panWithPoint(id, pt) {
        if (lookTouchId !== id) {
          lookTouchId = id;
          lookLastX = pt.x;
          lookLastY = pt.y;
          return;
        }
        const dx = pt.x - lookLastX;
        const dy = pt.y - lookLastY;
        lookDX += dx;
        lookDY += dy;
        lookMoved += Math.hypot(dx, dy);
        lookLastX = pt.x;
        lookLastY = pt.y;
      }

      joyZone.addEventListener("touchstart", (e) => {
        showTouchControls();
        window.tendyAudio.touchUnlock();
        e.preventDefault();
        e.stopPropagation();
        syncActiveTouches(e);
        if (joyTouchId === null && e.changedTouches.length > 0) {
          const t = e.changedTouches[0];
          joyTouchId = t.identifier;
          lookTouches.delete(joyTouchId);
          lastPinchDist = null;
          zoomDelta = 0.0;
          updateJoyFromPoint(t.clientX, t.clientY);
        }
      }, { passive: false });

      function bindActionBtn(el, cb) {
        el.addEventListener("touchstart", (e) => {
          showTouchControls();
          window.tendyAudio.touchUnlock();
          e.preventDefault();
          e.stopPropagation();
          el.classList.add("pressed");
          cb();
        }, { passive: false });
        el.addEventListener("touchend", (e) => {
          e.preventDefault();
          el.classList.remove("pressed");
        }, { passive: false });
        el.addEventListener("touchcancel", () => {
          el.classList.remove("pressed");
        });
        el.addEventListener("click", (e) => {
          window.tendyAudio.touchUnlock();
          e.stopPropagation();
          if (e.detail > 0) cb();
        });
      }

      bindActionBtn(btnJump, () => { jumpQueued = true; });
      bindActionBtn(btnDash, () => { dashQueued = true; });
      // SABER: the press queues the swing and the finger staying down charges a heavy.
      if (btnAttack) {
        const attackUp = (e) => {
          if (e) e.preventDefault();
          attackTouchHeld = false;
          btnAttack.classList.remove("pressed");
        };
        btnAttack.addEventListener("touchstart", (e) => {
          showTouchControls();
          window.tendyAudio.touchUnlock();
          e.preventDefault();
          e.stopPropagation();
          btnAttack.classList.add("pressed");
          attackTouchHeld = true;
          attackQueued = true;
        }, { passive: false });
        btnAttack.addEventListener("touchend", attackUp, { passive: false });
        btnAttack.addEventListener("touchcancel", () => attackUp(null));
        btnAttack.addEventListener("click", (e) => {
          window.tendyAudio.touchUnlock();
          e.stopPropagation();
          if (e.detail > 0) attackQueued = true;
        });
      }
      // BLOCK is held, not tapped: the guard stays up while the finger stays down.
      if (btnBlock) {
        const blockUp = (e) => {
          if (e) e.preventDefault();
          blockHeld = false;
          btnBlock.classList.remove("pressed");
        };
        btnBlock.addEventListener("touchstart", (e) => {
          showTouchControls();
          window.tendyAudio.touchUnlock();
          e.preventDefault();
          e.stopPropagation();
          btnBlock.classList.add("pressed");
          blockHeld = true;
        }, { passive: false });
        btnBlock.addEventListener("touchend", blockUp, { passive: false });
        btnBlock.addEventListener("touchcancel", () => blockUp(null));
        btnBlock.addEventListener("mousedown", (e) => { e.stopPropagation(); blockHeld = true; });
        btnBlock.addEventListener("mouseup", () => { blockHeld = false; });
        btnBlock.addEventListener("mouseleave", () => { blockHeld = false; });
      }
      bindActionBtn(btnHelp, () => { helpQueued = true; });
      bindActionBtn(btnMute, () => { window.tendyAudio.toggleMute(); });

      window.addEventListener("touchstart", (e) => {
        showTouchControls();
        window.tendyAudio.touchUnlock();
        syncActiveTouches(e);
        if (e.target && e.target.closest && e.target.closest(".touch-ui")) return;
        for (const t of e.changedTouches) {
          if (t.identifier === joyTouchId) continue;
          if (joyTouchId === null && isInJoystickArea(t.clientX, t.clientY)) {
            joyTouchId = t.identifier;
            lookTouches.delete(t.identifier);
            lastPinchDist = null;
            zoomDelta = 0.0;
            updateJoyFromPoint(t.clientX, t.clientY);
            continue;
          }
          if (joyTouchId !== null && lookTouches.size >= 1) continue;
          lookTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
          if (lookTouches.size === 1) {
            lookTouchId = t.identifier;
            lookLastX = t.clientX;
            lookLastY = t.clientY;
            lookMoved = 0;
            lastPinchDist = null;
          }
        }
        if (joyTouchId === null && lookTouches.size >= 2) {
          e.preventDefault();
          const pts = Array.from(lookTouches.values());
          lastPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          lastPinchMidX = (pts[0].x + pts[1].x) * 0.5;
          lastPinchMidY = (pts[0].y + pts[1].y) * 0.5;
          lookMoved = 999;
        }
      }, { passive: false });

      window.addEventListener("touchmove", (e) => {
        syncActiveTouches(e);
        let updatedLook = false;
        for (const t of e.changedTouches) {
          if (t.identifier === joyTouchId) {
            e.preventDefault();
            updateJoyFromPoint(t.clientX, t.clientY);
          } else if (lookTouches.has(t.identifier)) {
            lookTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
            updatedLook = true;
          }
        }
        if (joyTouchId !== null) {
          lastPinchDist = null;
          zoomDelta = 0.0;
        }
        if (!updatedLook) return;
        e.preventDefault();
        if (joyTouchId !== null) {
          if (lookTouches.size >= 1) {
            const [id, pt] = lookTouches.entries().next().value;
            panWithPoint(id, pt);
          }
        } else if (lookTouches.size >= 2) {
          const pts = Array.from(lookTouches.values());
          const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          const midX = (pts[0].x + pts[1].x) * 0.5;
          const midY = (pts[0].y + pts[1].y) * 0.5;
          if (lastPinchDist !== null) {
            if (Math.abs(dist - lastPinchDist) > 1.2) {
              zoomDelta -= (dist - lastPinchDist) * 0.04;
            }
            lookDX += midX - lastPinchMidX;
            lookDY += midY - lastPinchMidY;
          }
          lastPinchDist = dist;
          lastPinchMidX = midX;
          lastPinchMidY = midY;
          lookMoved = 999;
        } else if (lookTouches.size === 1) {
          const [id, pt] = lookTouches.entries().next().value;
          panWithPoint(id, pt);
        }
      }, { passive: false });

      function endTouch(e) {
        let triggeredTap = false;
        for (const t of e.changedTouches) {
          if (t.identifier === joyTouchId) {
            resetJoy();
          } else if (lookTouches.has(t.identifier)) {
            lookTouches.delete(t.identifier);
            if (lookTouches.size === 0) {
              if (lookMoved < 14) {
                actionTapQueued = true;
                triggeredTap = true;
              }
              lookTouchId = null;
              lastPinchDist = null;
            }
          }
        }
        syncActiveTouches(e);
        if (lookTouches.size === 1) {
          const [id, pt] = lookTouches.entries().next().value;
          lookTouchId = id;
          lookLastX = pt.x;
          lookLastY = pt.y;
          lookMoved = 999;
        }
        if (
          triggeredTap &&
          !isPlayingState &&
          !fsDismissed &&
          !autoFsAttempted &&
          isMobileViewport() &&
          !(e.target && e.target.closest && e.target.closest(".touch-ui"))
        ) {
          autoFsAttempted = true;
          requestOptimalFullscreen();
        }
      }
      window.addEventListener("touchend", endTouch, { passive: false });
      window.addEventListener("touchcancel", endTouch, { passive: false });

      window.addEventListener("wheel", (e) => {
        e.preventDefault();
        let dy = e.deltaY;
        if (e.deltaMode === 1) dy *= 32.0;
        else if (e.deltaMode === 2) dy *= 300.0;
        zoomDelta += dy * 0.012;
      }, { passive: false });

      let pendingInitMode = (() => {
        const s = window.location.search;
        if (s.includes("free_roam=1")) return 17;
        if (s.includes("cutscene=1")) return 1;
        if (s.includes("boss=1")) return 2;
        if (s.includes("anime=1")) return 3;
        if (s.includes("city_intro=1")) return 4;
        if (s.includes("city=1")) return 5;
        if (s.includes("city_titan=1")) return 6;
        if (s.includes("city_crew_kaiju=1")) return 16;
        if (s.includes("city_crew=1")) return 15;
        if (s.includes("headphones=2") || s.includes("uzumaki=1")) return 8;
        if (s.includes("headphones=1")) return 7;
        if (s.includes("tj=1") || s.includes("tj_cutscene=1")) return 9;
        if (s.includes("derek=1")) return 10;
        if (s.includes("nate=1")) return 11;
        if (s.includes("glenn=1")) return 12;
        if (s.includes("mike=1")) return 13;
        if (s.includes("lexie_victory=1")) return 14;
        return 0;
      })();
      const debugKeysEnabled = /[?&]debug=1(?:&|$)/.test(window.location.search);

      // --- Cutscene skip input: gamepad Start and the touch SKIP button (Enter is read in Bevy) ---
      const autoSkipEnabled = debugKeysEnabled && /[?&]autoskip=1(?:&|$)/.test(window.location.search);
      const btnSkip = document.getElementById("btn-skip");
      const btnSkipFill = document.getElementById("btn-skip-fill");
      let skipTouchHeld = false;
      let cutsceneSkipActive = false;
      let gpStartHeld = false;
      let skipTouchUiCache = false;
      let skipTouchUiAt = -1e9;
      if (btnSkip) {
        const skipDown = (e) => {
          e.preventDefault();
          e.stopPropagation();
          skipTouchHeld = true;
          try { btnSkip.setPointerCapture(e.pointerId); } catch (_) {}
        };
        const skipUp = () => { skipTouchHeld = false; };
        btnSkip.addEventListener("pointerdown", skipDown);
        btnSkip.addEventListener("pointerup", skipUp);
        btnSkip.addEventListener("pointercancel", skipUp);
        btnSkip.addEventListener("lostpointercapture", skipUp);
        btnSkip.addEventListener("touchstart", (e) => e.stopPropagation(), { passive: true });
      }
      function skipTouchUi() {
        const now = performance.now();
        if (now - skipTouchUiAt > 500) {
          skipTouchUiAt = now;
          skipTouchUiCache = !!isMobileViewport();
        }
        return skipTouchUiCache;
      }
      function setCutsceneSkip(active, progress) {
        const on = !!active;
        if (on && !cutsceneSkipActive) {
          // Start means skip during cutscenes; drop any help request queued just before.
          helpQueued = false;
        }
        if (!on) skipTouchHeld = false;
        cutsceneSkipActive = on;
        document.body.classList.toggle("cutscene-skip", on);
        document.body.classList.toggle("touch-skip", on && skipTouchUi());
        if (btnSkipFill) {
          const p = Math.max(0, Math.min(1, +progress || 0));
          btnSkipFill.style.width = (p * 100).toFixed(0) + "%";
        }
      }
      let pendingCutsceneTime = (() => {
        try {
          const m = window.location.search.match(/[?&]cutscene_t=([0-9]+(?:\.[0-9]+)?)/);
          return m ? parseFloat(m[1]) : -1.0;
        } catch (_) {
          return -1.0;
        }
      })();

      function setPlaying(active) {
        isPlayingState = !!active;
        if (touchControls) {
          touchControls.classList.toggle("playing", isPlayingState);
        }
        if (!active) {
          resetJoy();
        }
        syncFullscreenUI();
      }

      function setBossMode(active) {
        bossModeActive = !!active;
        if (!active) {
          blockHeld = false;
          attackTouchHeld = false;
        }
        if (touchControls) {
          touchControls.classList.toggle("boss-mode", !!active);
        }
        if (btnDash) {
          btnDash.textContent = active ? "ROLL" : "DASH";
        }
      }

      function setUzumakiMode(level) {
        const on = (level | 0) > 0;
        document.body.classList.toggle("uzumaki-mode", on);
      }

      function setTutorialVisible(active) {
        document.body.classList.toggle("tutorial-active", !!active);
      }

      window.tendyFullscreen = {
        request: requestOptimalFullscreen,
        toggle: toggleFullscreen,
        isFullscreen,
        syncUI: syncFullscreenUI,
      };
      syncFullscreenUI();

      if (window.location.search.includes("autotest=walk")) {
        showTouchControls();
        setTimeout(() => {
          actionTapQueued = true;
          joyX = 0.18;
          joyY = 1.0;
          joyKnob.style.transform = "translate(8px, -44px)";
        }, 2500);
      }

      // --- PC Gamepad / Controller Support (W3C Gamepad API) ---
      let gpX = 0.0;
      let gpY = 0.0;
      let gpLastPoll = 0;
      const gpPrevBtns = [];
      const gpNavPrev = [];
      let gpNavStick = 0;
      let menuNav = 0;
      let lastInputPad = false;
      const synthKey = (code, key, down) => {
        try {
          window.dispatchEvent(new KeyboardEvent(down ? "keydown" : "keyup", { code, key, bubbles: true }));
        } catch (_) {}
      };
      function pollGamepad() {
        const now = performance.now();
        // Dedupe the several polls made within one Bevy frame (moveX/moveY/takeLook*), but never
        // skip a whole frame: look input is integrated by dtMs, so high refresh rates stay smooth.
        if (now - gpLastPoll < 1) return;
        const dtMs = gpLastPoll ? Math.min(50, now - gpLastPoll) : 16;
        gpLastPoll = now;
        gpX = 0.0;
        gpY = 0.0;
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        let pad = null;
        for (let i = 0; i < pads.length; i++) {
          if (pads[i] && pads[i].connected) { pad = pads[i]; break; }
        }
        if (!pad) {
          gpStartHeld = false;
          gpAttackHeld = false;
          return;
        }
        const dz = (v) => (Math.abs(v) < 0.16 ? 0.0 : (v - Math.sign(v) * 0.16) / 0.84);
        let lx = dz(pad.axes[0] || 0);
        let ly = -dz(pad.axes[1] || 0);
        const btnDown = (i) => !!(pad.buttons[i] && pad.buttons[i].pressed);
        gpStartHeld = btnDown(9);
        gpAttackHeld = btnDown(5) || btnDown(7);
        if (btnDown(12)) ly = 1.0;
        if (btnDown(13)) ly = -1.0;
        if (btnDown(14)) lx = -1.0;
        if (btnDown(15)) lx = 1.0;
        gpX = Math.max(-1.0, Math.min(1.0, lx));
        gpY = Math.max(-1.0, Math.min(1.0, ly));

        // Right stick: radial deadzone (no snapping to axes) with a mild response curve
        // for fine aiming near centre and full speed at the rim.
        let rx = 0.0;
        let ry = 0.0;
        {
          const ax = pad.axes[2] || 0;
          const ay = pad.axes[3] || 0;
          const mag = Math.hypot(ax, ay);
          const lookDz = 0.16;
          if (mag > lookDz) {
            const n = Math.min(1.0, (mag - lookDz) / (1.0 - lookDz));
            const curved = Math.pow(n, 1.5);
            rx = (ax / mag) * curved;
            ry = (ay / mag) * curved;
          }
        }
        if (rx !== 0.0 || ry !== 0.0) {
          const scale = (dtMs / 16.0) * 9.5;
          lookDX += rx * scale;
          lookDY += ry * scale;
        }

        const edge = (idx, onDown, onUp) => {
          const cur = btnDown(idx);
          const prev = !!gpPrevBtns[idx];
          if (cur && !prev) {
            window.tendyAudio.touchUnlock();
            if (onDown) onDown();
          } else if (!cur && prev && onUp) {
            onUp();
          }
          gpPrevBtns[idx] = cur;
        };
        edge(0, () => { jumpQueued = true; actionTapQueued = true; synthKey("Space", " ", true); }, () => synthKey("Space", " ", false));
        edge(1, () => { dashQueued = true; synthKey("ShiftLeft", "Shift", true); }, () => synthKey("ShiftLeft", "Shift", false));
        edge(2, () => synthKey("KeyF", "f", true), () => synthKey("KeyF", "f", false));
        edge(3, () => synthKey("KeyQ", "q", true), () => synthKey("KeyQ", "q", false));
        edge(4, () => synthKey("KeyP", "p", true), () => synthKey("KeyP", "p", false));
        // RB / RT: saber attack (tap light, hold to charge a heavy).
        edge(5, () => { attackQueued = true; });
        // LT (L2): hold to raise the saber guard in boss fights (same as holding R).

        moveY: () => { pollGamepad(); return Math.abs(gpY) > 0.01 ? gpY : joyY; },
        takeLookDX() { pollGamepad(); const v = lookDX; lookDX = 0.0; return v; },
        takeLookDY() { pollGamepad(); const v = lookDY; lookDY = 0.0; return v; },
        takeZoomDelta() { const v = zoomDelta; zoomDelta = 0.0; return v; },
        takeJump() { const v = jumpQueued; jumpQueued = false; return v; },
        takeDash() { const v = dashQueued; dashQueued = false; return v; },
        takeAttack() { const v = attackQueued; attackQueued = false; return v; },
        blockHeld() { return blockHeld; },
        attackHeld() { pollGamepad(); return attackTouchHeld || gpAttackHeld; },
        takeActionTap() { const v = actionTapQueued; actionTapQueued = false; return v; },
        takeHelp() { const v = helpQueued; helpQueued = false; return v; },
        setPlaying,
        setBossMode,
        setUzumakiMode,
        setTutorialVisible,
        initMode() { const m = pendingInitMode; pendingInitMode = 0; return m; },
        // Debug scene-skip keys (K / B / P) are only live with ?debug=1 in the URL.
        debugKeys() { return debugKeysEnabled; },
        // Debug combat motion demo: ?debug=1&combat_demo=loop (or light:0.4, heavy:0.5, block, roll:0.5).
        combatDemo() {
          if (!debugKeysEnabled) return "";
          const m = window.location.search.match(/[?&]combat_demo=([A-Za-z0-9.:_-]+)/);
          return m ? m[1] : "";
        },
        // Debug: ?debug=1&city_start=pub (or pubin, door, sky, crew) drops Stan there on a fresh city entry.
        cityStart() {
          if (!debugKeysEnabled) return "";
          const m = window.location.search.match(/[?&]city_start=([a-z]+)/);
          return m ? m[1] : "";
        },
        takeCutsceneStartTime() { const t = pendingCutsceneTime; pendingCutsceneTime = -1.0; return t; },
        skipHeld() { pollGamepad(); return skipTouchHeld || gpStartHeld; },
        skipTouchUi,
        setCutsceneSkip,

        autoSkip() { return autoSkipEnabled; },
        // Pause menu: -1 up, 1 down, 3 back (B), 0 nothing; polls the pad itself because
        // gameplay systems (which normally poll it) are paused while the menu is open.
        takeMenuNav() { pollGamepad(); const v = menuNav; menuNav = 0; return v; },
        usingGamepad() { return lastInputPad; },
        takePointerLockLost() { const v = pointerLockLost; pointerLockLost = false; return v; },
        takeDebugPause() { const v = debugPausePending; debugPausePending = false; return v; },
        // Debug: ?debug=1&at_beer=1 starts Stan inside Pub 217 facing the beer tower.
        atBeer() { return debugKeysEnabled && /[?&]at_beer=1(?:&|$)/.test(window.location.search); },

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tendy Quest — Giant Kitchen</title>
  
  
  
  <script>
    window.tendySave = {
      saveCheckpoint(json) {
        try {
          localStorage.setItem("tendy_quest_save_v1", String(json || ""));
        } catch (_) {}
      },
      loadCheckpoint() {
        try {
          return localStorage.getItem("tendy_quest_save_v1") || "";
        } catch (_) {
          return "";
        }
      },
      clearCheckpoint() {
        try {
          localStorage.removeItem("tendy_quest_save_v1");
        } catch (_) {}
      },
      markMomDefeated() {
        try {
          localStorage.setItem("tendy_quest_mom_defeated_v1", "1");
        } catch (_) {}
      },
      hasDefeatedMom() {
        try {
          return localStorage.getItem("tendy_quest_mom_defeated_v1") === "1";
        } catch (_) {
          return false;
        }
      },
      clearAllProgress() {
        try {
          localStorage.removeItem("tendy_quest_save_v1");
          localStorage.removeItem("tendy_quest_mom_defeated_v1");
        } catch (_) {}
      },
    };
    window.tendyTelemetry = {
      state: "Tutorial",
      hearts: 5,
      tendies: 0,
      stamina: 100,
      bossHp: 100,
      credits: 0,
      inCity: false,
      // Ferris wheel debug line (debug=1 runs with city_start=wheel or wheel_demo only).
      wheel: "",
      setWheel(line) {
        this.wheel = line;
      },
      // Skate park debug demos (?debug=1&park_demo=...) append per-frame state lines here.
      parkLog(line) {
        const log = (window.tendyParkLog = window.tendyParkLog || []);
        log.push(line);
        if (log.length > 20000) log.shift();
      },
      update(state, hearts, tendies, stamina, bossHp, credits, inCity) {
        this.state = state;
        this.hearts = hearts;
        this.tendies = tendies;
        this.stamina = stamina;
        this.bossHp = bossHp;
        this.credits = credits;
        this.inCity = inCity;
      },
    };
    // Loading screen handoff. The game boots behind its own black fade overlay and calls
    // ready() once the hero + Level 1 scenes have loaded (or its timeout passes). The HTML
    // loading screen then fades out (CSS opacity transition) instead of vanishing, and the game
    // fades in from black underneath it. A fallback timer fades it anyway if ready() never comes.
    window.tendyBoot = {
      isReady: false,
      hidden: false,
      ready() {
        this.isReady = true;
        this.hide();
      },
      hide() {
        if (this.hidden) return;
        const el = document.getElementById("loading");
        if (!el) return;
        this.hidden = true;
        el.style.pointerEvents = "none";
        el.style.opacity = "0";
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          el.style.display = "none";
        };
        el.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 700);
      },
    };
    window.tendyAudio = (() => {
      const SFX_NAMES = [
        "jump", "double_jump", "dash", "tendy", "powerup",
        "hit", "shield", "step", "lunge", "win", "lose"
      ];
      let ctx = null;
      let masterGain = null;
      let bgmGain = null;
      let ambGain = null;
      let bgmSource = null;
      let ambSource = null;
      let bgmRequested = false;
      let bgmStarted = false;
      let ambStarted = false;
      let muted = false;
      const buffers = {};
      const loading = {};

      function ensureCtx() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          masterGain = ctx.createGain();
          masterGain.gain.value = muted ? 0.0 : 1.0;
          masterGain.connect(ctx.destination);

          bgmGain = ctx.createGain();
          bgmGain.gain.value = 0.42;
          bgmGain.connect(masterGain);

          ambGain = ctx.createGain();
          ambGain.gain.value = 0.14;
          ambGain.connect(masterGain);
        }
        return ctx;
      }

      async function loadBuffer(key, url) {
        if (buffers[key]) return buffers[key];
        if (loading[key]) return loading[key];
        const ac = ensureCtx();
        if (!ac) return null;
        loading[key] = fetch(url)
          .then((res) => (res.ok ? res.arrayBuffer() : null))
          .then((arr) => (arr ? ac.decodeAudioData(arr) : null))
          .then((buf) => {
            if (buf) buffers[key] = buf;
            return buf;
          })
          .catch(() => null);
        return loading[key];
      }

      function preloadAll() {
        try {
          loadBuffer("bgm", "assets/audio/tendies_from_the_sun.mp3").then(() => {
            if (bgmRequested) startLoops();
          });
          loadBuffer("ambience", "assets/audio/kitchen_ambience.mp3").then(() => {
            if (bgmRequested) startLoops();
          });
          for (const name of SFX_NAMES) {
            loadBuffer(name, `assets/audio/${name}.wav`);
          }
        } catch (_) {}
      }

      let droneOsc1 = null;
      let droneOsc2 = null;
      let droneGain = null;
      let bossTimer = null;
      let bossStep = 0;
      let vikingTimer = null;
      let vikingStep = 0;
      let headphoneTimer = null;
      let headphoneStep = 0;

      // Music changes crossfade instead of hard-stopping: every procedural track plays through
      // its own bus gain that ramps in over MUSIC_FADE_S; on a change the old bus ramps out while
      // its sequencer keeps ticking into it, and is torn down once silent. The looped bgm/ambience
      // buffers just ramp their gains. This removes the clicks from cutting oscillators mid-cycle.
      const MUSIC_FADE_S = 0.3;
      let musicBus = null;
      let currentTrack = "";
      let trackStartedMs = -1e9;

      function rampGain(param, target, secs) {
        if (!ctx || !param) return;
        const now = ctx.currentTime;
        try {
          if (param.cancelAndHoldAtTime) {
            param.cancelAndHoldAtTime(now);
          } else {
            const v = param.value;
            param.cancelScheduledValues(now);
            param.setValueAtTime(v, now);
          }
          param.linearRampToValueAtTime(target, now + secs);
        } catch (_) {
          try { param.setValueAtTime(target, now); } catch (_) {}
        }
      }

      // Fresh fading-in output bus for the track being started; returns its input node.
      function newMusicBus(ac) {
        const bus = ac.createGain();
        bus.gain.setValueAtTime(0.0, ac.currentTime);
        bus.gain.linearRampToValueAtTime(1.0, ac.currentTime + MUSIC_FADE_S);
        bus.connect(masterGain);
        musicBus = bus;
        return bus;
      }

      // Several systems can ask for the same track in one frame (e.g. a cutscene exit and the
      // OnEnter of the state it returns to). Restarting it would just re-trigger the fade.
      function isTrackRestart(name) {
        const now = performance.now();
        if (name === currentTrack && now - trackStartedMs < 250) return true;
        currentTrack = name;
        trackStartedMs = now;
        return false;
      }

      function stopSpecialAudio() {
        try {
          const timers = [bossTimer, vikingTimer, headphoneTimer];
          const oscs = [droneOsc1, droneOsc2];
          const oldDrone = droneGain;
          const oldBus = musicBus;
          bossTimer = null;
          vikingTimer = null;
          headphoneTimer = null;
          droneOsc1 = null;
          droneOsc2 = null;
          droneGain = null;
          musicBus = null;
          if (ctx) {
            const end = ctx.currentTime + MUSIC_FADE_S + 0.05;
            if (oldBus) rampGain(oldBus.gain, 0.0, MUSIC_FADE_S);
            for (const o of oscs) {
              if (o) { try { o.stop(end); } catch (_) {} }
            }
          }
          setTimeout(() => {
            for (const t of timers) { if (t) clearInterval(t); }
            for (const o of oscs) { if (o) { try { o.disconnect(); } catch (_) {} } }
            try { if (oldDrone) oldDrone.disconnect(); } catch (_) {}
            try { if (oldBus) oldBus.disconnect(); } catch (_) {}
          }, (MUSIC_FADE_S + 0.1) * 1000);
          if (bgmGain) rampGain(bgmGain.gain, 0.0, MUSIC_FADE_S);
          if (ambGain) rampGain(ambGain.gain, 0.0, MUSIC_FADE_S);
        } catch (_) {}
      }

      // Short band-passed white-noise burst (snares, crunches, door thuds), shaped like the
      // mkOsc envelopes: quick attack, exponential decay. Routes to the SFX master unless a
      // destination bus is passed (music loops pass their own bus).
      let sfxNoiseBuf = null;
      function mkNoise(dur, gainPeak, freq, dest) {
        const ac = ensureCtx();
        if (!ac || !masterGain) return;
        if (!sfxNoiseBuf || sfxNoiseBuf.sampleRate !== ac.sampleRate) {
          const len = Math.floor(ac.sampleRate * 1.0);
          sfxNoiseBuf = ac.createBuffer(1, len, ac.sampleRate);
          const d = sfxNoiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        }
        const now = ac.currentTime;
        const src = ac.createBufferSource();
        src.buffer = sfxNoiseBuf;
        const bp = ac.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = freq;
        bp.Q.value = 0.9;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(gainPeak, now + 0.008);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        src.connect(bp);
        bp.connect(g);
        g.connect(dest || masterGain);
        src.start(now);
        src.stop(now + dur + 0.02);
      }

      function synthProcSfx(name) {
        const ac = ensureCtx();
        if (!ac || !masterGain) return false;
        const now = ac.currentTime;
        const mkOsc = (type, f0, f1, dur, gainPeak) => {
          const osc = ac.createOscillator();
          const g = ac.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(f0, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(gainPeak, now + 0.015);
          g.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(g);
          g.connect(masterGain);
          osc.start(now);
          osc.stop(now + dur + 0.02);
        };
        if (name === "saber_ignite") {
          mkOsc("sawtooth", 110, 420, 0.36, 0.28);
          mkOsc("triangle", 220, 140, 0.45, 0.22);
          return true;
        }
        if (name === "saber_swing") {
          mkOsc("sawtooth", 340, 135, 0.19, 0.22);
          mkOsc("sine", 560, 210, 0.17, 0.14);
          return true;
        }
        if (name === "saber_hit") {
          mkOsc("square", 680, 120, 0.16, 0.30);
          mkOsc("sawtooth", 980, 240, 0.14, 0.20);
          return true;
        }
        if (name === "dodge_roll") {
          mkOsc("sine", 240, 520, 0.18, 0.22);
          return true;
        }
        if (name === "saber_block") {
          mkOsc("square", 1250, 620, 0.12, 0.20);
          mkOsc("sawtooth", 180, 90, 0.16, 0.22);
          return true;
        }
        if (name === "saber_parry") {
          mkOsc("square", 1500, 1900, 0.10, 0.20);
          mkOsc("triangle", 2400, 1200, 0.24, 0.18);
          mkOsc("sawtooth", 220, 110, 0.18, 0.20);
          return true;
        }
        if (name === "guard_break") {
          mkOsc("sawtooth", 420, 70, 0.32, 0.30);
          mkOsc("square", 160, 60, 0.30, 0.20);
          return true;
        }
        if (name === "thunder") {
          mkOsc("sawtooth", 95, 32, 0.75, 0.36);
          return true;
        }
        if (name === "mom_yell") {
          mkOsc("sawtooth", 540, 380, 0.32, 0.26);
          mkOsc("square", 720, 460, 0.24, 0.14);
          return true;
        }
        if (name === "garlic_throw") {
          mkOsc("sawtooth", 210, 95, 0.28, 0.26);
          mkOsc("triangle", 340, 150, 0.24, 0.18);
          return true;
        }
        if (name === "car_horn") {
          mkOsc("sawtooth", 392, 388, 0.22, 0.22);
          mkOsc("square", 494, 490, 0.22, 0.16);
          return true;
        }
        if (name === "car_door") {
          mkOsc("triangle", 190, 72, 0.11, 0.24);
          mkNoise(0.06, 0.16, 450);
          return true;
        }
        if (name === "car_drift") {
          mkNoise(0.18, 0.14, 1850);
          mkOsc("sawtooth", 580, 520, 0.14, 0.06);
          return true;
        }
        if (name === "car_crash") {
          mkNoise(0.24, 0.34, 900);
          mkOsc("sawtooth", 140, 48, 0.22, 0.28);
          return true;
        }
        if (name === "estus_drink") {
          mkOsc("sine", 523, 784, 0.28, 0.22);
          mkOsc("triangle", 659, 1046, 0.34, 0.16);
          return true;
        }
        if (name === "hack_blip") {
          mkOsc("square", 880, 1320, 0.05, 0.14);
          return true;
        }
        if (name === "hack_deny") {
          mkOsc("sawtooth", 190, 120, 0.14, 0.20);
          return true;
        }
        if (name === "hack_success") {
          mkOsc("square", 523, 1046, 0.16, 0.22);
          setTimeout(() => mkOsc("sine", 784, 1568, 0.22, 0.22), 90);
          return true;
        }
        if (name === "smoke_puff") {
          mkNoise(0.45, 0.16, 650);
          mkOsc("sine", 240, 360, 0.35, 0.12);
          return true;
        }
        if (name === "killbill_siren") {
          mkOsc("sawtooth", 680, 960, 0.35, 0.22);
          setTimeout(() => mkOsc("sawtooth", 960, 620, 0.42, 0.20), 260);
          return true;
        }
        if (name === "headphone_crunch") {
          mkOsc("sawtooth", 620, 75, 0.34, 0.34);
          mkOsc("square", 1180, 140, 0.26, 0.28);
          mkOsc("triangle", 290, 48, 0.42, 0.30);
          return true;
        }
        if (name === "grind") {
          mkNoise(0.15, 0.10, 3400);
          mkOsc("sawtooth", 1850, 1650, 0.13, 0.025);
          return true;
        }
        if (name === "grind_lock") {
          mkOsc("square", 1500, 620, 0.09, 0.16);
          mkNoise(0.10, 0.20, 2600);
          return true;
        }
        if (name === "rage_swell") {
          mkOsc("sawtooth", 85, 175, 0.22, 0.22);
          mkOsc("sine", 55, 115, 0.24, 0.26);
          return true;
        }
        // --- Body-horror Foley for John Carpenter's The Thing style Lexie meltdown ---
        const mkResNoise = (filterType, delay, dur, gainPeak, f0, f1, q) => {
          if (!sfxNoiseBuf || sfxNoiseBuf.sampleRate !== ac.sampleRate) {
            const len = Math.floor(ac.sampleRate * 1.0);
            sfxNoiseBuf = ac.createBuffer(1, len, ac.sampleRate);
            const d = sfxNoiseBuf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          }
          const t0 = now + delay;
          const src = ac.createBufferSource();
          src.buffer = sfxNoiseBuf;
          src.loop = dur > 0.9;
          const flt = ac.createBiquadFilter();
          flt.type = filterType;
          flt.frequency.setValueAtTime(f0, t0);
          flt.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
          flt.Q.value = q;
          const g = ac.createGain();
          g.gain.setValueAtTime(0.001, t0);
          g.gain.linearRampToValueAtTime(gainPeak, t0 + 0.012);
          g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
          src.connect(flt);
          flt.connect(g);
          g.connect(masterGain);
          src.start(t0);
          src.stop(t0 + dur + 0.02);
        };
        if (name === "flesh_tear") {
          // Layered ripping wet tissue & low meat tear thump
          mkResNoise("bandpass", 0.0, 0.42, 0.36, 1800, 320, 4.5);
          mkResNoise("bandpass", 0.09, 0.34, 0.30, 1250, 210, 6.5);
          mkOsc("sawtooth", 195, 58, 0.32, 0.24);
          mkOsc("sine", 95, 36, 0.36, 0.28);
          return true;
        }
        if (name === "wet_squelch") {
          // Staggered high-Q resonant bubble & gelatinous viscera bursts
          const pops = [
            [0.0, 0.14, 0.30, 240, 880, 9.5],
            [0.06, 0.16, 0.28, 760, 220, 10.5],
            [0.13, 0.15, 0.26, 310, 950, 8.5],
            [0.20, 0.18, 0.24, 620, 180, 11.0],
          ];
          for (const [d, dur, pk, f0, f1, q] of pops) {
            mkResNoise("bandpass", d, dur, pk, f0, f1, q);
          }
          mkOsc("triangle", 340, 115, 0.18, 0.16);
          return true;
        }
        if (name === "bone_crack") {
          // Crisp staggered skeletal snaps + low joint dislocation thud
          mkResNoise("highpass", 0.0, 0.055, 0.42, 2400, 1400, 1.8);
          mkResNoise("highpass", 0.035, 0.065, 0.36, 2600, 1100, 2.2);
          mkResNoise("highpass", 0.075, 0.050, 0.28, 2100, 900, 2.0);
          mkOsc("square", 1400, 180, 0.06, 0.26);
          mkOsc("sine", 110, 38, 0.16, 0.30);
          return true;
        }
        if (name === "thing_shriek") {
          // Detuned dual-sawtooth multi-stage alien shriek + raspy band-pass roar
          for (const [type, f0, f1, f2, f3, pk] of [
            ["sawtooth", 1450, 520, 1680, 180, 0.24],
            ["sawtooth", 1412, 545, 1610, 174, 0.22],
          ]) {
            const osc = ac.createOscillator();
            const g = ac.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(f0, now);
            osc.frequency.exponentialRampToValueAtTime(f1, now + 0.24);
            osc.frequency.exponentialRampToValueAtTime(f2, now + 0.52);
            osc.frequency.exponentialRampToValueAtTime(f3, now + 0.90);
            g.gain.setValueAtTime(0.001, now);
            g.gain.linearRampToValueAtTime(pk, now + 0.03);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.92);
            osc.connect(g);
            g.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.94);
          }
          mkResNoise("bandpass", 0.0, 0.85, 0.32, 1600, 420, 3.2);
          return true;
        }
        if (name === "fire_roar") {
          // Deep roaring inferno rumble + mid crackle whoosh + staggered embers
          mkResNoise("lowpass", 0.0, 1.2, 0.28, 240, 140, 1.2);
          mkResNoise("bandpass", 0.04, 0.9, 0.16, 720, 420, 1.8);
          for (const d of [0.05, 0.22, 0.44, 0.72]) {
            mkResNoise("highpass", d, 0.04, 0.22, 3200, 1800, 1.6);
          }
          return true;
        }
        if (name === "snap_shutter") {
          mkResNoise("highpass", 0.0, 0.04, 0.26, 2800, 1400, 1.5);
          mkOsc("sine", 880, 1175, 0.10, 0.16);
          return true;
        }
        if (name === "snap_pop") {
          mkOsc("sine", 520, 1040, 0.11, 0.18);
          setTimeout(() => mkOsc("triangle", 780, 1320, 0.09, 0.15), 55);
          return true;
        }
        return false;
      }

      function startLoops() {
        const ac = ensureCtx();
        if (!ac || ac.state !== "running") return;
        if (!bgmStarted && buffers["bgm"]) {
          bgmStarted = true;
          bgmSource = ac.createBufferSource();
          bgmSource.buffer = buffers["bgm"];
          bgmSource.loop = true;
          bgmSource.connect(bgmGain);
          bgmSource.start(0);
        }
        if (!ambStarted && buffers["ambience"]) {
          ambStarted = true;
          ambSource = ac.createBufferSource();
          ambSource.buffer = buffers["ambience"];
          ambSource.loop = true;
          ambSource.connect(ambGain);
          ambSource.start(0);
        }
      }

      function unlockAndMaybeStart() {
        try {
          const ac = ensureCtx();
          if (!ac) return;
          if (ac.state === "suspended") {
            ac.resume().then(() => {
              if (bgmRequested) startLoops();
            }).catch(() => {});
          } else if (bgmRequested) {
            startLoops();
          }
        } catch (_) {}
      }

      window.addEventListener("pointerdown", () => {
        preloadAll();
        unlockAndMaybeStart();
      });
      window.addEventListener("keydown", () => {
        preloadAll();
        unlockAndMaybeStart();
      });
      window.addEventListener("load", preloadAll);

      return {
        playBgm() {
          if (isTrackRestart("bgm")) return;
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (ac && bgmGain) rampGain(bgmGain.gain, 0.42, MUSIC_FADE_S);
            if (ac && ambGain) rampGain(ambGain.gain, 0.14, MUSIC_FADE_S);
            if (bgmSource) bgmSource.playbackRate.value = 1.0;
          } catch (_) {}
        },
        playCutsceneMusic() {
          if (isTrackRestart("cutscene")) return;
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (!ac || !masterGain) return;
            const out = newMusicBus(ac);
            if (bgmGain) rampGain(bgmGain.gain, 0.0, MUSIC_FADE_S);
            if (ambGain) rampGain(ambGain.gain, 0.06, MUSIC_FADE_S);
            const filter = ac.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.value = 240;
            droneGain = ac.createGain();
            droneGain.gain.value = 0.22;
            filter.connect(droneGain);
            droneGain.connect(out);
            droneOsc1 = ac.createOscillator();
            droneOsc1.type = "sawtooth";
            droneOsc1.frequency.value = 55;
            droneOsc2 = ac.createOscillator();
            droneOsc2.type = "sawtooth";
            droneOsc2.frequency.value = 82.41;
            droneOsc1.connect(filter);
            droneOsc2.connect(filter);
            droneOsc1.start();
            droneOsc2.start();
          } catch (_) {}
        },
        playHeadphoneMusic(level = 1) {
          if (isTrackRestart("headphone" + level)) return;
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (!ac || !masterGain) return;

          narrator_cosmic: { pitch: 0.54, rate: 1.06 },
          tj_upset: { pitch: 1.32, rate: 1.12, volume: 1.0 },
        },
        // Fixed order so the cast is deterministic for a given installed voice list.
        _VOICE_ORDER: ["stan", "narrator", "mom", "lexie", "tj", "derek", "nate", "glenn", "mike", "chillary"],
        _voiceCast: null,
        _voiceCastKey: "",
        _voiceCastLocked: false,
        _voiceListening: false,
        _voiceProfile(role) {
          const r = String(role || "");
          let who = "narrator";
          for (const w of this._VOICE_ORDER) {
            if (r === w || r.startsWith(w + "_")) { who = w; break; }
          }
          const base = this._VOICE_PROFILES[who];
          const mood = this._VOICE_MOODS[r] || {};
          return {
            who,
            pitch: mood.pitch !== undefined ? mood.pitch : base.pitch,
            rate: mood.rate !== undefined ? mood.rate : base.rate,
            volume: mood.volume !== undefined ? mood.volume : base.volume,
          };
        },
        _voiceScore(v, pageLang, pageBase) {
          const n = String(v.name || "").toLowerCase();
          let s = 0;
          if (/natural|neural/.test(n)) s += 40;
          if (/premium|enhanced/.test(n)) s += 30;
          if (/online/.test(n)) s += 25;
          if (/google/.test(n)) s += 20;
          if (/siri/.test(n)) s += 15;
          // eSpeak and the macOS novelty voices are a last resort.
          if (/espeak|albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|superstar|trinoids|whisper|wobble|zarvox/.test(n)) s -= 200;
          // Child voices (e.g. Edge's "Ana" and "Maisie") must never be cast as an adult.
          if (/\b(ana|maisie)\b|child|kid|junior/.test(n)) s -= 200;
          const lang = String(v.lang || "").toLowerCase().replace("_", "-");
          if (lang === pageLang) s += 12;
          else if (lang.split("-")[0] === pageBase) s += 6;
          return s;
        },
        _voiceGender(v) {
          const n = " " + String(v.name || "").toLowerCase() + " ";
          // "Google US English" is a female voice even though its name does not say so.
          if (/google us english/.test(n)) return "f";
          if (/female|woman|\b(zira|aria|jenny|michelle|emma|ava|allison|samantha|susan|karen|moira|tessa|victoria|hazel|libby|sonia|serena|fiona|kate|catherine|heera|veena|natasha|clara|joanna|salli|kimberly|ivy|kendra|nicole|amy|olivia|elizabeth|nancy|ashley|cora|monica|emily|zoe|isla|ana|jane|sara|leah|molly|maisie|abbie|hollie|bella)\b/.test(n)) return "f";
          if (/\bmale\b|\b(david|mark|guy|daniel|alex|ryan|george|christopher|eric|roger|steffan|thomas|oliver|tom|aaron|arthur|james|brian|matthew|joey|justin|kevin|russell|william|liam|connor|andrew|brandon|jason|tony|rishi|gordon|lee|reed|eddy|fred|ralph|junior|evan|nathan|noah|ethan|elliot|alfie|jacob)\b/.test(n)) return "m";
          return "";
        },
        _buildVoiceCast() {
          const synth = window.speechSynthesis;
          if (!synth) return;
          if (!this._voiceListening && synth.addEventListener) {
            // Voices often arrive late (Chrome loads them async); rebuild when they do.
            this._voiceListening = true;
            synth.addEventListener("voiceschanged", () => this._buildVoiceCast());
          }
          // Once a cast voice has been heard, keep it for the whole session.
          if (this._voiceCastLocked && this._voiceCast) return;
          let all = [];
          try { all = synth.getVoices() || []; } catch (_) {}
          if (!all.length) return;
          const key = all.map((v) => v.voiceURI || v.name).join("|");
          if (key === this._voiceCastKey && this._voiceCast) return;
          this._voiceCastKey = key;
          const pageLang = String(document.documentElement.lang || navigator.language || "en").toLowerCase();
          const pageBase = pageLang.split("-")[0];
          let pool = all.filter((v) => String(v.lang || "").toLowerCase().replace("_", "-").split("-")[0] === pageBase);
          if (!pool.length) pool = all.slice();
          const ranked = pool
            .map((v) => ({ v, s: this._voiceScore(v, pageLang, pageBase), g: this._voiceGender(v), id: String(v.voiceURI || "") + "|" + String(v.name || "") }))
            .sort((a, b) => b.s - a.s || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
          const uses = new Map();
          const cast = {};
          for (const who of this._VOICE_ORDER) {
            const want = this._VOICE_PROFILES[who].g;
            let best = null;
            let bestScore = -Infinity;
            for (const c of ranked) {
              // Prefer an unused voice, but never cross gender just to avoid sharing: pitch and
              // rate already tell apart characters that share a voice.
              let sc = c.s - (uses.get(c.id) || 0) * 60;
              if (c.g && c.g === want) sc += 10;
              const prefer = this._VOICE_PROFILES[who].prefer;
              if (prefer && prefer.test(String(c.v.name || "").toLowerCase())) sc += 25;
              else if (c.g && c.g !== want) sc -= 400;
              if (sc > bestScore) { bestScore = sc; best = c; }
            }
            if (best) {
              cast[who] = best.v;
              uses.set(best.id, (uses.get(best.id) || 0) + 1);
            }
          }
          this._voiceCast = cast;
        },
        _voiceFor(who) {
          this._buildVoiceCast();
          const v = this._voiceCast ? this._voiceCast[who] : null;
          if (v) this._voiceCastLocked = true;
          return v || null;
        },
        _voiceToken: 0,
        _voiceActive: false,
        _voiceGraceUntilMs: 0,
        _voiceUntilMs: 0,
        speakVoice(text, role) {

          try {
            const token = ++this._voiceToken;
            if (muted || !window.speechSynthesis || !text) {
              this._voiceActive = false;
              this._voiceUntilMs = 0;
              return;
            }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            const prof = this._voiceProfile(role);
            u.pitch = prof.pitch;
            u.rate = prof.rate;
            u.volume = prof.volume;
            const voice = this._voiceFor(prof.who);
            if (voice) {
              u.voice = voice;
              if (voice.lang) u.lang = voice.lang;
            }
            if (role && (role.includes("uzumaki") || role.includes("cosmic") || role.startsWith("stan_vow"))) {
              try {
                const ac = ensureCtx();
                if (ac && masterGain) {
                  const nowAc = ac.currentTime;
                  const o = ac.createOscillator();
                  const g = ac.createGain();
                  o.type = role.includes("vow") ? "sawtooth" : "triangle";
                  o.frequency.setValueAtTime(role.includes("vow") ? 130 : 210, nowAc);
                  o.frequency.exponentialRampToValueAtTime(role.includes("cosmic") ? 520 : 340, nowAc + 0.45);
                  g.gain.setValueAtTime(0.001, nowAc);
                  g.gain.linearRampToValueAtTime(0.09, nowAc + 0.04);
                  g.gain.exponentialRampToValueAtTime(0.0008, nowAc + 0.48);
                  o.connect(g);
                  g.connect(masterGain);
                  o.start(nowAc);
                  o.stop(nowAc + 0.50);
                }
              } catch (_) {}
            }
            const clearVoice = () => {
              if (this._voiceToken === token) {
                this._voiceActive = false;
              }
            };
            u.onend = clearVoice;
            u.onerror = clearVoice;
            const words = String(text).trim().split(/\s+/).filter(Boolean).length;
            const now = performance.now();
            this._voiceActive = true;
            this._voiceGraceUntilMs = now + 450;
            this._voiceUntilMs = now + Math.min(14000, Math.max(4000, (words * 650) / prof.rate + 2500));
            window.speechSynthesis.speak(u);
          } catch (_) {
            this._voiceActive = false;
          }
        },
        // Cutscene skip: cut the current line so isVoiceSpeaking() reads false at once.
        stopVoice() {
          try {
            this._voiceToken++;
            this._voiceActive = false;
            this._voiceUntilMs = 0;
            if (window.speechSynthesis) window.speechSynthesis.cancel();
          } catch (_) {}
        },
        isVoiceSpeaking() {
          try {
            if (muted || !this._voiceActive) return false;
            const now = performance.now();
            if (now >= this._voiceUntilMs) {
              this._voiceActive = false;
              return false;
            }
            if (now < this._voiceGraceUntilMs) return true;
            if (window.speechSynthesis && (window.speechSynthesis.speaking || window.speechSynthesis.pending)) {
              return true;
            }
            this._voiceActive = false;
            return false;
          } catch (_) {
            return false;
          }
        },
        playSfx(name) {
          try {
            if (muted) return;
            const ac = ensureCtx();
            if (!ac) return;
            if (ac.state === "suspended") {
              ac.resume().catch(() => {});
            }
            if (synthProcSfx(name)) return;
            const buf = buffers[name];
            if (!buf) {
              loadBuffer(name, `assets/audio/${name}.wav`);
              return;
            }
            const src = ac.createBufferSource();
            src.buffer = buf;
            const g = ac.createGain();
            g.gain.value = name === "step" ? 0.35 : 0.72;
            src.connect(g);
            g.connect(masterGain);
            src.start(0);
          } catch (_) {}
        },
        toggleMute() {
          muted = !muted;
          try {
            const ac = ensureCtx();
            if (masterGain && ac) {
              masterGain.gain.setValueAtTime(muted ? 0.0 : 1.0, ac.currentTime);
            }
            if (muted && window.speechSynthesis) {
              window.speechSynthesis.cancel();
            }
          } catch (_) {}
          const btn = document.getElementById("btn-mute");
          if (btn) btn.textContent = muted ? "MUTED" : "SOUND";
          return muted;
        },
        isMuted() {
          return muted;
        },
        touchUnlock() {
          preloadAll();
          unlockAndMaybeStart();
        },
      };
    })();
    // Ask for the voice list early so the per-character cast is ready before the first line.
    try { window.tendyAudio._buildVoiceCast(); } catch (_) {}

  <script>
    window.tendyInput = (() => {
      let joyX = 0.0;
      let joyY = 0.0;
      let lookDX = 0.0;
      let lookDY = 0.0;
      let zoomDelta = 0.0;
      let jumpQueued = false;
      // Touch JUMP still held (skate park backflips need a hold; taps stay queued above).

      let dashQueued = false;
      let attackQueued = false;
      // SABER held (touch) / RB or RT held (gamepad): boss-mode heavy charge. Tap = light swing.
      let attackTouchHeld = false;
      let gpAttackHeld = false;
      let bossModeActive = false;
      let blockHeld = false;
      let actionTapQueued = false;
      let helpQueued = false;

      let joyTouchId = null;
      let lookTouchId = null;
      const lookTouches = new Map();
      let lastPinchDist = null;
      let lastPinchMidX = 0;
      let lastPinchMidY = 0;
      let lookLastX = 0;
      let lookLastY = 0;
      let lookMoved = 0;

      const touchControls = document.getElementById("touch-controls");
      const joyZone = document.getElementById("joystick-zone");
      const joyKnob = document.getElementById("joystick-knob");
      const btnJump = document.getElementById("btn-jump");
      const btnDash = document.getElementById("btn-dash");
      const btnAttack = document.getElementById("btn-attack");
      const btnBlock = document.getElementById("btn-block");
      const btnHelp = document.getElementById("btn-help");
      const btnMute = document.getElementById("btn-mute");
      const btnFullscreen = document.getElementById("btn-fullscreen");
      const fsPrompt = document.getElementById("fullscreen-prompt");
      const btnFsPrompt = document.getElementById("btn-fullscreen-prompt");
      const btnFsDismiss = document.getElementById("btn-fullscreen-dismiss");
      let fsDismissed = false;
      let autoFsAttempted = false;
      let isPlayingState = false;

      const isMobileViewport = () =>

          document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.mozFullScreenElement ||
            document.msFullscreenElement
        );

      async function requestOptimalFullscreen() {

          syncFullscreenUI();
          return true;
        }
        const el = document.documentElement;
        const req =
          el.requestFullscreen ||
          el.webkitRequestFullscreen ||
          el.mozRequestFullScreen ||
          el.msRequestFullscreen;
        if (!req) {
          try { window.scrollTo(0, 1); } catch (_) {}
          syncFullscreenUI();
          return false;
        }
        try {
          if (el.requestFullscreen) {
            try {
              await el.requestFullscreen({ navigationUI: "hide" });
            } catch (_) {
              await el.requestFullscreen();
            }
          } else {
            await Promise.resolve(req.call(el));
          }
          syncFullscreenUI();
          return true;
        } catch (_) {
          syncFullscreenUI();
          return false;
        }
      }

      async function toggleFullscreen() {

              document.webkitExitFullscreen ||
              document.mozCancelFullScreen ||
              document.msExitFullscreen;
            if (exit) await Promise.resolve(exit.call(document));
          } else {
            await requestOptimalFullscreen();
          }

        syncFullscreenUI();

      function syncFullscreenUI() {

          e.stopPropagation();

          const midX = (pts[0].x + pts[1].x) * 0.5;
          const midY = (pts[0].y + pts[1].y) * 0.5;

            lookDY += midY - lastPinchMidY;

          lastPinchMidX = midX;
          lastPinchMidY = midY;

                triggeredTap = true;

              lookTouchId = null;
              lastPinchDist = null;
            }
          }
        }
        syncActiveTouches(e);
        if (lookTouches.size === 1) {
          const [id, pt] = lookTouches.entries().next().value;
          lookTouchId = id;
          lookLastX = pt.x;
          lookLastY = pt.y;
          lookMoved = 999;
        }

          triggeredTap &&
          !isPlayingState &&
          !fsDismissed &&
          !autoFsAttempted &&
          isMobileViewport() &&
          !(e.target && e.target.closest && e.target.closest(".touch-ui"))
        ) {

      }, { passive: false });

      let pendingInitMode = (() => {
        const s = window.location.search;

        if (s.includes("cutscene=1")) return 1;
        if (s.includes("boss=1")) return 2;
        if (s.includes("anime=1")) return 3;
        if (s.includes("city_intro=1")) return 4;
        if (s.includes("city=1")) return 5;
        if (s.includes("city_titan=1")) return 6;
        if (s.includes("city_crew_kaiju=1")) return 16;
        if (s.includes("city_crew=1")) return 15;
        if (s.includes("headphones=2") || s.includes("uzumaki=1")) return 8;
        if (s.includes("headphones=1")) return 7;
        if (s.includes("tj=1") || s.includes("tj_cutscene=1")) return 9;
        if (s.includes("derek=1")) return 10;
        if (s.includes("nate=1")) return 11;
        if (s.includes("glenn=1")) return 12;
        if (s.includes("mike=1")) return 13;
        if (s.includes("lexie_victory=1")) return 14;
        if (s.includes("chillary=1")) return 18;

  <!-- ===== BEGIN experimental free-roam multiplayer (window.tendyNet) =====

  <script>
    window.tendyNet = (() => {

        publish() {},
        event() {},

        transportKind: mpParam === "rtc" ? "rtc" : "tabs",

        peers: new Map(),  // remote id -> { slot, last, tokens, fill, conn }
        inbox: [],         // Float64Array records for drain()
        seq: 0,
        lastState: null,   // Float32Array copy of the last published state
        lastBuf: null,     // its encoded message, re-sent unchanged as the keepalive

      function header(type, len) {

          isHost: false,

          close() { ch.close(); },
          connCount() { return 1; },
        };
      }

      // ---- Transport 2: WebRTC data channels, manual copy/paste signaling ----
      // Each connection has an unreliable unordered "st" channel for state and a reliable "ev"
      // channel for hello/bye/events. The host connects to each guest; guests relay through it.
      function rtcTransport(isHost) {
        const conns = [];
        const t = {
          kind: "rtc",
          isHost,
          conns,
          pending: null,
          send(buf, reliable, except) {
            let n = 0;

              if (c === except || !c.open) continue;

              try { if (ch.readyState === "open") { ch.send(buf); n++; } } catch (_) {}

            const st = pc.createDataChannel("st", { negotiated: true, id: 0, ordered: false, maxRetransmits: 0 });

            const c = { pc, st, ev, open: false, bindsId: isHost, boundId: 0 };

              ch.binaryType = "arraybuffer";
              ch.onmessage = (e) => onWire(e.data, c, ch === ev);
            }
            ev.onopen = () => {
              c.open = true;
              setStatus("Connected (WebRTC)");
              if (ui.panel) togglePanel(false); // out of the way; the MP pill reopens it
              sendHello();
              if (net.lastBuf) sendBuf(net.lastBuf, false);
            };
            const closed = () => {
              if (!c.open && conns.indexOf(c) < 0) return;
              c.open = false;
              if (net.transport !== t) return; // already left this session
              const i = conns.indexOf(c);
              if (i >= 0) conns.splice(i, 1);
              for (const [id, p] of [...net.peers]) if (p.conn === c || !isHost) removePeer(id);
              setStatus(conns.length ? "Connected (WebRTC)" : "Connection closed");
            };
            ev.onclose = closed;
            pc.onconnectionstatechange = () => {
              if (pc.connectionState === "failed") setStatus("WebRTC failed (no route between the two devices; see notes)");
              if (pc.connectionState === "failed" || pc.connectionState === "closed") closed();
            };
            conns.push(c);
            return c;
          },
        };
        return t;
      }
      function iceGathered(pc) {
        if (pc.iceGatheringState === "complete") return Promise.resolve();
        return new Promise((res) => {
          const done = () => { if (pc.iceGatheringState === "complete") { clearTimeout(timer); res(); } };
          const timer = setTimeout(res, 5000);
          pc.addEventListener("icegatheringstatechange", done);
        });
      }

      // Signaling codes: "TQ1." + base64url(deflate-raw(JSON)) or "TQ0." + base64url(JSON).
      const b64u = (bytes) => {
        let s = "";
        for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      };
      const unb64u = (s) => {
        const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);

      };
      async function pipeBytes(bytes, stream, cap) {
        const reader = new Blob([bytes]).stream().pipeThrough(stream).getReader();
        const chunks = [];

        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          total += value.length;
          if (total > cap) { try { reader.cancel(); } catch (_) {} throw new Error("code too large"); }
          chunks.push(value);
        }

        let o = 0;
        for (const c of chunks) { out.set(c, o); o += c.length; }

      async function encodeCode(kind, sdp) {
        const json = new TextEncoder().encode(JSON.stringify({ v: 1, t: kind, s: sdp }));
        if (typeof CompressionStream === "function") {
          try { return "TQ1." + b64u(await pipeBytes(json, new CompressionStream("deflate-raw"), 65536)); } catch (_) {}
        }

      async function decodeCode(text, kind) {
        const code = String(text || "").replace(/\s+/g, "");
        const m = /^TQ([01])\.([A-Za-z0-9_-]{16,12000})$/.exec(code);
        if (!m) throw new Error("That does not look like a game code.");
        let bytes = unb64u(m[2]);
        if (m[1] === "1") {
          if (typeof DecompressionStream !== "function") throw new Error("This browser cannot read compressed codes.");
          bytes = await pipeBytes(bytes, new DecompressionStream("deflate-raw"), 32768);
        }
        let obj;
        try { obj = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes)); } catch (_) { throw new Error("Code is damaged."); }
        if (!obj || typeof obj !== "object" || obj.v !== 1 || typeof obj.s !== "string" || obj.s.length > 20000 || !obj.s.startsWith("v=0")) {
          throw new Error("Code is damaged.");
        }
        if (obj.t !== kind) throw new Error(kind === "o" ? "That is a reply code; paste the invite code." : "That is an invite code; paste the reply code.");
        return obj.s;
      }

      // ---- Session control ----
      function leave() {
        sendBye();
        if (net.transport) { try { net.transport.close(); } catch (_) {} }
        net.transport = null;
        for (const id of [...net.peers.keys()]) removePeer(id);
        net.room = "";
        setStatus("Not connected");
      }
      function joinTabs(room) {
        leave();
        room = String(room || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12) || "MAIN";
        if (typeof BroadcastChannel !== "function") return setStatus("This browser has no BroadcastChannel.");
        net.transportKind = "tabs";
        net.room = room;
        net.transport = tabsTransport(room);
        setStatus("Tabs room " + room + ": open this page in another tab of this browser");
        sendHello();
      }
      async function rtcCreateInvite() {
        if (!net.transport || net.transport.kind !== "rtc" || !net.transport.isHost) {
          leave();
          net.transportKind = "rtc";
          net.transport = rtcTransport(true);
        }
        const t = net.transport;
        if (t.conns.length >= MAX_REMOTES) return setStatus("Room is full (6 players).");
        if (t.pending && !t.pending.open) { try { t.pending.pc.close(); } catch (_) {} t.conns.splice(t.conns.indexOf(t.pending), 1); }
        const c = t.newConn();
        t.pending = c;
        setStatus("Creating invite...");
        try {
          await c.pc.setLocalDescription(await c.pc.createOffer());
          await iceGathered(c.pc);
          ui.offerOut.value = await encodeCode("o", c.pc.localDescription.sdp);
          setStatus("Invite ready: send it to the other player, then paste their reply below.");
        } catch (e) {
          setStatus("Could not create invite: " + (e && e.message ? e.message : e));
        }
      }
      async function rtcAcceptReply() {
        const t = net.transport;
        if (!t || t.kind !== "rtc" || !t.isHost || !t.pending) return setStatus("Create an invite first.");
        try {
          const sdp = await decodeCode(ui.answerIn.value, "a");
          await t.pending.pc.setRemoteDescription({ type: "answer", sdp });
          t.pending = null;
          ui.answerIn.value = "";
          setStatus("Connecting...");
        } catch (e) {
          setStatus(e && e.message ? e.message : "Could not use that reply code.");
        }
      }
      async function rtcMakeReply() {
        let sdp;
        try { sdp = await decodeCode(ui.offerIn.value, "o"); } catch (e) { return setStatus(e.message); }
        leave();
        net.transportKind = "rtc";
        net.transport = rtcTransport(false);
        const c = net.transport.newConn();
        setStatus("Making reply...");
        try {
          await c.pc.setRemoteDescription({ type: "offer", sdp });
          await c.pc.setLocalDescription(await c.pc.createAnswer());
          await iceGathered(c.pc);
          ui.answerOut.value = await encodeCode("a", c.pc.localDescription.sdp);
          setStatus("Reply ready: send it back to the host. It connects once they paste it.");
        } catch (e) {
          setStatus("Could not make reply: " + (e && e.message ? e.message : e));
        }
      }

      // Keepalive and peer timeouts. A hidden tab stops rendering (so stops publishing) but its
      // timers still tick about once a second: re-send the last state message byte for byte
      // (same sequence number and timestamp), which receivers count as presence only, never as
      // a new position sample.
      setInterval(() => {
        const now = performance.now();
        if (net.transport && net.lastBuf && now - net.lastSendAt > KEEPALIVE_MS - 100) {
          sendBuf(net.lastBuf, false);
          net.lastSendAt = now;
        }
        for (const [id, p] of [...net.peers]) if (now - p.last > PEER_TIMEOUT_MS) removePeer(id);
        updateTelemetry();
      }, KEEPALIVE_MS);
      window.addEventListener("pagehide", sendBye);

      // ---- Panel (DOM overlay; buttons work with mouse and touch) ----
      const ui = {};
      function el(tag, props, kids) {
        const e = document.createElement(tag);
        for (const k in props || {}) {
          if (k === "text") e.textContent = props[k];
          else if (k === "onclick") e.addEventListener("click", props[k]);
          else e.setAttribute(k, props[k]);
        }
        for (const c of kids || []) e.appendChild(c);
        return e;
      }
      function copyFrom(area) {
        const v = area.value;
        if (!v) return;
        const done = () => setStatus("Copied. Send it to the other player.");
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(v).then(done, () => { area.select(); try { document.execCommand("copy"); done(); } catch (_) {} });
        } else {
          area.select();
          try { document.execCommand("copy"); done(); } catch (_) {}
        }
      }
      function setStatus(s) {
        net.status = s;
        refreshPanel();
        updateTelemetry();
      }
      function refreshPanel() {
        if (!ui.panel) return;
        const n = net.peers.size + 1;
        ui.status.textContent = net.status;
        ui.pillText.textContent = net.transport ? "MP: " + n + (n === 1 ? " player" : " players") : "MP";
        ui.peers.textContent = "";
        ui.peers.appendChild(el("span", { class: "mp-chip", style: "border-color:#2ef5ff", text: "P1 (you)" }));
        for (const p of [...net.peers.values()].sort((a, b) => a.slot - b.slot)) {
          ui.peers.appendChild(el("span", { class: "mp-chip", style: "border-color:" + (SLOT_COLORS[p.slot] || "#aaa"), text: "P" + p.slot }));
        }
        const rtc = net.transportKind === "rtc";
        ui.tabsBox.style.display = rtc ? "none" : "";
        ui.rtcBox.style.display = rtc ? "" : "none";
        ui.btnTabs.classList.toggle("on", !rtc);
        ui.btnRtc.classList.toggle("on", rtc);
        ui.btnLeave.disabled = !net.transport;
      }
      function buildPanel() {
        const style = el("style", {});
        style.textContent = `
          #mp-pill{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:41;font:600 12px system-ui,sans-serif;
            color:#e8f1ff;background:rgba(8,12,22,.9);border:1px solid #4ac8ff;border-radius:14px;padding:5px 12px;cursor:pointer}
          #mp-panel{position:fixed;top:40px;left:50%;transform:translateX(-50%);z-index:41;box-sizing:border-box;
            width:min(360px,calc(100vw - 32px));max-height:calc(100dvh - 56px);overflow:auto;padding:10px 12px;
            font:13px/1.35 system-ui,sans-serif;color:#e8f1ff;background:rgba(8,12,22,.95);border:1px solid #4ac8ff;border-radius:10px}
          #mp-panel h2{font-size:14px;margin:0 0 8px}
          #mp-panel .mp-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
          #mp-panel button{font:600 12px system-ui,sans-serif;color:#e8f1ff;background:#1b2a44;border:1px solid #4a6a99;
            border-radius:6px;padding:6px 10px;min-height:32px;cursor:pointer}
          #mp-panel button.on{background:#2b5a8f;border-color:#8fd3ff}
          #mp-panel button:disabled{opacity:.45}
          #mp-panel input,#mp-panel textarea{box-sizing:border-box;font:12px ui-monospace,monospace;color:#e8f1ff;
            background:#0d1626;border:1px solid #4a6a99;border-radius:6px;padding:5px}
          #mp-panel textarea{width:100%;height:52px;resize:vertical;word-break:break-all}
          #mp-panel label{display:block;margin-top:8px;font-weight:600}
          #mp-panel .mp-note{font-size:11px;opacity:.8;margin-top:8px}
          #mp-panel .mp-chip{display:inline-block;border:2px solid;border-radius:10px;padding:0 7px;margin-right:4px}
          #mp-status{margin-top:8px;padding:5px 7px;background:#0d1626;border-radius:6px;min-height:18px}`;
        document.head.appendChild(style);

        ui.pillText = el("span", { text: "MP" });
        ui.pill = el("button", { id: "mp-pill", type: "button", "aria-expanded": "true", "aria-controls": "mp-panel" }, [ui.pillText]);
        ui.btnTabs = el("button", { id: "mp-use-tabs", type: "button", text: "Same browser (tabs)", onclick: () => { net.transportKind = "tabs"; refreshPanel(); } });
        ui.btnRtc = el("button", { id: "mp-use-rtc", type: "button", text: "WebRTC (copy/paste)", onclick: () => { net.transportKind = "rtc"; refreshPanel(); } });
        ui.room = el("input", { id: "mp-room", type: "text", maxlength: "12", size: "8", autocomplete: "off", "aria-label": "Room code", value: roomFromUrl || "MAIN" });
        ui.tabsBox = el("div", {}, [
          el("div", { class: "mp-row" }, [
            el("span", { text: "Room" }), ui.room,
            el("button", { id: "mp-tabs-join", type: "button", text: "Join room", onclick: () => joinTabs(ui.room.value) }),
          ]),
          el("div", { class: "mp-note", text: "Open this same page in another tab or window of this browser and join the same room. Nothing leaves this computer." }),
        ]);
        ui.offerOut = el("textarea", { id: "mp-offer-out", readonly: "", placeholder: "Invite code appears here", "aria-label": "Invite code" });
        ui.answerIn = el("textarea", { id: "mp-answer-in", placeholder: "Paste the reply code here", "aria-label": "Reply code from guest" });
        ui.offerIn = el("textarea", { id: "mp-offer-in", placeholder: "Paste the invite code here", "aria-label": "Invite code from host" });
        ui.answerOut = el("textarea", { id: "mp-answer-out", readonly: "", placeholder: "Reply code appears here", "aria-label": "Reply code" });
        ui.rtcBox = el("div", {}, [
          el("label", { text: "Host: 1. create an invite and send it" }),
          el("div", { class: "mp-row" }, [
            el("button", { id: "mp-rtc-host", type: "button", text: "Create invite", onclick: rtcCreateInvite }),
            el("button", { type: "button", text: "Copy invite", onclick: () => copyFrom(ui.offerOut) }),
          ]),
          ui.offerOut,
          el("label", { text: "Host: 2. paste the guest's reply" }),
          ui.answerIn,
          el("div", { class: "mp-row" }, [el("button", { id: "mp-rtc-connect", type: "button", text: "Connect", onclick: rtcAcceptReply })]),
          el("label", { text: "Guest: paste the host's invite, send back the reply" }),
          ui.offerIn,
          el("div", { class: "mp-row" }, [
            el("button", { id: "mp-rtc-reply", type: "button", text: "Make reply", onclick: rtcMakeReply }),
            el("button", { type: "button", text: "Copy reply", onclick: () => copyFrom(ui.answerOut) }),
          ]),
          ui.answerOut,
          el("div", { class: "mp-note", text: "WebRTC connects the two browsers directly, so each player learns the other's IP address: only play with people you know. Without a STUN server (default) it works on the same computer or local network; across the internet add ?mp_stun=stun:<server>:<port>, and some networks still cannot connect (no relay server)." }),
        ]);
        ui.status = el("div", { id: "mp-status", role: "status", "aria-live": "polite" });
        ui.peers = el("div", { id: "mp-peers", class: "mp-row" });
        ui.btnLeave = el("button", { id: "mp-leave", type: "button", text: "Leave", onclick: leave });
        ui.panel = el("div", { id: "mp-panel", role: "dialog", "aria-label": "Multiplayer (experimental)" }, [
          el("h2", { text: "Multiplayer (experimental)" }),
          el("div", { class: "mp-row" }, [ui.btnTabs, ui.btnRtc]),
          ui.tabsBox, ui.rtcBox, ui.status, ui.peers,
          el("div", { class: "mp-row" }, [
            ui.btnLeave,
            el("button", { type: "button", text: "Hide panel", onclick: () => togglePanel(false) }),
          ]),
          el("div", { class: "mp-note", text: "Free roam only (beat the game and choose Continue, or use ?free_roam=1). Other players are shown as tinted heroes with a P2..P6 label; they cannot collide or interact." }),
        ]);
        ui.pill.addEventListener("click", () => togglePanel(ui.panel.style.display === "none"));
        // Keep panel input away from the game's window-level touch / wheel / key handlers.
        for (const node of [ui.pill, ui.panel]) {
          for (const type of ["touchstart", "touchmove", "touchend", "touchcancel", "pointerdown", "mousedown", "wheel", "keydown", "keyup"]) {
            node.addEventListener(type, (e) => e.stopPropagation(), { passive: true });
          }
          document.body.appendChild(node);
        }
        refreshPanel();
        // The instant two-tab trial starts collapsed (pill only) so the view stays clear.
        if (mpParam === "tabs") togglePanel(false);
      }
      function togglePanel(show) {
        ui.panel.style.display = show ? "" : "none";
        ui.pill.setAttribute("aria-expanded", show ? "true" : "false");
      }
      function updateTelemetry() {
        const t = window.tendyTelemetry;
        if (!t) return;
        t.mp = Object.assign({ remote: [], local: null }, net.game || {}, {
          enabled: true,
          transport: net.transport ? net.transport.kind : "",
          room: net.room,
          status: net.status,
          peers: net.peers.size,
          connections: net.transport ? net.transport.connCount() : 0,
          sent: net.stats.sent,
          recv: net.stats.recv,
          dropped: net.stats.dropped,
          relayed: net.stats.relayed,
          t: Date.now(),
        });
      }

      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", buildPanel);
      else buildPanel();
      if (mpParam === "tabs") {
        // Instant two-tab trial: ?free_roam=1&mp=tabs joins room MAIN (or ?mp_room=XYZ).
        joinTabs(roomFromUrl || "MAIN");
      } else {
        setStatus("Not connected: pick a transport");
      }

      // ---- Bridge used by rust/src/audio.rs (net.rs) ----
      return {
        enabled() { return true; },
        // state: Float32Array view into wasm memory [x,y,z, qx,qy,qz,qw, vx,vy,vz, scale, mode, flags, action]
        publish(state) {
          if (!state || state.length !== 14) return;
          net.lastState = Float32Array.from(state);
          net.lastBuf = encodeState(net.lastState);
          if (!net.transport) return;
          sendBuf(net.lastBuf, false);
          net.lastSendAt = performance.now();
        },
        event(code, value) {
          if (!net.transport) return;
          const [buf, v] = header(T_EVENT, LEN[T_EVENT]);
          v.setUint8(12, code & 255);
          v.setUint32(16, Math.min(value >>> 0, 1000000), true);
          sendBuf(buf, true);
        },
        // [now_ms, peers, n, n records of REC_W]; see net.rs `parse_sample`.
        drain() {
          const n = net.inbox.length;
          const out = new Float64Array(3 + n * REC_W);
          out[0] = performance.now();
          out[1] = net.peers.size;
          out[2] = n;
          for (let i = 0; i < n; i++) out.set(net.inbox[i], 3 + i * REC_W);
          net.inbox.length = 0;
          return out;
        },
        telemetry(json) {
          try { net.game = JSON.parse(json); } catch (_) { net.game = null; }
          if (net.game) net.game.gameT = Date.now();
          updateTelemetry();
        },
      };
    })();
  </script>

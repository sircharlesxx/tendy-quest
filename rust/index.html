          ui.meshBox, ui.tabsBox, ui.rtcBox, ui.status, ui.peers,
          el("div", { class: "mp-row" }, [
            ui.btnChangeChar,
            ui.btnLeave,
            el("button", { type: "button", text: "Hide panel", onclick: () => togglePanel(false) }),
            el("span", { style: "margin-left:auto;font-size:11px;opacity:.75", text: "Build: " + (window.TQ_BUILD_ID && window.TQ_BUILD_ID !== "__TQ_" + "BUILD_ID__" ? window.TQ_BUILD_ID : "dev") }),
          ]),
        ]);
        ui.charSub = el("div", { id: "mp-char-sub", text: "Connecting..." });
        ui.charNotice = el("div", { id: "mp-char-notice", text: "" });
        ui.charCards = [];
        ui.charBadges = [];
        const charGrid = el("div", { class: "mp-char-grid" });
        for (let i = 0; i < 5; i++) {
          const meta = CHARS[i];
          const badge = el("span", { class: "mp-char-badge free", text: "AVAILABLE [" + (i + 1) + "]" });
          const card = el("button", {

          }, [

        }
        ui.charBox = el("div", { id: "mp-char-select", role: "dialog", "aria-modal": "true", "aria-label": "Choose Your Character" }, [
          el("div", { class: "mp-char-modal" }, [
            el("h2", { text: "CHOOSE YOUR CHARACTER" }),
            ui.charSub,
            ui.charNotice,
            charGrid,
            el("div", { class: "mp-char-foot" }, [
              el("span", { class: "mp-bio", style: "font-size:11.5px;color:#9bb2d4", text: "Characters in use by squad peers cannot be selected. Press 1-5 or click a card." }),
            ]),
          ]),
        ]);
        ui.pill.addEventListener("click", () => togglePanel(ui.panel.style.display === "none"));
        for (const node of [ui.topBar, ui.panel, ui.charBox]) {
          for (const type of ["touchstart", "touchmove", "touchend", "touchcancel", "pointerdown", "mousedown", "wheel", "keydown", "keyup"]) {
            node.addEventListener(type, (e) => e.stopPropagation(), { passive: true });
          }
          document.body.appendChild(node);
        }
        window.addEventListener("keydown", (e) => {
          if (!net.charSelectOpen || !net.transport) return;
          if (e.key >= "1" && e.key <= "5") {
            const idx = Number(e.key) - 1;
            selectChar(idx);
          }
        });
        togglePanel(mpParam === "1" || mpParam === "rtc");
        refreshPanel();
        refreshVoiceUi();
        refreshCharSelect();
      }
      function togglePanel(show) {
        if (!ui.panel) return;
        ui.panel.style.display = show ? "" : "none";
        ui.pill.setAttribute("aria-expanded", show ? "true" : "false");
      }
      function getTransportMetrics() {
        if (net.transport && typeof net.transport.debugMetrics === "function") {
          return net.transport.debugMetrics();
        }
        return { openWebSockets: 0, pendingOffers: 0, signalingSuspended: false, cleanCloses: 0, zombieCloses: 0 };
      }

      function updateTelemetry() {
        const t = window.tendyTelemetry;
        if (!t) return;
        const myMeta = CHARS[net.myChar] || CHARS[0];
        const m = getTransportMetrics();
        t.mp = Object.assign({ remote: [], local: null }, net.game || {}, {
          enabled: true,
          buildId: window.TQ_BUILD_ID || "dev",
          inFreeRoam: net.inFreeRoam,
          online: net.onlinePref,
          transport: net.transport ? net.transport.kind : "",
          room: net.room,
          shard: net.shard,
          char: myMeta.name,
          charId: net.myChar,
          charLocked: net.charLocked,
          charSelectOpen: net.charSelectOpen,
          takenChars: [...getTakenChars()],
          avgRttMs: computeOwnAvgRtt(),
          anchorId: net.anchorId,
          anchorRttMs: net.anchorRttMs,
          trackersUp: net.transport && typeof net.transport.trackersUp === "number" ? net.transport.trackersUp : 0,
          openWebSockets: m.openWebSockets,
          pendingOffers: m.pendingOffers,
          signalingSuspended: m.signalingSuspended,
          cleanCloses: m.cleanCloses,
          zombieCloses: m.zombieCloses,
          status: net.status,
          peers: net.peers.size,
          connections: net.transport ? net.transport.connCount() : 0,
          sent: net.stats.sent,
          recv: net.stats.recv,
          dropped: net.stats.dropped,
          relayed: net.stats.relayed,
          t: Date.now(),
        });
      }

      function setFreeRoam(active) {
        net.inFreeRoam = !!active;
        if (net.inFreeRoam && typeof window.tqEnsureLatestBuild === "function") {
          void window.tqEnsureLatestBuild(true);
        }
        updatePillVisibility();
        refreshPanel();
        updateTelemetry();
      }

      function setOnline(on) {
        if (!on) {
          net.onlinePref = false;
          leave();
        } else {
          net.onlinePref = true;
          if (!net.transport) {
            if (net.transportKind === "tabs") joinTabs(net.room);
            else if (net.transportKind !== "rtc") joinMesh(net.room);
          }
        }
        refreshPanel();
        updateTelemetry();
      }

      function setScene(sceneId, level1Ready) {
        const sid = Number(sceneId) & 7;
        const rdy = !!level1Ready;
        const changed = net.sceneId !== sid || net.level1Ready !== rdy;
        net.sceneId = sid;
        net.level1Ready = rdy;
        if (changed && net.transport) {
          sendMeta();
          refreshPanel();
          updateTelemetry();
        }
      }

      function squadInfo() {
        let inLvl1 = net.sceneId === 1 ? 1 : 0;
        let readyLvl1 = (net.sceneId === 1 && net.level1Ready) ? 1 : 0;
        let inCityPeers = 0;
        let inCasinoPeers = 0;
        for (const p of net.peers.values()) {
          const ps = p.sceneId || 0;
          if (ps === 1) {
            inLvl1++;
            if (p.level1Ready) readyLvl1++;
          } else if (ps === 3) {
            inCityPeers++;
          } else if (ps === 4) {
            inCasinoPeers++;
          }
        }
        return new Uint32Array([net.peers.size + 1, readyLvl1, inLvl1, inCityPeers, inCasinoPeers]);
      }

      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", buildPanel);
      else buildPanel();
      if (isForcedSolo) {
        net.onlinePref = false;
        setStatus("Solo (offline)");
      } else if (mpParam === "tabs") {
        joinTabs(roomFromUrl || "MAIN");
      } else if (mpParam === "rtc") {
        setStatus("Not connected: pick a transport or Create invite");
      } else {
        joinMesh(roomFromUrl || "MAIN");
      }

      // ---- Bridge used by rust/src/audio.rs (rust/src/net.rs) ----
      return {
        enabled() { return true; },
        setFreeRoam,
        isInFreeRoam() { return !!net.inFreeRoam; },
        setOnline,
        isOnline() { return !!net.onlinePref; },
        setScene,
        toggleMic,
        toggleDeafen,
        voiceState() { return { micOn: voice.micOn, deafened: voice.deafened, dspActive: voice.dspActive, remoteStreams: voice.audios.size, err: voice.err }; },
        lockChar,
        squadInfo,
        debugState() {
          const m = getTransportMetrics();
          return {
            myPeerId,
            room: net.room,
            shard: net.shard,
            sceneId: net.sceneId,
            myChar: net.myChar,
            charLocked: net.charLocked,
            charSelectOpen: net.charSelectOpen,
            transport: net.transport ? net.transport.kind : "",
            online: !!net.onlinePref,
            peers: net.peers.size,
            connections: net.transport ? net.transport.connCount() : 0,
            trackersUp: net.transport && typeof net.transport.trackersUp === "number" ? net.transport.trackersUp : 0,
            openWebSockets: m.openWebSockets,
            pendingOffers: m.pendingOffers,
            signalingSuspended: m.signalingSuspended,
            cleanCloses: m.cleanCloses,
            zombieCloses: m.zombieCloses,
            status: net.status,
            squadInfo: Array.from(squadInfo()),
            voice: { micOn: voice.micOn, deafened: voice.deafened, pcs: voice.pcs.size, remoteStreams: voice.audios.size },
          };
        },
        publish(state) {
          if (!state || state.length !== 14) return;
          net.lastState = Float32Array.from(state);
          net.lastBuf = encodeState(net.lastState);
          if (!net.transport || !net.charLocked) return;
          sendBuf(net.lastBuf, false);
          net.lastSendAt = performance.now();
        },
        selectChar,
        openCharSelect,
        event(code, value) {
          if (!net.transport) return;
          const [buf, v] = header(T_EVENT, LEN[T_EVENT]);
          v.setUint8(12, code & 255);
          v.setUint32(16, Math.min(value >>> 0, 1000000), true);
          sendBuf(buf, true);
        },
        // [now_ms, peers, n, local_char, flags_mask, avg_rtt_ms, shard_idx, ... n * REC_W]
        drain() {
          const n = net.inbox.length;
          const out = new Float64Array(HEADER_W + n * REC_W);
          let flagsMask = 0;
          if (net.onlinePref || mpParam === "tabs" || mpParam === "rtc") flagsMask |= 1;
          if (net.transport) flagsMask |= 2;
          if (net.anchorId === myId) flagsMask |= 4;
          if (net.charSelectOpen) flagsMask |= 8;
          out[0] = performance.now();
          out[1] = net.peers.size;
          out[2] = n;
          out[3] = net.myChar;
          out[4] = flagsMask;
          out[5] = computeOwnAvgRtt();
          out[6] = net.shard;
          for (let i = 0; i < n; i++) out.set(net.inbox[i], HEADER_W + i * REC_W);
          net.inbox.length = 0;
          return out;
        },
        telemetry(json) {
          try { net.game = JSON.parse(json); } catch (_) { net.game = null; }
          if (net.game) net.game.gameT = Date.now();
          updateTelemetry();
        },
      };
    })();

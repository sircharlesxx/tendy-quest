<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tendy Quest — Giant Kitchen</title>
  <link data-trunk rel="copy-dir" href="../assets/models" data-target-path="assets/models" />
  <link data-trunk rel="copy-dir" href="../assets/audio" data-target-path="assets/audio" />
  <script>
    window.tendyAudio = (() => {
      const SFX_NAMES = [
        "jump", "double_jump", "dash", "tendy", "powerup",
        "hit", "shield", "step", "lunge", "win", "lose"
      ];
      let ctx = null;
      let masterGain = null;
      let bgmGain = null;
      let ambGain = null;
      let bgmSource = null;
      let ambSource = null;
      let bgmRequested = false;
      let bgmStarted = false;
      let ambStarted = false;
      let muted = false;
      const buffers = {};
      const loading = {};

      function ensureCtx() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          masterGain = ctx.createGain();
          masterGain.gain.value = muted ? 0.0 : 1.0;
          masterGain.connect(ctx.destination);

          bgmGain = ctx.createGain();
          bgmGain.gain.value = 0.42;
          bgmGain.connect(masterGain);

          ambGain = ctx.createGain();
          ambGain.gain.value = 0.14;
          ambGain.connect(masterGain);
        }
        return ctx;
      }

      async function loadBuffer(key, url) {
        if (buffers[key]) return buffers[key];
        if (loading[key]) return loading[key];
        const ac = ensureCtx();
        if (!ac) return null;
        loading[key] = fetch(url)
          .then((res) => (res.ok ? res.arrayBuffer() : null))
          .then((arr) => (arr ? ac.decodeAudioData(arr) : null))
          .then((buf) => {
            if (buf) buffers[key] = buf;
            return buf;
          })
          .catch(() => null);
        return loading[key];
      }

      function preloadAll() {
        try {
          loadBuffer("bgm", "assets/audio/tendies_from_the_sun.mp3").then(() => {
            if (bgmRequested) startLoops();
          });
          loadBuffer("ambience", "assets/audio/kitchen_ambience.mp3").then(() => {
            if (bgmRequested) startLoops();
          });
          for (const name of SFX_NAMES) {
            loadBuffer(name, `assets/audio/${name}.wav`);
          }
        } catch (_) {}
      }

      let droneOsc1 = null;
      let droneOsc2 = null;
      let droneGain = null;
      let bossTimer = null;
      let bossStep = 0;
      let vikingTimer = null;
      let vikingStep = 0;
      let headphoneTimer = null;
      let headphoneStep = 0;

      function stopSpecialAudio() {
        try {
          if (bossTimer) { clearInterval(bossTimer); bossTimer = null; }
          if (vikingTimer) { clearInterval(vikingTimer); vikingTimer = null; }
          if (headphoneTimer) { clearInterval(headphoneTimer); headphoneTimer = null; }
          if (droneOsc1) { droneOsc1.stop(); droneOsc1.disconnect(); droneOsc1 = null; }
          if (droneOsc2) { droneOsc2.stop(); droneOsc2.disconnect(); droneOsc2 = null; }
          if (droneGain) { droneGain.disconnect(); droneGain = null; }
        } catch (_) {}
      }

      function synthProcSfx(name) {
        const ac = ensureCtx();
        if (!ac || !masterGain) return false;
        const now = ac.currentTime;
        const mkOsc = (type, f0, f1, dur, gainPeak) => {
          const osc = ac.createOscillator();
          const g = ac.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(f0, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(gainPeak, now + 0.015);
          g.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(g);
          g.connect(masterGain);
          osc.start(now);
          osc.stop(now + dur + 0.02);
        };
        if (name === "saber_ignite") {
          mkOsc("sawtooth", 110, 420, 0.36, 0.28);
          mkOsc("triangle", 220, 140, 0.45, 0.22);
          return true;
        }
        if (name === "saber_swing") {
          mkOsc("sawtooth", 340, 135, 0.19, 0.22);
          mkOsc("sine", 560, 210, 0.17, 0.14);
          return true;
        }
        if (name === "saber_hit") {
          mkOsc("square", 680, 120, 0.16, 0.30);
          mkOsc("sawtooth", 980, 240, 0.14, 0.20);
          return true;
        }
        if (name === "dodge_roll") {
          mkOsc("sine", 240, 520, 0.18, 0.22);
          return true;
        }
        if (name === "thunder") {
          mkOsc("sawtooth", 95, 32, 0.75, 0.36);
          return true;
        }
        if (name === "mom_yell") {
          mkOsc("sawtooth", 540, 380, 0.32, 0.26);
          mkOsc("square", 720, 460, 0.24, 0.14);
          return true;
        }
        if (name === "garlic_throw") {
          mkOsc("sawtooth", 210, 95, 0.28, 0.26);
          mkOsc("triangle", 340, 150, 0.24, 0.18);
          return true;
        }
        if (name === "car_horn") {
          mkOsc("sawtooth", 392, 388, 0.22, 0.22);
          mkOsc("square", 494, 490, 0.22, 0.16);
          return true;
        }
        if (name === "headphone_crunch") {
          mkOsc("sawtooth", 620, 75, 0.34, 0.34);
          mkOsc("square", 1180, 140, 0.26, 0.28);
          mkOsc("triangle", 290, 48, 0.42, 0.30);
          return true;
        }
        if (name === "rage_swell") {
          mkOsc("sawtooth", 85, 175, 0.22, 0.22);
          mkOsc("sine", 55, 115, 0.24, 0.26);
          return true;
        }
        return false;
      }

      function startLoops() {
        const ac = ensureCtx();
        if (!ac || ac.state !== "running") return;
        if (!bgmStarted && buffers["bgm"]) {
          bgmStarted = true;
          bgmSource = ac.createBufferSource();
          bgmSource.buffer = buffers["bgm"];
          bgmSource.loop = true;
          bgmSource.connect(bgmGain);
          bgmSource.start(0);
        }
        if (!ambStarted && buffers["ambience"]) {
          ambStarted = true;
          ambSource = ac.createBufferSource();
          ambSource.buffer = buffers["ambience"];
          ambSource.loop = true;
          ambSource.connect(ambGain);
          ambSource.start(0);
        }
      }

      function unlockAndMaybeStart() {
        try {
          const ac = ensureCtx();
          if (!ac) return;
          if (ac.state === "suspended") {
            ac.resume().then(() => {
              if (bgmRequested) startLoops();
            }).catch(() => {});
          } else if (bgmRequested) {
            startLoops();
          }
        } catch (_) {}
      }

      window.addEventListener("pointerdown", () => {
        preloadAll();
        unlockAndMaybeStart();
      });
      window.addEventListener("keydown", () => {
        preloadAll();
        unlockAndMaybeStart();
      });
      window.addEventListener("load", preloadAll);

      return {
        playBgm() {
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (ac && bgmGain) bgmGain.gain.setValueAtTime(0.42, ac.currentTime);
            if (ac && ambGain) ambGain.gain.setValueAtTime(0.14, ac.currentTime);
            if (bgmSource) bgmSource.playbackRate.value = 1.0;
          } catch (_) {}
        },
        playCutsceneMusic() {
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (!ac || !masterGain) return;
            if (bgmGain) bgmGain.gain.setValueAtTime(0.0, ac.currentTime);
            if (ambGain) ambGain.gain.setValueAtTime(0.06, ac.currentTime);
            const filter = ac.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.value = 240;
            droneGain = ac.createGain();
            droneGain.gain.value = 0.22;
            filter.connect(droneGain);
            droneGain.connect(masterGain);
            droneOsc1 = ac.createOscillator();
            droneOsc1.type = "sawtooth";
            droneOsc1.frequency.value = 55;
            droneOsc2 = ac.createOscillator();
            droneOsc2.type = "sawtooth";
            droneOsc2.frequency.value = 82.41;
            droneOsc1.connect(filter);
            droneOsc2.connect(filter);
            droneOsc1.start();
            droneOsc2.start();
          } catch (_) {}
        },
        playHeadphoneMusic() {
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (!ac || !masterGain) return;
            if (bgmGain) bgmGain.gain.setValueAtTime(0.0, ac.currentTime);
            if (ambGain) ambGain.gain.setValueAtTime(0.03, ac.currentTime);
            // Ominous D1 + G#1 tritone sub-drone for the shattered headset/iPad flashback
            const filter = ac.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.value = 190;
            droneGain = ac.createGain();
            droneGain.gain.value = 0.16;
            filter.connect(droneGain);
            droneGain.connect(masterGain);
            droneOsc1 = ac.createOscillator();
            droneOsc1.type = "triangle";
            droneOsc1.frequency.value = 36.71;
            droneOsc2 = ac.createOscillator();
            droneOsc2.type = "sawtooth";
            droneOsc2.frequency.value = 51.91;
            droneOsc1.connect(filter);
            droneOsc2.connect(filter);
            droneOsc1.start();
            droneOsc2.start();

            const glassBells = [587.33, 554.37, 466.16, 440.0, 392.0, 349.23, 329.63, 277.18];
            headphoneStep = 0;
            headphoneTimer = setInterval(() => {
              if (muted || ac.state !== "running") return;
              const now = ac.currentTime;
              const step = headphoneStep % 8;
              headphoneStep += 1;

              // Double-heartbeat sub-thump on beats 0 and 2
              if (step === 0 || step === 2) {
                const thump = ac.createOscillator();
                const tg = ac.createGain();
                thump.type = "sine";
                thump.frequency.setValueAtTime(96, now);
                thump.frequency.exponentialRampToValueAtTime(28, now + 0.18);
                tg.gain.setValueAtTime(0.28, now);
                tg.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
                thump.connect(tg);
                tg.connect(masterGain);
                thump.start(now);
                thump.stop(now + 0.20);
              }

              // Haunting descending diminished shattered-glass bell arpeggio
              const freq = glassBells[step];
              const bell = ac.createOscillator();
              const shimmer = ac.createOscillator();
              const bg = ac.createGain();
              bell.type = "sine";
              shimmer.type = "triangle";
              bell.frequency.setValueAtTime(freq, now);
              shimmer.frequency.setValueAtTime(freq * 1.007, now);
              bg.gain.setValueAtTime(0.001, now);
              bg.gain.linearRampToValueAtTime(0.085, now + 0.015);
              bg.gain.exponentialRampToValueAtTime(0.0008, now + 0.38);
              bell.connect(bg);
              shimmer.connect(bg);
              bg.connect(masterGain);
              bell.start(now);
              shimmer.start(now);
              bell.stop(now + 0.40);
              shimmer.stop(now + 0.40);

              // High metallic glass-crack tick on beat 4
              if (step === 4) {
                const tick = ac.createOscillator();
                const tk = ac.createGain();
                tick.type = "square";
                tick.frequency.setValueAtTime(1661.22, now);
                tick.frequency.exponentialRampToValueAtTime(622.25, now + 0.09);
                tk.gain.setValueAtTime(0.045, now);
                tk.gain.exponentialRampToValueAtTime(0.0008, now + 0.10);
                tick.connect(tk);
                tk.connect(masterGain);
                tick.start(now);
                tick.stop(now + 0.11);
              }
            }, 220);
          } catch (_) {}
        },
        playBossMusic() {
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (!ac || !masterGain) return;
            if (bgmGain) bgmGain.gain.setValueAtTime(0.28, ac.currentTime);
            if (ambGain) ambGain.gain.setValueAtTime(0.0, ac.currentTime);
            if (bgmSource) bgmSource.playbackRate.value = 1.24;
            // Epic 150 BPM Chicken-Tendy boss riff + driving synth drums
            const notes = [146.83, 174.61, 220.0, 261.63, 293.66, 261.63, 220.0, 174.61];
            const bass = [73.42, 73.42, 87.31, 87.31, 98.0, 98.0, 110.0, 82.41];
            bossStep = 0;
            bossTimer = setInterval(() => {
              if (muted || ac.state !== "running") return;
              const now = ac.currentTime;
              const step = bossStep % 16;
              bossStep += 1;
              // Kick on 0, 4, 8, 12 + syncopated hits
              if (step % 4 === 0 || step === 10) {
                const ko = ac.createOscillator();
                const kg = ac.createGain();
                ko.type = "sine";
                ko.frequency.setValueAtTime(135, now);
                ko.frequency.exponentialRampToValueAtTime(38, now + 0.13);
                kg.gain.setValueAtTime(0.32, now);
                kg.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                ko.connect(kg);
                kg.connect(masterGain);
                ko.start(now);
                ko.stop(now + 0.15);
              }
              // Lead Tendy power-chord arpeggio
              const lOsc = ac.createOscillator();
              const lGain = ac.createGain();
              lOsc.type = "sawtooth";
              lOsc.frequency.setValueAtTime(notes[step % notes.length] * (step >= 8 ? 2.0 : 1.0), now);
              lGain.gain.setValueAtTime(0.09, now);
              lGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
              lOsc.connect(lGain);
              lGain.connect(masterGain);
              lOsc.start(now);
              lOsc.stop(now + 0.17);
              // Driving bass pulse
              if (step % 2 === 0) {
                const bOsc = ac.createOscillator();
                const bGain = ac.createGain();
                bOsc.type = "square";
                bOsc.frequency.setValueAtTime(bass[(step >> 1) % bass.length], now);
                bGain.gain.setValueAtTime(0.11, now);
                bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                bOsc.connect(bGain);
                bGain.connect(masterGain);
                bOsc.start(now);
                bOsc.stop(now + 0.19);
              }
            }, 100);
          } catch (_) {}
        },
        playVikingChantMusic() {
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (!ac || !masterGain) return;
            if (bgmGain) bgmGain.gain.setValueAtTime(0.14, ac.currentTime);
            if (ambGain) ambGain.gain.setValueAtTime(0.08, ac.currentTime);
            if (bgmSource) bgmSource.playbackRate.value = 1.05;
            // Nordic low war drone + booming choir chant rhythm ("TENDY! WENDY! FENDY! BENDIES!")
            droneGain = ac.createGain();
            droneGain.gain.setValueAtTime(0.07, ac.currentTime);
            droneGain.connect(masterGain);
            droneOsc1 = ac.createOscillator();
            droneOsc1.type = "sawtooth";
            droneOsc1.frequency.value = 55.0; // Deep A1 Viking horn/choir root
            droneOsc2 = ac.createOscillator();
            droneOsc2.type = "triangle";
            droneOsc2.frequency.value = 82.41; // E2 fifth
            const lp = ac.createBiquadFilter();
            lp.type = "lowpass";
            lp.frequency.value = 260;
            droneOsc1.connect(lp);
            droneOsc2.connect(lp);
            lp.connect(droneGain);
            droneOsc1.start();
            droneOsc2.start();

            const chantNotes = [110.0, 98.0, 110.0, 130.81, 110.0, 98.0, 146.83, 130.81];
            vikingStep = 0;
            const self = this;
            vikingTimer = setInterval(() => {
              if (muted || ac.state !== "running") return;
              const now = ac.currentTime;
              const step = vikingStep % 32;
              vikingStep += 1;

              // Heavy Viking war drum on strong beats
              if (step % 4 === 0 || step % 8 === 6) {
                const ko = ac.createOscillator();
                const kg = ac.createGain();
                ko.type = "sine";
                ko.frequency.setValueAtTime(step % 8 === 0 ? 115 : 88, now);
                ko.frequency.exponentialRampToValueAtTime(34, now + 0.22);
                kg.gain.setValueAtTime(step % 8 === 0 ? 0.36 : 0.24, now);
                kg.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
                ko.connect(kg);
                kg.connect(masterGain);
                ko.start(now);
                ko.stop(now + 0.25);
              }

              // Stomp-clap / shield-bang every 2nd beat
              if (step % 4 === 2) {
                const so = ac.createOscillator();
                const sg = ac.createGain();
                so.type = "square";
                so.frequency.setValueAtTime(190, now);
                so.frequency.exponentialRampToValueAtTime(75, now + 0.08);
                sg.gain.setValueAtTime(0.11, now);
                sg.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
                so.connect(sg);
                sg.connect(masterGain);
                so.start(now);
                so.stop(now + 0.10);
              }

              // Baritone Viking choir syllables on "TEN-DY! WEN-DY! FEN-DY! BEN-DIES!"
              if (step % 2 === 0) {
                const freq = chantNotes[(step >> 1) % chantNotes.length];
                const bpf = ac.createBiquadFilter();
                bpf.type = "bandpass";
                bpf.frequency.setValueAtTime(step % 4 === 0 ? 520 : 680, now);
                bpf.Q.value = 3.2;
                const cg = ac.createGain();
                cg.gain.setValueAtTime(0.15, now);
                cg.gain.exponentialRampToValueAtTime(0.001, now + 0.31);
                bpf.connect(cg);
                cg.connect(masterGain);
                for (const det of [0.994, 1.0, 1.007]) {
                  const vo = ac.createOscillator();
                  vo.type = "sawtooth";
                  vo.frequency.setValueAtTime(freq * det, now);
                  vo.connect(bpf);
                  vo.start(now);
                  vo.stop(now + 0.32);
                }
              }

              // Periodic spoken Viking chant over active gameplay (never overrides cutscene speech)
              if (step === 0 && !self._voiceActive && window.speechSynthesis && !window.speechSynthesis.speaking) {
                try {
                  const cu = new SpeechSynthesisUtterance("Tendy! Wendy! Fendy! Bendies! SKOL!");
                  cu.pitch = 0.55;
                  cu.rate = 0.88;
                  cu.volume = 0.72;
                  window.speechSynthesis.speak(cu);
                } catch (_) {}
              }
            }, 175);
          } catch (_) {}
        },
        _voiceToken: 0,
        _voiceActive: false,
        _voiceGraceUntilMs: 0,
        _voiceUntilMs: 0,
        speakVoice(text, role) {
          try {
            const token = ++this._voiceToken;
            if (muted || !window.speechSynthesis || !text) {
              this._voiceActive = false;
              this._voiceUntilMs = 0;
              return;
            }
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            if (role === "mom") {
              u.pitch = 1.45;
              u.rate = 1.05;
              u.volume = 1.0;
            } else if (role === "lexie") {
              u.pitch = 0.72;
              u.rate = 0.94;
              u.volume = 1.0;
            } else if (role === "stan") {
              u.pitch = 1.02;
              u.rate = 0.95;
              u.volume = 1.0;
            } else if (role === "narrator") {
              u.pitch = 0.90;
              u.rate = 0.92;
              u.volume = 0.95;
            } else {
              u.pitch = 0.65;
              u.rate = 0.90;
              u.volume = 0.95;
            }
            const clearVoice = () => {
              if (this._voiceToken === token) {
                this._voiceActive = false;
              }
            };
            u.onend = clearVoice;
            u.onerror = clearVoice;
            const words = String(text).trim().split(/\s+/).filter(Boolean).length;
            const now = performance.now();
            this._voiceActive = true;
            this._voiceGraceUntilMs = now + 450;
            this._voiceUntilMs = now + Math.min(14000, Math.max(4000, words * 650 + 2500));
            window.speechSynthesis.speak(u);
          } catch (_) {
            this._voiceActive = false;
          }
        },
        isVoiceSpeaking() {
          try {
            if (muted || !this._voiceActive) return false;
            const now = performance.now();
            if (now >= this._voiceUntilMs) {
              this._voiceActive = false;
              return false;
            }
            if (now < this._voiceGraceUntilMs) return true;
            if (window.speechSynthesis && (window.speechSynthesis.speaking || window.speechSynthesis.pending)) {
              return true;
            }
            this._voiceActive = false;
            return false;
          } catch (_) {
            return false;
          }
        },
        playSfx(name) {
          try {
            if (muted) return;
            const ac = ensureCtx();
            if (!ac) return;
            if (ac.state === "suspended") {
              ac.resume().catch(() => {});
            }
            if (synthProcSfx(name)) return;
            const buf = buffers[name];
            if (!buf) {
              loadBuffer(name, `assets/audio/${name}.wav`);
              return;
            }
            const src = ac.createBufferSource();
            src.buffer = buf;
            const g = ac.createGain();
            g.gain.value = name === "step" ? 0.35 : 0.72;
            src.connect(g);
            g.connect(masterGain);
            src.start(0);
          } catch (_) {}
        },
        toggleMute() {
          muted = !muted;
          try {
            const ac = ensureCtx();
            if (masterGain && ac) {
              masterGain.gain.setValueAtTime(muted ? 0.0 : 1.0, ac.currentTime);
            }
            if (muted && window.speechSynthesis) {
              window.speechSynthesis.cancel();
            }
          } catch (_) {}
          const btn = document.getElementById("btn-mute");
          if (btn) btn.textContent = muted ? "MUTED" : "SOUND";
          return muted;
        },
        isMuted() {
          return muted;
        },
        touchUnlock() {
          preloadAll();
          unlockAndMaybeStart();
        },
      };
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #1a120b;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100dvh !important;
      outline: none;
      touch-action: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #3b2614, #1a120b);
      color: #fde68a;
      z-index: 30;
      transition: opacity 0.4s ease;
    }
    #loading h1 {
      font-size: 2.5rem;
      margin: 0 0 0.5rem 0;
      text-shadow: 0 3px 10px rgba(0,0,0,0.6);
    }
    #loading p {
      color: #fef3c7;
      opacity: 0.85;
    }
    #touch-controls {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: none;
    }
    #touch-controls.active {
      display: block;
    }
    #touch-controls:not(.playing) #joystick-zone,
    #touch-controls:not(.playing) #action-buttons,
    #touch-controls:not(.playing) #mobile-top-btns {
      display: none;
    }
    @media (pointer: coarse), (max-width: 960px) {
      #touch-controls {
        display: block;
      }
    }
    #joystick-zone {
      position: fixed;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 136px;
      height: 136px;
      pointer-events: auto;
      touch-action: none;
    }
    #joystick-base {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(20, 14, 9, 0.45);
      border: 2px solid rgba(253, 230, 138, 0.55);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #joystick-knob {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a, #d97706);
      border: 2px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
      transform: translate(0px, 0px);
      pointer-events: none;
    }
    #action-buttons {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-end;
      gap: 14px;
      pointer-events: none;
    }
    .touch-btn {
      pointer-events: auto;
      touch-action: none;
      border-radius: 50%;
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.65);
      transition: transform 0.06s ease;
    }
    .touch-btn:active, .touch-btn.pressed {
      transform: scale(0.92);
    }
    #btn-jump {
      width: 82px;
      height: 82px;
      font-size: 0.95rem;
      background: radial-gradient(circle at 30% 30%, rgba(245, 158, 11, 0.92), rgba(180, 83, 9, 0.92));
    }
    #btn-dash {
      width: 68px;
      height: 68px;
      font-size: 0.82rem;
      margin-bottom: 10px;
      background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.90), rgba(3, 105, 161, 0.90));
    }
    #btn-attack {
      display: none;
      width: 76px;
      height: 76px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      background: radial-gradient(circle at 30% 30%, rgba(168, 85, 247, 0.95), rgba(107, 33, 168, 0.95));
      border-color: #fde047;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.7);
    }
    #touch-controls.boss-mode #btn-attack {
      display: flex;
    }
    #mobile-top-btns {
      position: fixed;
      top: 92px;
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      gap: 8px;
      pointer-events: none;
    }
    .touch-pill {
      pointer-events: auto;
      touch-action: none;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(20, 14, 9, 0.72);
      border: 1.5px solid rgba(253, 230, 138, 0.55);
      color: #fde68a;
      font-size: 0.74rem;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }
    .touch-pill.highlight {
      border-color: #fde047;
      background: rgba(180, 83, 9, 0.85);
      color: #fffbeb;
    }
    #fullscreen-prompt {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(92vw, 410px);
      z-index: 26;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(20, 13, 8, 0.94);
      border: 1.5px solid rgba(253, 224, 71, 0.78);
      color: #fef3c7;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65);
      pointer-events: auto;
      font-size: 0.78rem;
      line-height: 1.25;
    }
    #fullscreen-prompt.visible {
      display: flex;
    }
    .fs-prompt-copy {
      flex: 1;
      min-width: 0;
    }
    .fs-prompt-copy strong {
      display: block;
      color: #fde047;
      font-size: 0.82rem;
      margin-bottom: 2px;
    }
    .fs-prompt-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    #btn-fullscreen-prompt {
      border: 1.5px solid #fde047;
      background: linear-gradient(135deg, #f59e0b, #b45309);
      color: #fff;
      font-weight: 800;
      font-size: 0.74rem;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    #btn-fullscreen-dismiss {
      border: 1px solid rgba(254, 243, 199, 0.35);
      background: rgba(255, 255, 255, 0.08);
      color: #fef3c7;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 6px 9px;
      border-radius: 8px;
      cursor: pointer;
    }
    @media (max-height: 500px) {
      #joystick-zone {
        width: 106px;
        height: 106px;
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
      }
      #joystick-knob {
        width: 44px;
        height: 44px;
      }
      #action-buttons {
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        gap: 10px;
      }
      #btn-jump {
        width: 68px;
        height: 68px;
        font-size: 0.82rem;
      }
      #btn-dash {
        width: 56px;
        height: 56px;
        font-size: 0.72rem;
        margin-bottom: 6px;
      }
      #btn-attack {
        width: 62px;
        height: 62px;
        font-size: 0.72rem;
        margin-bottom: 10px;

      #mobile-top-btns {
        top: 68px;
      }
    }
    @media (max-width: 540px) {
      #joystick-zone {
        left: max(10px, env(safe-area-inset-left));
        bottom: max(14px, env(safe-area-inset-bottom));
        width: 114px;
        height: 114px;
      }
      #joystick-knob {
        width: 46px;
        height: 46px;
      }
      #action-buttons {
        right: max(10px, env(safe-area-inset-right));
        bottom: max(14px, env(safe-area-inset-bottom));
        gap: 9px;
      }
      #btn-attack {
        width: 64px;
        height: 64px;
        font-size: 0.74rem;
        margin-bottom: 14px;
      }
      #btn-dash {
        width: 58px;
        height: 58px;
        font-size: 0.74rem;
        margin-bottom: 6px;
      }
      #btn-jump {
        width: 70px;
        height: 70px;
        font-size: 0.84rem;
      }
      #mobile-top-btns {
        top: 108px;
        right: max(10px, env(safe-area-inset-right));
        gap: 5px;
      }
      .touch-pill {
        padding: 4px 8px;
        font-size: 0.68rem;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>TENDY QUEST</h1>
    <p>Loading Giant Kitchen (Rust + WebAssembly)...</p>
  </div>
  <div id="touch-controls">
    <div id="joystick-zone" class="touch-ui">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>
    <div id="action-buttons">
      <button id="btn-attack" class="touch-btn touch-ui" type="button">SABER</button>
      <button id="btn-dash" class="touch-btn touch-ui" type="button">DASH</button>
      <button id="btn-jump" class="touch-btn touch-ui" type="button">JUMP</button>
    </div>
    <div id="mobile-top-btns">
      <button id="btn-fullscreen" class="touch-pill touch-ui highlight" type="button">FULL</button>
      <button id="btn-help" class="touch-pill touch-ui" type="button">HELP</button>
      <button id="btn-mute" class="touch-pill touch-ui" type="button">SOUND</button>
    </div>
  </div>
  <div id="fullscreen-prompt" class="touch-ui" role="dialog" aria-label="Fullscreen recommendation">
    <div class="fs-prompt-copy">
      <strong>Enter Fullscreen Mode</strong>
      <span>Recommended on mobile for the optimal player experience (hides the browser URL bar).</span>
    </div>
    <div class="fs-prompt-actions">
      <button id="btn-fullscreen-prompt" type="button">FULLSCREEN</button>
      <button id="btn-fullscreen-dismiss" type="button" aria-label="Dismiss fullscreen prompt">✕</button>
    </div>
  </div>
  <script>
    window.tendyInput = (() => {
      let joyX = 0.0;
      let joyY = 0.0;
      let lookDX = 0.0;
      let lookDY = 0.0;
      let zoomDelta = 0.0;
      let jumpQueued = false;
      let dashQueued = false;
      let attackQueued = false;
      let actionTapQueued = false;
      let helpQueued = false;

      let joyTouchId = null;
      let lookTouchId = null;
      const lookTouches = new Map();
      let lastPinchDist = null;
      let lastPinchMidX = 0;
      let lastPinchMidY = 0;
      let lookLastX = 0;
      let lookLastY = 0;
      let lookMoved = 0;
      const maxR = 46;

      const touchControls = document.getElementById("touch-controls");
      const joyZone = document.getElementById("joystick-zone");
      const joyKnob = document.getElementById("joystick-knob");
      const btnJump = document.getElementById("btn-jump");
      const btnDash = document.getElementById("btn-dash");
      const btnAttack = document.getElementById("btn-attack");
      const btnHelp = document.getElementById("btn-help");
      const btnMute = document.getElementById("btn-mute");
      const btnFullscreen = document.getElementById("btn-fullscreen");
      const fsPrompt = document.getElementById("fullscreen-prompt");
      const btnFsPrompt = document.getElementById("btn-fullscreen-prompt");
      const btnFsDismiss = document.getElementById("btn-fullscreen-dismiss");
      let fsDismissed = false;
      let autoFsAttempted = false;
      let isPlayingState = false;

      const isMobileViewport = () =>
        (window.matchMedia &&
          (window.matchMedia("(pointer: coarse)").matches ||
            window.matchMedia("(max-width: 960px)").matches)) ||
        "ontouchstart" in window ||
        navigator.maxTouchPoints > 0;

      const isFullscreen = () =>
        Boolean(
          document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.mozFullScreenElement ||
            document.msFullscreenElement
        );

      async function requestOptimalFullscreen() {
        if (isFullscreen()) {
          syncFullscreenUI();
          return true;
        }
        const el = document.documentElement;
        const req =
          el.requestFullscreen ||
          el.webkitRequestFullscreen ||
          el.mozRequestFullScreen ||
          el.msRequestFullscreen;
        if (!req) {
          try { window.scrollTo(0, 1); } catch (_) {}
          syncFullscreenUI();
          return false;
        }
        try {
          if (el.requestFullscreen) {
            try {
              await el.requestFullscreen({ navigationUI: "hide" });
            } catch (_) {
              await el.requestFullscreen();
            }
          } else {
            await Promise.resolve(req.call(el));
          }
          syncFullscreenUI();
          return true;
        } catch (_) {
          syncFullscreenUI();
          return false;
        }
      }

      async function toggleFullscreen() {
        try {
          if (isFullscreen()) {
            const exit =
              document.exitFullscreen ||
              document.webkitExitFullscreen ||
              document.mozCancelFullScreen ||
              document.msExitFullscreen;
            if (exit) await Promise.resolve(exit.call(document));
          } else {
            await requestOptimalFullscreen();
          }
        } catch (_) {}
        syncFullscreenUI();
      }

      function syncFullscreenUI() {
        const fs = isFullscreen();
        if (btnFullscreen) {
          btnFullscreen.textContent = fs ? "EXIT" : "FULL";
          btnFullscreen.classList.toggle("highlight", !fs);
        }
        const inCutsceneInit = /cutscene=1|anime=1|city_intro=1|headphones=1/.test(
          window.location.search
        );
        if (fsPrompt) {
          const shouldShow =
            isMobileViewport() && !fs && !fsDismissed && !isPlayingState && !inCutsceneInit;
          fsPrompt.classList.toggle("visible", shouldShow);
        }
      }

      document.addEventListener("fullscreenchange", syncFullscreenUI);
      document.addEventListener("webkitfullscreenchange", syncFullscreenUI);
      window.addEventListener("resize", syncFullscreenUI);

      if (btnFsPrompt) {
        let lastFsTap = 0;
        const onFsTap = (e) => {
          const now = Date.now();
          if (now - lastFsTap < 250) return;
          lastFsTap = now;
          e.preventDefault();
          e.stopPropagation();
          window.tendyAudio.touchUnlock();
          autoFsAttempted = true;
          requestOptimalFullscreen().then((ok) => {
            if (ok && fsPrompt) fsPrompt.classList.remove("visible");
          });
        };
        btnFsPrompt.addEventListener("touchend", onFsTap, { passive: false });
        btnFsPrompt.addEventListener("click", onFsTap);
      }

      if (btnFsDismiss) {
        const onDismiss = (e) => {
          e.preventDefault();
          e.stopPropagation();
          fsDismissed = true;
          syncFullscreenUI();
        };
        btnFsDismiss.addEventListener("touchend", onDismiss, { passive: false });
        btnFsDismiss.addEventListener("click", onDismiss);
      }

      if (btnFullscreen) {
        let lastToggle = 0;
        const onToggle = (e) => {
          const now = Date.now();
          if (now - lastToggle < 250) return;
          lastToggle = now;
          e.preventDefault();
          e.stopPropagation();
          window.tendyAudio.touchUnlock();
          toggleFullscreen();
        };
        btnFullscreen.addEventListener("touchend", onToggle, { passive: false });
        btnFullscreen.addEventListener("click", onToggle);
      }

      function showTouchControls() {
        if (touchControls) touchControls.classList.add("active");
        syncFullscreenUI();
      }

      function updateJoyFromPoint(clientX, clientY) {
        const rect = joyZone.getBoundingClientRect();
        const cx = rect.left + rect.width * 0.5;
        const cy = rect.top + rect.height * 0.5;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > maxR) {
          dx = (dx / dist) * maxR;
          dy = (dy / dist) * maxR;
        }
        joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        const nx = dx / maxR;
        const ny = -dy / maxR;
        const mag = Math.hypot(nx, ny);
        if (mag < 0.12) {
          joyX = 0.0;
          joyY = 0.0;
        } else {
          joyX = nx;
          joyY = ny;
        }
      }

      function resetJoy() {
        joyTouchId = null;
        joyX = 0.0;
        joyY = 0.0;
        joyKnob.style.transform = "translate(0px, 0px)";
      }

      function isInJoystickArea(clientX, clientY) {
        if (!touchControls || !touchControls.classList.contains("playing") || !joyZone) {
          return false;
        }
        const r = joyZone.getBoundingClientRect();
        if (r.width <= 0 || r.height <= 0) return false;
        const pad = 42;
        return (
          clientX >= r.left - pad &&
          clientX <= r.right + pad &&
          clientY >= r.top - pad &&
          clientY <= r.bottom + pad
        );
      }

      function syncActiveTouches(e) {
        const live = new Set();
        if (e && e.touches) {
          for (const t of e.touches) live.add(t.identifier);
        }
        if (joyTouchId !== null && !live.has(joyTouchId)) {
          resetJoy();
        }
        for (const id of lookTouches.keys()) {
          if (!live.has(id) || id === joyTouchId) {
            lookTouches.delete(id);
          }
        }
        if (lookTouches.size === 0) {
          lookTouchId = null;
          lastPinchDist = null;
        } else if (lookTouches.size < 2) {
          lastPinchDist = null;
        }
      }

      function panWithPoint(id, pt) {
        if (lookTouchId !== id) {
          lookTouchId = id;
          lookLastX = pt.x;
          lookLastY = pt.y;
          return;
        }
        const dx = pt.x - lookLastX;
        const dy = pt.y - lookLastY;
        lookDX += dx;
        lookDY += dy;
        lookMoved += Math.hypot(dx, dy);
        lookLastX = pt.x;
        lookLastY = pt.y;
      }

      joyZone.addEventListener("touchstart", (e) => {
        showTouchControls();
        window.tendyAudio.touchUnlock();
        e.preventDefault();
        e.stopPropagation();
        syncActiveTouches(e);
        if (joyTouchId === null && e.changedTouches.length > 0) {
          const t = e.changedTouches[0];
          joyTouchId = t.identifier;
          lookTouches.delete(joyTouchId);
          lastPinchDist = null;
          zoomDelta = 0.0;
          updateJoyFromPoint(t.clientX, t.clientY);
        }
      }, { passive: false });

      function bindActionBtn(el, cb) {
        el.addEventListener("touchstart", (e) => {
          showTouchControls();
          window.tendyAudio.touchUnlock();
          e.preventDefault();
          e.stopPropagation();
          el.classList.add("pressed");
          cb();
        }, { passive: false });
        el.addEventListener("touchend", (e) => {
          e.preventDefault();
          el.classList.remove("pressed");
        }, { passive: false });
        el.addEventListener("touchcancel", () => {
          el.classList.remove("pressed");
        });
        el.addEventListener("click", (e) => {
          window.tendyAudio.touchUnlock();
          e.stopPropagation();
          if (e.detail > 0) cb();
        });
      }

      bindActionBtn(btnJump, () => { jumpQueued = true; });
      bindActionBtn(btnDash, () => { dashQueued = true; });
      bindActionBtn(btnAttack, () => { attackQueued = true; });
      bindActionBtn(btnHelp, () => { helpQueued = true; });
      bindActionBtn(btnMute, () => { window.tendyAudio.toggleMute(); });

      window.addEventListener("touchstart", (e) => {
        showTouchControls();
        window.tendyAudio.touchUnlock();
        syncActiveTouches(e);
        if (e.target && e.target.closest && e.target.closest(".touch-ui")) return;
        for (const t of e.changedTouches) {
          if (t.identifier === joyTouchId) continue;
          if (joyTouchId === null && isInJoystickArea(t.clientX, t.clientY)) {
            joyTouchId = t.identifier;
            lookTouches.delete(t.identifier);
            lastPinchDist = null;
            zoomDelta = 0.0;
            updateJoyFromPoint(t.clientX, t.clientY);
            continue;
          }
          if (joyTouchId !== null && lookTouches.size >= 1) continue;
          lookTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
          if (lookTouches.size === 1) {
            lookTouchId = t.identifier;
            lookLastX = t.clientX;
            lookLastY = t.clientY;
            lookMoved = 0;
            lastPinchDist = null;
          }
        }
        if (joyTouchId === null && lookTouches.size >= 2) {
          e.preventDefault();
          const pts = Array.from(lookTouches.values());
          lastPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          lastPinchMidX = (pts[0].x + pts[1].x) * 0.5;
          lastPinchMidY = (pts[0].y + pts[1].y) * 0.5;
          lookMoved = 999;
        }
      }, { passive: false });

      window.addEventListener("touchmove", (e) => {
        syncActiveTouches(e);
        let updatedLook = false;
        for (const t of e.changedTouches) {
          if (t.identifier === joyTouchId) {
            e.preventDefault();
            updateJoyFromPoint(t.clientX, t.clientY);
          } else if (lookTouches.has(t.identifier)) {
            lookTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
            updatedLook = true;
          }
        }
        if (joyTouchId !== null) {
          lastPinchDist = null;
          zoomDelta = 0.0;
        }
        if (!updatedLook) return;
        e.preventDefault();
        if (joyTouchId !== null) {
          if (lookTouches.size >= 1) {
            const [id, pt] = lookTouches.entries().next().value;
            panWithPoint(id, pt);
          }
        } else if (lookTouches.size >= 2) {
          const pts = Array.from(lookTouches.values());
          const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          const midX = (pts[0].x + pts[1].x) * 0.5;
          const midY = (pts[0].y + pts[1].y) * 0.5;
          if (lastPinchDist !== null) {
            if (Math.abs(dist - lastPinchDist) > 1.2) {
              zoomDelta -= (dist - lastPinchDist) * 0.04;
            }
            lookDX += midX - lastPinchMidX;
            lookDY += midY - lastPinchMidY;
          }
          lastPinchDist = dist;
          lastPinchMidX = midX;
          lastPinchMidY = midY;
          lookMoved = 999;
        } else if (lookTouches.size === 1) {
          const [id, pt] = lookTouches.entries().next().value;
          panWithPoint(id, pt);
        }
      }, { passive: false });

      function endTouch(e) {
        let triggeredTap = false;
        for (const t of e.changedTouches) {
          if (t.identifier === joyTouchId) {
            resetJoy();
          } else if (lookTouches.has(t.identifier)) {
            lookTouches.delete(t.identifier);
            if (lookTouches.size === 0) {
              if (lookMoved < 14) {
                actionTapQueued = true;
                triggeredTap = true;
              }
              lookTouchId = null;
              lastPinchDist = null;
            }
          }
        }
        syncActiveTouches(e);
        if (lookTouches.size === 1) {
          const [id, pt] = lookTouches.entries().next().value;
          lookTouchId = id;
          lookLastX = pt.x;
          lookLastY = pt.y;
          lookMoved = 999;
        }
        if (
          triggeredTap &&
          !isPlayingState &&
          !fsDismissed &&
          !autoFsAttempted &&
          isMobileViewport() &&
          !(e.target && e.target.closest && e.target.closest(".touch-ui"))
        ) {
          autoFsAttempted = true;
          requestOptimalFullscreen();
        }
      }
      window.addEventListener("touchend", endTouch, { passive: false });
      window.addEventListener("touchcancel", endTouch, { passive: false });

      window.addEventListener("wheel", (e) => {
        e.preventDefault();
        let dy = e.deltaY;
        if (e.deltaMode === 1) dy *= 32.0;
        else if (e.deltaMode === 2) dy *= 300.0;
        zoomDelta += dy * 0.012;
      }, { passive: false });

      let pendingInitMode = (() => {
        const s = window.location.search;
        if (s.includes("cutscene=1")) return 1;
        if (s.includes("boss=1")) return 2;
        if (s.includes("anime=1")) return 3;
        if (s.includes("city_intro=1")) return 4;
        if (s.includes("city=1")) return 5;
        if (s.includes("city_titan=1")) return 6;
        if (s.includes("headphones=1")) return 7;
        return 0;
      })();
      let pendingCutsceneTime = (() => {
        try {
          const m = window.location.search.match(/[?&]cutscene_t=([0-9]+(?:\.[0-9]+)?)/);
          return m ? parseFloat(m[1]) : -1.0;
        } catch (_) {
          return -1.0;
        }
      })();

      function setPlaying(active) {
        isPlayingState = !!active;
        if (touchControls) {
          touchControls.classList.toggle("playing", isPlayingState);
        }
        if (!active) {
          resetJoy();
        }
        syncFullscreenUI();
      }

      function setBossMode(active) {
        if (touchControls) {
          touchControls.classList.toggle("boss-mode", !!active);
        }
        if (btnDash) {
          btnDash.textContent = active ? "ROLL" : "DASH";
        }
      }

      window.tendyFullscreen = {
        request: requestOptimalFullscreen,
        toggle: toggleFullscreen,
        isFullscreen,
        syncUI: syncFullscreenUI,
      };
      syncFullscreenUI();

      if (window.location.search.includes("autotest=walk")) {
        showTouchControls();
        setTimeout(() => {
          actionTapQueued = true;
          joyX = 0.18;
          joyY = 1.0;
          joyKnob.style.transform = "translate(8px, -44px)";
        }, 2500);
      }

      return {
        moveX: () => joyX,
        moveY: () => joyY,
        takeLookDX() { const v = lookDX; lookDX = 0.0; return v; },
        takeLookDY() { const v = lookDY; lookDY = 0.0; return v; },
        takeZoomDelta() { const v = zoomDelta; zoomDelta = 0.0; return v; },
        takeJump() { const v = jumpQueued; jumpQueued = false; return v; },
        takeDash() { const v = dashQueued; dashQueued = false; return v; },
        takeAttack() { const v = attackQueued; attackQueued = false; return v; },
        takeActionTap() { const v = actionTapQueued; actionTapQueued = false; return v; },
        takeHelp() { const v = helpQueued; helpQueued = false; return v; },
        setPlaying,
        setBossMode,
        initMode() { const m = pendingInitMode; pendingInitMode = 0; return m; },
        takeCutsceneStartTime() { const t = pendingCutsceneTime; pendingCutsceneTime = -1.0; return t; },
      };
    })();
  </script>
  <script>
    // Hide loading overlay once Bevy starts rendering frames
    const observer = new MutationObserver(() => {
      const c = document.querySelector("canvas");
      if (c && c.width > 0) {
        const el = document.getElementById("loading");
        if (el) el.style.display = "none";
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true, attributes: true });
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tendy Quest — Giant Kitchen</title>
  <link data-trunk rel="copy-dir" href="../assets/models" data-target-path="assets/models" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a120b;
      font-family: system-ui, -apple-system, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      outline: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #3b2614, #1a120b);
      color: #fde68a;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #loading h1 {
      font-size: 2.5rem;
      margin: 0 0 0.5rem 0;
      text-shadow: 0 3px 10px rgba(0,0,0,0.6);
    }
    #loading p {
      color: #fef3c7;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>TENDY QUEST</h1>
    <p>Loading Giant Kitchen (Rust + WebAssembly)...</p>
  </div>
  <script>
    // Hide loading overlay once Bevy starts rendering frames
    const observer = new MutationObserver(() => {
      const c = document.querySelector("canvas");
      if (c && c.width > 0) {
        const el = document.getElementById("loading");
        if (el) el.style.display = "none";
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true, attributes: true });
  </script>
</body>
</html>

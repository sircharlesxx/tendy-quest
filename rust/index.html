  <title>Tendy Quest — Giant Kitchen</title>
  <script>
    (function () {
      const BUILD_ID = (document.querySelector('meta[name="tq-build"]')?.content || "").trim();
      window.TQ_BUILD_ID = BUILD_ID;

      async function clearCachesAsync() {
        const tasks = [];
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then((regs) =>
                Promise.allSettled(regs.map((r) => r.unregister()))
              )
            );
          }
        } catch (_) {}
        try {
          if (window.caches && caches.keys) {
            tasks.push(
              caches.keys().then((keys) =>
                Promise.allSettled(keys.map((k) => caches.delete(k)))
              )
            );
          }
        } catch (_) {}
        if (!tasks.length) return;
        await Promise.race([
          Promise.allSettled(tasks),
          new Promise((res) => setTimeout(res, 1200)),
        ]);
      }

      function clearCaches() {
        void clearCachesAsync();
      }

      const SAVE_KEYS = ["tendy_quest_save_v1", "tendy_quest_mom_defeated_v1", "tendy_wendies_v1"];
      function snapshotSavesBeforeReload() {
        const snap = {};
        try {
          for (const k of SAVE_KEYS) {
            const v = localStorage.getItem(k);
            if (v !== null && v !== "") snap[k] = v;
          }
          if (Object.keys(snap).length) {
            sessionStorage.setItem("tq_save_snap_v1", JSON.stringify(snap));
          }
        } catch (_) {}
      }
      function restoreSavesIfMissing() {
        try {
          const raw = sessionStorage.getItem("tq_save_snap_v1");
          if (!raw) return;
          const snap = JSON.parse(raw);
          if (snap && typeof snap === "object") {
            for (const k of SAVE_KEYS) {
              const cur = localStorage.getItem(k);
              if ((cur === null || cur === "") && typeof snap[k] === "string" && snap[k] !== "") {
                localStorage.setItem(k, snap[k]);
              }
            }
          }
          sessionStorage.removeItem("tq_save_snap_v1");
        } catch (_) {}
      }
      restoreSavesIfMissing();

      window.tqClearCacheAndReload = async function () {
        try { sessionStorage.removeItem("tq_reloaded_v"); } catch (_) {}
        snapshotSavesBeforeReload();
        await clearCachesAsync();
        let remoteVer = "";
        try {
          const ctrl = typeof AbortController === "function" ? new AbortController() : null;
          const timer = ctrl ? setTimeout(() => ctrl.abort(), 1500) : null;
          const res = await fetch("./version.json?_cb=" + Date.now(), {
            cache: "no-store",
            signal: ctrl ? ctrl.signal : undefined,
          });
          if (timer) clearTimeout(timer);
          if (res.ok) {
            const data = await res.json();
            if (data && typeof data.v === "string") remoteVer = data.v.trim();
          }
        } catch (_) {}
        const u = new URL(location.href);
        if (remoteVer) u.searchParams.set("_v", remoteVer);
        u.searchParams.set("_cb", String(Date.now()));
        location.replace(u.toString());
      };

      async function applyUpdate(remoteVer, preserveFreeRoam) {
        try {
          if (sessionStorage.getItem("tq_reloaded_v") === remoteVer) return false;
          sessionStorage.setItem("tq_reloaded_v", remoteVer);
        } catch (_) {}
        try {
          if (document.body && !document.getElementById("tq-updating-overlay")) {
            const ov = document.createElement("div");
            ov.id = "tq-updating-overlay";
            ov.textContent = "Updating to latest build (" + remoteVer + ")... Save preserved!";
            ov.style.cssText =
              "position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;" +
              "background:rgba(8,12,24,.92);color:#ffd84a;font:700 18px system-ui,sans-serif;" +
              "text-align:center;padding:24px";
            document.body.appendChild(ov);
          }
        } catch (_) {}
        snapshotSavesBeforeReload();
        await clearCachesAsync();
        const u = new URL(location.href);
        u.searchParams.set("_v", remoteVer);
        u.searchParams.set("_cb", String(Date.now()));
        if (preserveFreeRoam) u.searchParams.set("free_roam", "1");
        location.replace(u.toString());
        return true;
      }

      function showUpdateBanner(remoteVer) {
        const make = () => {
          if (document.getElementById("tq-update-banner") || !document.body) return;
          const b = document.createElement("button");
          b.id = "tq-update-banner";
          b.type = "button";
          b.textContent = "New version (" + remoteVer + ") available - Tap to update";
          b.style.cssText =
            "position:fixed;top:10px;right:10px;z-index:99;padding:8px 12px;border-radius:10px;" +
            "border:2px solid #ffd84a;background:rgba(12,20,36,.95);color:#ffd84a;" +
            "font:700 12px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.5)";
          b.addEventListener("click", () => {
            try { sessionStorage.removeItem("tq_reloaded_v"); } catch (_) {}
            void applyUpdate(remoteVer, !!(window.tendyNet && window.tendyNet.isInFreeRoam && window.tendyNet.isInFreeRoam()));
          });
          document.body.appendChild(b);
        };
        if (document.body) make();
        else document.addEventListener("DOMContentLoaded", make, { once: true });
      }

      async function checkVersion(autoReload, preserveFreeRoam) {
        if (!BUILD_ID || BUILD_ID === "__TQ_" + "BUILD_ID__") return;
        try {
          const ctrl = typeof AbortController === "function" ? new AbortController() : null;
          const timer = ctrl ? setTimeout(() => ctrl.abort(), 1500) : null;
          const res = await fetch("./version.json?_cb=" + Date.now(), {
            cache: "no-store",
            signal: ctrl ? ctrl.signal : undefined,
          });
          if (timer) clearTimeout(timer);
          if (!res.ok) return;
          const data = await res.json();
          const remoteVer = data && typeof data.v === "string" ? data.v.trim() : "";
          if (remoteVer && remoteVer !== BUILD_ID) {
            if (autoReload && (await applyUpdate(remoteVer, preserveFreeRoam))) return;
            showUpdateBanner(remoteVer);
          }
        } catch (_) {}
      }

      let lastEnsureCheckMs = 0;
      let ensureCheckPromise = null;
      // Called when entering Free Mode or when a peer joins in Free Mode so everyone runs
      // the latest deployed build while preserving all localStorage save data.
      window.tqEnsureLatestBuild = function (preserveFreeRoam) {
        if (!BUILD_ID || BUILD_ID === "__TQ_" + "BUILD_ID__") return Promise.resolve();
        const now = performance.now();
        if (ensureCheckPromise) return ensureCheckPromise;
        if (now - lastEnsureCheckMs < 10000) return Promise.resolve();
        lastEnsureCheckMs = now;
        ensureCheckPromise = checkVersion(true, !!preserveFreeRoam).finally(() => {
          ensureCheckPromise = null;
        });
        return ensureCheckPromise;
      };

      void checkVersion(true, false);
      window.addEventListener("pageshow", (e) => {
        if (e.persisted) void checkVersion(true, !!(window.tendyNet && window.tendyNet.isInFreeRoam && window.tendyNet.isInFreeRoam()));
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          const inFree = !!(window.tendyNet && window.tendyNet.isInFreeRoam && window.tendyNet.isInFreeRoam());
          void checkVersion(inFree, inFree);
        }
      });
    })();
  </script>

  <script>
    window.tendySave = {
      saveCheckpoint(json) {
        try {
          localStorage.setItem("tendy_quest_save_v1", String(json || ""));
        } catch (_) {}
      },
      loadCheckpoint() {
        try {
          return localStorage.getItem("tendy_quest_save_v1") || "";
        } catch (_) {
          return "";
        }
      },
      clearCheckpoint() {
        try {
          localStorage.removeItem("tendy_quest_save_v1");
        } catch (_) {}
      },
      markMomDefeated() {
        try {
          localStorage.setItem("tendy_quest_mom_defeated_v1", "1");
        } catch (_) {}
      },
      hasDefeatedMom() {
        try {
          return localStorage.getItem("tendy_quest_mom_defeated_v1") === "1";
        } catch (_) {
          return false;
        }
      },
      // Persistent Tendy Wendies currency wallet tracked across casino play and future features.
      saveTendyWendies(amount) {
        const clean = Math.max(0, Math.floor(Number(amount) || 0));
        try {
          localStorage.setItem("tendy_wendies_v1", String(clean));
        } catch (_) {}
        if (window.tendyTelemetry) window.tendyTelemetry.tendyWendies = clean;
      },
      loadTendyWendies() {
        try {
          const raw = localStorage.getItem("tendy_wendies_v1");
          if (raw === null || raw === "") {
            const seed = 100;
            if (window.tendyTelemetry) window.tendyTelemetry.tendyWendies = seed;
            return seed;
          }
          const n = Math.max(0, Math.floor(Number(raw)));
          const val = Number.isFinite(n) ? n : 100;
          if (window.tendyTelemetry) window.tendyTelemetry.tendyWendies = val;
          return val;
        } catch (_) {
          return 100;
        }
      },
      clearAllProgress() {
        try {
          localStorage.removeItem("tendy_quest_save_v1");
          localStorage.removeItem("tendy_quest_mom_defeated_v1");
          localStorage.removeItem("tendy_wendies_v1");
        } catch (_) {}
        if (window.tendyTelemetry) window.tendyTelemetry.tendyWendies = 100;
      },
      clearCacheAndReload() {
        if (typeof window.tqClearCacheAndReload === "function") {
          void window.tqClearCacheAndReload();
          return;
        }
        const u = new URL(location.href);
        u.searchParams.set("_cb", String(Date.now()));
        location.replace(u.toString());
      },
    };
    window.tendyTelemetry = {
      state: "Tutorial",
      hearts: 5,
      tendies: 0,
      stamina: 100,
      bossHp: 100,
      credits: 0,
      tendyWendies: 100,
      inCity: false,
      // Ferris wheel debug line (debug=1 runs with city_start=wheel or wheel_demo only).
      wheel: "",
      setWheel(line) {
        this.wheel = line;
      },
      // Skate park debug demos (?debug=1&park_demo=...) append per-frame state lines here.
      parkLog(line) {
        const log = (window.tendyParkLog = window.tendyParkLog || []);
        log.push(line);
        if (log.length > 20000) log.shift();
      },
      update(state, hearts, tendies, stamina, bossHp, credits, inCity) {
        this.state = state;
        this.hearts = hearts;
        this.tendies = tendies;
        this.stamina = stamina;
        this.bossHp = bossHp;
        this.credits = credits;
        this.inCity = inCity;
      },
    };
    // Loading screen handoff. The game boots behind its own black fade overlay and calls
    // ready() once the hero + Level 1 scenes have loaded (or its timeout passes). The HTML
    // loading screen then fades out (CSS opacity transition) instead of vanishing, and the game
    // fades in from black underneath it. A fallback timer fades it anyway if ready() never comes.
    window.tendyBoot = {
      isReady: false,
      hidden: false,
      ready() {
        this.isReady = true;
        this.hide();
      },
      hide() {
        if (this.hidden) return;
        const el = document.getElementById("loading");
        if (!el) return;
        this.hidden = true;
        el.style.pointerEvents = "none";
        el.style.opacity = "0";
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          el.style.display = "none";
        };
        el.addEventListener("transitionend", finish, { once: true });
        setTimeout(finish, 700);
      },
    };
    window.tendyAudio = (() => {
      const SFX_NAMES = [
        "jump", "double_jump", "dash", "tendy", "powerup",
        "hit", "shield", "step", "lunge", "win", "lose"
      ];
      let ctx = null;
      let masterGain = null;
      let bgmGain = null;
      let ambGain = null;
      let bgmSource = null;
      let ambSource = null;
      let bgmRequested = false;
      let bgmStarted = false;
      let ambStarted = false;
      let muted = false;
      const buffers = {};
      const loading = {};

      function ensureCtx() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          masterGain = ctx.createGain();
          masterGain.gain.value = muted ? 0.0 : 1.0;
          masterGain.connect(ctx.destination);

          bgmGain = ctx.createGain();
          bgmGain.gain.value = 0.42;
          bgmGain.connect(masterGain);

          ambGain = ctx.createGain();
          ambGain.gain.value = 0.14;
          ambGain.connect(masterGain);
        }
        return ctx;
      }

      async function loadBuffer(key, url) {
        if (buffers[key]) return buffers[key];
        if (loading[key]) return loading[key];
        const ac = ensureCtx();
        if (!ac) return null;
        loading[key] = fetch(url)
          .then((res) => (res.ok ? res.arrayBuffer() : null))
          .then((arr) => (arr ? ac.decodeAudioData(arr) : null))
          .then((buf) => {
            if (buf) buffers[key] = buf;
            return buf;
          })
          .catch(() => null);
        return loading[key];
      }

      function preloadAll() {
        try {
          loadBuffer("bgm", "assets/audio/tendies_from_the_sun.mp3").then(() => {
            if (bgmRequested) startLoops();
          });
          loadBuffer("ambience", "assets/audio/kitchen_ambience.mp3").then(() => {
            if (bgmRequested) startLoops();
          });
          for (const name of SFX_NAMES) {
            loadBuffer(name, `assets/audio/${name}.wav`);
          }
        } catch (_) {}
      }

      let droneOsc1 = null;
      let droneOsc2 = null;
      let droneGain = null;
      let bossTimer = null;
      let bossStep = 0;
      let vikingTimer = null;
      let vikingStep = 0;
      let headphoneTimer = null;
      let headphoneStep = 0;
      let jazzTimer = null;
      let lexieRpgTimer = null;
      let lexieRpgStep = 0;

      // Music changes crossfade instead of hard-stopping: every procedural track plays through
      // its own bus gain that ramps in over MUSIC_FADE_S; on a change the old bus ramps out while
      // its sequencer keeps ticking into it, and is torn down once silent. The looped bgm/ambience
      // buffers just ramp their gains. This removes the clicks from cutting oscillators mid-cycle.
      const MUSIC_FADE_S = 0.3;
      let musicBus = null;
      let currentTrack = "";
      let trackStartedMs = -1e9;

      function rampGain(param, target, secs) {
        if (!ctx || !param) return;
        const now = ctx.currentTime;
        try {
          if (param.cancelAndHoldAtTime) {
            param.cancelAndHoldAtTime(now);
          } else {
            const v = param.value;
            param.cancelScheduledValues(now);
            param.setValueAtTime(v, now);
          }
          param.linearRampToValueAtTime(target, now + secs);
        } catch (_) {
          try { param.setValueAtTime(target, now); } catch (_) {}
        }
      }

      // Fresh fading-in output bus for the track being started; returns its input node.
      function newMusicBus(ac) {
        const bus = ac.createGain();
        bus.gain.setValueAtTime(0.0, ac.currentTime);
        bus.gain.linearRampToValueAtTime(1.0, ac.currentTime + MUSIC_FADE_S);
        bus.connect(masterGain);
        musicBus = bus;
        return bus;
      }

      // Several systems can ask for the same track in one frame (e.g. a cutscene exit and the
      // OnEnter of the state it returns to). Restarting it would just re-trigger the fade.
      function isTrackRestart(name) {
        const now = performance.now();
        if (name === currentTrack && now - trackStartedMs < 250) return true;
        currentTrack = name;
        trackStartedMs = now;
        return false;
      }

      function stopSpecialAudio() {
        try {
          const timers = [bossTimer, vikingTimer, headphoneTimer, jazzTimer, lexieRpgTimer];
          const oscs = [droneOsc1, droneOsc2];
          const oldDrone = droneGain;
          const oldBus = musicBus;
          bossTimer = null;
          vikingTimer = null;
          headphoneTimer = null;
          jazzTimer = null;
          lexieRpgTimer = null;
          droneOsc1 = null;
          droneOsc2 = null;
          droneGain = null;
          musicBus = null;
          if (ctx) {
            const end = ctx.currentTime + MUSIC_FADE_S + 0.05;
            if (oldBus) rampGain(oldBus.gain, 0.0, MUSIC_FADE_S);
            for (const o of oscs) {
              if (o) { try { o.stop(end); } catch (_) {} }
            }
          }
          setTimeout(() => {
            for (const t of timers) { if (t) clearInterval(t); }
            for (const o of oscs) { if (o) { try { o.disconnect(); } catch (_) {} } }
            try { if (oldDrone) oldDrone.disconnect(); } catch (_) {}
            try { if (oldBus) oldBus.disconnect(); } catch (_) {}
          }, (MUSIC_FADE_S + 0.1) * 1000);
          if (bgmGain) rampGain(bgmGain.gain, 0.0, MUSIC_FADE_S);
          if (ambGain) rampGain(ambGain.gain, 0.0, MUSIC_FADE_S);
        } catch (_) {}
      }

      // Short band-passed white-noise burst (snares, crunches, door thuds), shaped like the
      // mkOsc envelopes: quick attack, exponential decay. Routes to the SFX master unless a
      // destination bus is passed (music loops pass their own bus).
      let sfxNoiseBuf = null;
      function mkNoise(dur, gainPeak, freq, dest) {
        const ac = ensureCtx();
        if (!ac || !masterGain) return;
        if (!sfxNoiseBuf || sfxNoiseBuf.sampleRate !== ac.sampleRate) {
          const len = Math.floor(ac.sampleRate * 1.0);
          sfxNoiseBuf = ac.createBuffer(1, len, ac.sampleRate);
          const d = sfxNoiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        }
        const now = ac.currentTime;
        const src = ac.createBufferSource();
        src.buffer = sfxNoiseBuf;
        const bp = ac.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = freq;
        bp.Q.value = 0.9;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(gainPeak, now + 0.008);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        src.connect(bp);
        bp.connect(g);
        g.connect(dest || masterGain);
        src.start(now);
        src.stop(now + dur + 0.02);
      }

      function synthProcSfx(name) {
        const ac = ensureCtx();
        if (!ac || !masterGain) return false;
        const now = ac.currentTime;
        const mkOsc = (type, f0, f1, dur, gainPeak) => {
          const osc = ac.createOscillator();
          const g = ac.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(f0, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
          g.gain.setValueAtTime(0.001, now);
          g.gain.linearRampToValueAtTime(gainPeak, now + 0.015);
          g.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(g);
          g.connect(masterGain);
          osc.start(now);
          osc.stop(now + dur + 0.02);
        };
        if (name === "saber_ignite") {
          mkOsc("sawtooth", 110, 420, 0.36, 0.28);
          mkOsc("triangle", 220, 140, 0.45, 0.22);
          return true;
        }
        if (name === "saber_swing") {
          mkOsc("sawtooth", 340, 135, 0.19, 0.22);
          mkOsc("sine", 560, 210, 0.17, 0.14);
          return true;
        }
        if (name === "saber_hit") {
          mkOsc("square", 680, 120, 0.16, 0.30);
          mkOsc("sawtooth", 980, 240, 0.14, 0.20);
          return true;
        }
        if (name === "dodge_roll") {
          mkOsc("sine", 240, 520, 0.18, 0.22);
          return true;
        }
        if (name === "saber_block") {
          mkOsc("square", 1250, 620, 0.12, 0.20);
          mkOsc("sawtooth", 180, 90, 0.16, 0.22);
          return true;
        }
        if (name === "saber_parry") {
          mkOsc("square", 1500, 1900, 0.10, 0.20);
          mkOsc("triangle", 2400, 1200, 0.24, 0.18);
          mkOsc("sawtooth", 220, 110, 0.18, 0.20);
          return true;
        }
        if (name === "powerbomb") {
          mkOsc("sine", 160, 28, 0.55, 0.45);
          mkOsc("sawtooth", 220, 42, 0.42, 0.30);
          mkNoise(0.28, 0.36, 320);
          return true;
        }
        if (name === "kamehameha") {
          mkOsc("sawtooth", 220, 880, 0.45, 0.26);
          mkOsc("sine", 440, 1320, 0.65, 0.24);
          mkNoise(0.45, 0.22, 1800);
          return true;
        }
        if (name === "spirit_bomb") {
          mkOsc("sine", 140, 560, 0.75, 0.28);
          mkOsc("triangle", 280, 1120, 0.85, 0.24);
          mkOsc("sawtooth", 90, 45, 0.70, 0.26);
          return true;
        }
        if (name === "sonic_spin") {
          mkOsc("sawtooth", 300, 1600, 0.40, 0.24);
          mkOsc("square", 450, 1950, 0.38, 0.16);
          return true;
        }
        if (name === "esxi_click") {
          mkOsc("square", 1320, 1760, 0.06, 0.22);
          mkOsc("sine", 880, 1320, 0.14, 0.18);
          return true;
        }
        if (name === "stun_bell") {
          mkOsc("triangle", 988, 1318, 0.22, 0.25);
          mkOsc("sine", 1568, 1046, 0.32, 0.20);
          return true;
        }
        if (name === "bubble_pop") {
          mkOsc("sine", 260, 920, 0.14, 0.28);
          mkNoise(0.08, 0.24, 1200);
          return true;
        }
        if (name === "wonka_scream") {
          mkOsc("sawtooth", 820, 1660, 0.52, 0.24);
          mkOsc("sawtooth", 835, 420, 1.15, 0.20);
          mkOsc("triangle", 1240, 620, 0.90, 0.18);
          mkNoise(0.35, 0.12, 2400);
          return true;
        }
        if (name === "wonka_halt") {
          stopSpecialAudio();
          mkOsc("triangle", 150, 42, 0.22, 0.34);
          mkOsc("square", 980, 320, 0.06, 0.18);
          mkNoise(0.09, 0.26, 950);
          return true;
        }
        if (name === "sleep_snore") {
          mkOsc("triangle", 110, 78, 0.45, 0.18);
          return true;
        }
        if (name === "guard_break") {
          mkOsc("sawtooth", 420, 70, 0.32, 0.30);
          mkOsc("square", 160, 60, 0.30, 0.20);

      function startLoops() {
        const ac = ensureCtx();
        if (!ac || ac.state !== "running") return;
        if (!bgmStarted && buffers["bgm"]) {
          bgmStarted = true;
          bgmSource = ac.createBufferSource();

          bgmSource.connect(bgmGain);
          bgmSource.start(0);
        }

          ambStarted = true;
          ambSource = ac.createBufferSource();
          ambSource.buffer = buffers["ambience"];
          ambSource.loop = true;
          ambSource.connect(ambGain);
          ambSource.start(0);
        }
      }

      function unlockAndMaybeStart() {
        try {
          if (window.speechSynthesis) {
            try {
              window.speechSynthesis.getVoices();
              if (window.speechSynthesis.paused) window.speechSynthesis.resume();
            } catch (_) {}
          }
          const ac = ensureCtx();
          if (!ac) return;
          if (ac.state === "suspended") {
            ac.resume().then(() => {
              if (bgmRequested) startLoops();
            }).catch(() => {});
          } else if (bgmRequested) {
            startLoops();
          }
        } catch (_) {}
      }

        preloadAll();
        unlockAndMaybeStart();
      });
      window.addEventListener("keydown", () => {
        preloadAll();
        unlockAndMaybeStart();
      });
      window.addEventListener("load", preloadAll);

      return {
        playBgm() {

          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();

            droneOsc2.type = "sawtooth";
            droneOsc2.frequency.value = 82.41;
            droneOsc1.connect(filter);
            droneOsc2.connect(filter);
            droneOsc1.start();
            droneOsc2.start();
          } catch (_) {}
        },
        playHeadphoneMusic(level = 1) {
          if (isTrackRestart("headphone" + level)) return;
          stopSpecialAudio();
          bgmRequested = true;
          preloadAll();
          unlockAndMaybeStart();
          startLoops();
          try {
            const ac = ensureCtx();
            if (!ac || !masterGain) return;
            const out = newMusicBus(ac);
            const lv = Math.max(1, level | 0);
            const uzumaki = lv >= 2;
            if (bgmGain) rampGain(bgmGain.gain, 0.0, MUSIC_FADE_S);
            if (ambGain) rampGain(ambGain.gain, 0.03, MUSIC_FADE_S);

            filter.type = "lowpass";
            filter.frequency.value = uzumaki ? 280 : 190;

            droneOsc1.type = "triangle";
            droneOsc1.frequency.value = uzumaki ? 32.7 : 36.71;

              ? [622.25, 587.33, 554.37, 466.16, 415.30, 392.0, 311.13, 277.18]
              : [587.33, 554.37, 466.16, 440.0, 392.0, 349.23, 329.63, 277.18];

            headphoneTimer = setInterval(() => {
              if (muted || ac.state !== "running") return;
              const now = ac.currentTime;
              const step = headphoneStep % 8;

  <script>
    window.tendyInput = (() => {
      let joyX = 0.0;
      let joyY = 0.0;
      let lookDX = 0.0;
      let lookDY = 0.0;
      let zoomDelta = 0.0;
      let jumpQueued = false;
      // Touch JUMP still held (skate park backflips need a hold; taps stay queued above).
      let jumpTouchHeld = false;
      let dashQueued = false;
      let attackQueued = false;
      // SABER held (touch) / RB or RT held (gamepad): boss-mode heavy charge. Tap = light swing.
      let attackTouchHeld = false;
      let gpAttackHeld = false;
      let bossModeActive = false;
      let blockHeld = false;
      let actionTapQueued = false;
      let helpQueued = false;

      let joyTouchId = null;
      let lookTouchId = null;
      const lookTouches = new Map();
      let lastPinchDist = null;
      let lastPinchMidX = 0;
      let lastPinchMidY = 0;
      let lookLastX = 0;
      let lookLastY = 0;
      let lookMoved = 0;
      const maxR = 46;

      const touchControls = document.getElementById("touch-controls");
      const joyZone = document.getElementById("joystick-zone");
      const joyKnob = document.getElementById("joystick-knob");
      const btnJump = document.getElementById("btn-jump");
      const btnDash = document.getElementById("btn-dash");
      const btnAttack = document.getElementById("btn-attack");
      const btnBlock = document.getElementById("btn-block");
      const btnHelp = document.getElementById("btn-help");
      const btnMute = document.getElementById("btn-mute");
      const btnFullscreen = document.getElementById("btn-fullscreen");
      const fsPrompt = document.getElementById("fullscreen-prompt");
      const btnFsPrompt = document.getElementById("btn-fullscreen-prompt");
      const btnFsDismiss = document.getElementById("btn-fullscreen-dismiss");
      let fsDismissed = false;
      let autoFsAttempted = false;
      let isPlayingState = false;

      const isMobileViewport = () =>
        (window.matchMedia &&
          (window.matchMedia("(pointer: coarse)").matches ||
            window.matchMedia("(max-width: 960px)").matches)) ||
        "ontouchstart" in window ||
        navigator.maxTouchPoints > 0;

      const isFullscreen = () =>
        Boolean(
          document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.mozFullScreenElement ||
            document.msFullscreenElement
        );

      async function requestOptimalFullscreen() {
        if (isFullscreen()) {
          syncFullscreenUI();
          return true;
        }
        const el = document.documentElement;
        const req =
          el.requestFullscreen ||
          el.webkitRequestFullscreen ||
          el.mozRequestFullScreen ||
          el.msRequestFullscreen;
        if (!req) {
          try { window.scrollTo(0, 1); } catch (_) {}
          syncFullscreenUI();
          return false;
        }
        try {
          if (el.requestFullscreen) {
            try {
              await el.requestFullscreen({ navigationUI: "hide" });
            } catch (_) {
              await el.requestFullscreen();
            }
          } else {
            await Promise.resolve(req.call(el));
          }
          syncFullscreenUI();
          return true;
        } catch (_) {
          syncFullscreenUI();
          return false;
        }
      }

      async function toggleFullscreen() {
        try {
          if (isFullscreen()) {
            const exit =
              document.exitFullscreen ||
              document.webkitExitFullscreen ||
              document.mozCancelFullScreen ||
              document.msExitFullscreen;
            if (exit) await Promise.resolve(exit.call(document));
          } else {
            await requestOptimalFullscreen();
          }
        } catch (_) {}
        syncFullscreenUI();
      }

      function syncFullscreenUI() {
        const fs = isFullscreen();
        if (btnFullscreen) {
          btnFullscreen.textContent = fs ? "EXIT" : "FULL";
          btnFullscreen.classList.toggle("highlight", !fs);
        }
        const inCutsceneInit = /cutscene=1|anime=1|city_intro=1|headphones=1|headphones=2|uzumaki=1/.test(
          window.location.search
        );
        if (fsPrompt) {
          const shouldShow =
            isMobileViewport() && !fs && !fsDismissed && !isPlayingState && !inCutsceneInit;
          fsPrompt.classList.toggle("visible", shouldShow);
        }
      }

      document.addEventListener("fullscreenchange", syncFullscreenUI);
      document.addEventListener("webkitfullscreenchange", syncFullscreenUI);
      window.addEventListener("resize", syncFullscreenUI);

      if (btnFsPrompt) {
        let lastFsTap = 0;
        const onFsTap = (e) => {
          const now = Date.now();
          if (now - lastFsTap < 250) return;
          lastFsTap = now;
          e.preventDefault();
          e.stopPropagation();
          window.tendyAudio.touchUnlock();
          autoFsAttempted = true;
          requestOptimalFullscreen().then((ok) => {
            if (ok && fsPrompt) fsPrompt.classList.remove("visible");
          });
        };
        btnFsPrompt.addEventListener("touchend", onFsTap, { passive: false });
        btnFsPrompt.addEventListener("click", onFsTap);
      }

      if (btnFsDismiss) {
        const onDismiss = (e) => {
          e.preventDefault();
          e.stopPropagation();
          fsDismissed = true;
          syncFullscreenUI();
        };
        btnFsDismiss.addEventListener("touchend", onDismiss, { passive: false });
        btnFsDismiss.addEventListener("click", onDismiss);
      }

      if (btnFullscreen) {
        let lastToggle = 0;
        const onToggle = (e) => {
          const now = Date.now();
          if (now - lastToggle < 250) return;
          lastToggle = now;
          e.preventDefault();
          e.stopPropagation();
          window.tendyAudio.touchUnlock();
          toggleFullscreen();
        };
        btnFullscreen.addEventListener("touchend", onToggle, { passive: false });
        btnFullscreen.addEventListener("click", onToggle);
      }

      function showTouchControls() {
        if (touchControls) touchControls.classList.add("active");
        syncFullscreenUI();
      }

      function updateJoyFromPoint(clientX, clientY) {
        const rect = joyZone.getBoundingClientRect();
        const cx = rect.left + rect.width * 0.5;
        const cy = rect.top + rect.height * 0.5;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const dist = Math.hypot(dx, dy);
        if (dist > maxR) {
          dx = (dx / dist) * maxR;
          dy = (dy / dist) * maxR;
        }
        joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        const nx = dx / maxR;
        const ny = -dy / maxR;
        const mag = Math.hypot(nx, ny);
        if (mag < 0.12) {
          joyX = 0.0;
          joyY = 0.0;
        } else {
          joyX = nx;
          joyY = ny;
        }
      }

      function resetJoy() {
        joyTouchId = null;
        joyX = 0.0;
        joyY = 0.0;
        joyKnob.style.transform = "translate(0px, 0px)";
      }

      function isInJoystickArea(clientX, clientY) {
        if (!touchControls || !touchControls.classList.contains("playing") || !joyZone) {
          return false;
        }
        const r = joyZone.getBoundingClientRect();
        if (r.width <= 0 || r.height <= 0) return false;
        const pad = 42;
        return (
          clientX >= r.left - pad &&
          clientX <= r.right + pad &&
          clientY >= r.top - pad &&
          clientY <= r.bottom + pad
        );
      }

      function syncActiveTouches(e) {
        const live = new Set();
        if (e && e.touches) {
          for (const t of e.touches) live.add(t.identifier);
        }
        if (joyTouchId !== null && !live.has(joyTouchId)) {
          resetJoy();
        }
        for (const id of lookTouches.keys()) {
          if (!live.has(id) || id === joyTouchId) {
            lookTouches.delete(id);
          }
        }
        if (lookTouches.size === 0) {
          lookTouchId = null;
          lastPinchDist = null;
        } else if (lookTouches.size < 2) {
          lastPinchDist = null;
        }
      }

          i += rem;
          if (type === 3 && body.length >= 2) {
            const tlen = (body[0] << 8) | body[1];
            let pos = 2 + tlen;
            if ((hdr & 0x06) !== 0) pos += 2; // skip packet id if QoS > 0
            if (pos <= body.length) {
              out.push({ type, text: new TextDecoder().decode(body.subarray(pos)) });
            }
          } else {
            out.push({ type, text: "" });
          }
        }
        return out;
      }

      function meshTransport(room, initialShard) {
        let closed = false;
        let signalingSuspended = false;
        let cleanCloses = 0;
        let zombieCloses = 0;
        let netResetTimer = null;
        let shard = initialShard | 0;
        let infoHash = makeInfoHash(room, shard);
        let shardJoinedAt = performance.now();
        let sawFirstSignal = false;
        let trackersUp = 0;

        const conns = new Map();        // peer_id -> conn record
        const pendingOffers = new Map();// offer_id -> { pc, st, ev, createdAt, announced }
        const trackerStates = [
          ...TRACKER_URLS.map((url, idx) => ({
            idx,
            url,
            isMqtt: false,
            ws: null,
            ready: false,
            backoffMs: 4000,
            nextRetryAt: 0,
            lastAnnounceAt: 0,
            connectTimer: null,
            lastRxAt: 0,
            lastReadyAt: 0,
            lastPingSentAt: 0,
            awaitingPong: false,
            pendingAnnounceAt: 0,
          })),
          {
            idx: TRACKER_URLS.length,
            url: MQTT_SIGNAL_URL,
            isMqtt: true,
            ws: null,
            ready: false,
            backoffMs: 4000,
            nextRetryAt: 0,
            lastAnnounceAt: 0,
            connectTimer: null,
            lastRxAt: 0,
            lastReadyAt: 0,
            lastPingSentAt: 0,
            awaitingPong: false,
            pendingAnnounceAt: 0,
          },
        ];

        const iceServers = stunUrl ? [...DEFAULT_STUN, { urls: stunUrl }] : DEFAULT_STUN;

        function openConnCount() {
          let n = 0;
          for (const c of conns.values()) if (c.open) n++;
          return n;
        }

        function readyOfferCount() {
          let n = 0;
          for (const c of pendingOffers.values()) if (c.sdp) n++;
          return n;
        }

        function openWsCount() {
          let n = 0;
          for (const s of trackerStates) if (s.ws) n++;
          return n;
        }

        function updateTrackersUp() {
          trackersUp = trackerStates.filter((x) => x.ready).length;
        }

        function closePeerConn(c) {
          if (!c) return;
          c.open = false;
          if (c.disconnectTimer) {
            clearTimeout(c.disconnectTimer);
            c.disconnectTimer = null;
          }
          if (c.st) {
            c.st.onmessage = null;
            c.st.onopen = null;
            c.st.onclose = null;
            try { c.st.close(); } catch (_) {}
          }
          if (c.ev) {
            c.ev.onmessage = null;
            c.ev.onopen = null;
            c.ev.onclose = null;
            try { c.ev.close(); } catch (_) {}
          }
          if (c.pc) {
            c.pc.onconnectionstatechange = null;
            c.pc.oniceconnectionstatechange = null;
            c.pc.ontrack = null;
            dropVoicePc(c.pc);
            try { c.pc.close(); } catch (_) {}
          }
        }

        function closeTrackerSocket(stEntry, code, reason, isZombie) {
          if (stEntry.connectTimer) {
            clearTimeout(stEntry.connectTimer);
            stEntry.connectTimer = null;
          }
          const ws = stEntry.ws;
          stEntry.ws = null;
          stEntry.ready = false;
          stEntry.awaitingPong = false;
          stEntry.pendingAnnounceAt = 0;
          if (ws) {
            ws.onopen = null;
            ws.onmessage = null;
            ws.onerror = null;
            ws.onclose = null;
            if (stEntry.isMqtt && ws.readyState === WebSocket.OPEN) {
              try { ws.send(new Uint8Array([0xe0, 0x00])); } catch (_) {} // MQTT DISCONNECT
            }
            if (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN) {
              try { ws.close(code || 1000, reason || ""); } catch (_) {}
            }
            if (isZombie) zombieCloses++;
            else cleanCloses++;
          }
          updateTrackersUp();
        }

        function scheduleRetry(stEntry, baseOverride) {
          const base = baseOverride || stEntry.backoffMs;
          const delay = Math.round(base * (0.75 + Math.random() * 0.5));
          stEntry.nextRetryAt = performance.now() + delay;
          if (!baseOverride) {
            stEntry.backoffMs = Math.min(60000, stEntry.backoffMs * 2);
          }
        }

        function attachDataChannels(c, remotePeerId) {
          c.remotePeerId = remotePeerId || c.remotePeerId || "";
          c.disconnectTimer = null;
          c.cleaned = false;
          c.st.binaryType = "arraybuffer";
          c.ev.binaryType = "arraybuffer";
          c.st.onmessage = (e) => onWire(e.data, c, false);
          c.ev.onmessage = (e) => onWire(e.data, c, true);
          c.ev.onopen = () => {
            if (closed || net.transport !== t) return;
            c.open = true;
            if (c.disconnectTimer) {
              clearTimeout(c.disconnectTimer);
              c.disconnectTimer = null;
            }
            net.joinedAt = Math.min(net.joinedAt, performance.now());
            sendHello();
            sendMeta();
            if (net.charLocked && net.lastBuf) sendBuf(net.lastBuf, false);
            setTimeout(() => sendPingToConn(c), 150);
            setStatus("Connected (" + (net.peers.size + 1) + "/4 | Shard " + (shard + 1) + ")");
            refreshCharSelect();
            refreshPanel();
            updateTelemetry();
          };
          const teardown = () => {
            if (c.cleaned) return;
            c.cleaned = true;
            closePeerConn(c);
            if (c.offerId && pendingOffers.get(c.offerId) === c) pendingOffers.delete(c.offerId);
            if (c.remotePeerId && conns.get(c.remotePeerId) === c) conns.delete(c.remotePeerId);
            if (c.boundId) {
              const p = net.peers.get(c.boundId);
              if (p && p.conn === c) removePeer(c.boundId);
            }
            if (!closed && net.transport === t) {
              setStatus(openConnCount() ? ("Connected (" + (net.peers.size + 1) + "/4 | Shard " + (shard + 1) + ")") : ("Searching Cedar Rapids squad (Shard " + (shard + 1) + ")..."));
              refreshPanel();
              updateTelemetry();
            }
          };
          c.ev.onclose = teardown;
          const handleState = () => {
            if (c.cleaned) return;
            const cs = c.pc.connectionState;
            const ice = c.pc.iceConnectionState;
            if (cs === "failed" || cs === "closed" || ice === "failed" || ice === "closed") {
              teardown();
              return;
            }
            if (cs === "connected" || ice === "connected" || ice === "completed") {
              if (c.disconnectTimer) {
                clearTimeout(c.disconnectTimer);
                c.disconnectTimer = null;
              }
              return;
            }
            if ((cs === "disconnected" || ice === "disconnected") && !c.disconnectTimer) {
              c.disconnectTimer = setTimeout(() => {
                c.disconnectTimer = null;
                if (!c.cleaned && (c.pc.connectionState === "disconnected" || c.pc.iceConnectionState === "disconnected")) {
                  teardown();
                }
              }, 5000);
            }
          };
          c.pc.onconnectionstatechange = handleState;
          c.pc.oniceconnectionstatechange = handleState;
        }

        function sendPingToConn(c) {
          if (!c || !c.open || !c.ev || c.ev.readyState !== "open") return;
          const [buf, v] = header(T_PING, LEN[T_PING]);
          v.setUint32(12, Math.floor(performance.now()) >>> 0, true);
          try { c.ev.send(buf); } catch (_) {}
        }

        let offerPoolPromise = null;
        async function prepareOfferPool(targetCount) {
          if (closed || signalingSuspended) return;
          if (offerPoolPromise) {
            await offerPoolPromise;
            if (closed || signalingSuspended) return;
          }
          const readyOffers = [...pendingOffers.values()].filter((c) => !!c.sdp).length;
          const needed = Math.max(0, Math.min(3, targetCount) - readyOffers);
          if (needed === 0) return;
          offerPoolPromise = (async () => {
            const jobs = [];
            for (let i = 0; i < needed; i++) {
              jobs.push((async () => {
                if (closed || signalingSuspended) return;
                const offerIdBytes = new Uint32Array(3);
                crypto.getRandomValues(offerIdBytes);
                const offerId = Array.from(offerIdBytes, (x) => x.toString(16).padStart(8, "0")).join("").slice(0, 20);
                const pc = new RTCPeerConnection({ iceServers, bundlePolicy: "max-bundle", rtcpMuxPolicy: "require" });
                attachVoiceHandlers(pc, true);
                const st = pc.createDataChannel("st", { negotiated: true, id: 0, ordered: false, maxRetransmits: 0 });
                const ev = pc.createDataChannel("ev", { negotiated: true, id: 1, ordered: true });
                const c = { pc, st, ev, open: false, bindsId: true, boundId: 0, offerId, createdAt: performance.now(), sdp: "" };
                attachDataChannels(c, null);
                pendingOffers.set(offerId, c);
                try {
                  await pc.setLocalDescription(await pc.createOffer());
                  await iceGathered(pc, 1800);
                  if (closed || signalingSuspended || !pc.localDescription || !pendingOffers.has(offerId)) {
                    pendingOffers.delete(offerId);
                    closePeerConn(c);
                    return;
                  }
                  c.sdp = pc.localDescription.sdp;
                } catch (_) {
                  pendingOffers.delete(offerId);
                  closePeerConn(c);
                }
              })());
            }
            await Promise.all(jobs);
          })();
          try {
            await offerPoolPromise;
          } finally {
            offerPoolPromise = null;
          }
        }

        function sendAnnounce(stEntry, forceOffers) {
          if (closed || signalingSuspended || !stEntry.ws || stEntry.ws.readyState !== WebSocket.OPEN) return;
          if (stEntry.ws.bufferedAmount > 65536) {
            closeTrackerSocket(stEntry, 4003, "backpressure", true);
            scheduleRetry(stEntry);
            return;
          }
          if (performance.now() - stEntry.lastAnnounceAt < (forceOffers ? 300 : 1200)) return;
          const roomSlotsLeft = Math.max(0, MESH_MAX_REMOTES - openConnCount());
          const offersPayload = [];
          if (roomSlotsLeft > 0) {
            const ready = [];
            for (const entry of pendingOffers) {
              if (entry[1].sdp) ready.push(entry);
            }
            if (ready.length === 0) return;
            const rot = (stEntry.idx || 0) % ready.length;
            const limit = Math.min(3, ready.length);
            for (let k = 0; k < limit; k++) {
              const [oid, c] = ready[(rot + k) % ready.length];
              offersPayload.push({ offer_id: oid, offer: { type: "offer", sdp: c.sdp } });
            }
          }
          const payload = {
            action: "announce",
            info_hash: infoHash,
            peer_id: myPeerId,
            numwant: roomSlotsLeft > 0 ? 5 : 0,
            uploaded: 0,
            downloaded: 0,
            left: 1,
          };
          if (offersPayload.length && (forceOffers || roomSlotsLeft > 0)) payload.offers = offersPayload;
          try {
            if (stEntry.isMqtt) {
              stEntry.ws.send(mqttPublishPkt("tendy-quest/v1/" + infoHash, JSON.stringify(payload)));
            } else {
              stEntry.ws.send(JSON.stringify(payload));
              stEntry.pendingAnnounceAt = performance.now();
            }
            stEntry.lastAnnounceAt = performance.now();
          } catch (_) {}
        }

        function sendSignalObj(stEntry, obj) {
          if (closed || !stEntry.ws || stEntry.ws.readyState !== WebSocket.OPEN) return;
          const raw = JSON.stringify(obj);
          if (stEntry.isMqtt) {
            stEntry.ws.send(mqttPublishPkt("tendy-quest/v1/" + infoHash, raw));
          } else {
            stEntry.ws.send(raw);
          }
        }

        async function handleTrackerMsg(stEntry, raw) {
          if (closed) return;
          let msg;
          try { msg = JSON.parse(raw); } catch (_) { return; }
          if (!msg || typeof msg !== "object") return;
          if (msg["failure reason"]) {
            stEntry.lastError = String(msg["failure reason"]);
            return;
          }
          if (msg.info_hash && msg.info_hash !== infoHash) return;
          if (msg.to_peer_id && msg.to_peer_id !== myPeerId) return;
          if (!msg.peer_id || msg.peer_id === myPeerId) return;

          // MQTT broadcast fan-out: when a peer announces multiple offers on the shared topic,
          // let each higher peer_id deterministically pick an offer index, and let the lower peer_id
          // re-announce so both sides converge cleanly without dual-offer glare.
          if (Array.isArray(msg.offers) && msg.offers.length && !msg.offer) {
            const existing = conns.get(msg.peer_id);
            const staleHalfOpen = existing && !existing.open && (
              performance.now() - (existing.createdAt || 0) >= 4500 ||
              existing.pc.connectionState === "failed" ||
              existing.pc.connectionState === "closed"
            );
            if (myPeerId > msg.peer_id && (!existing || staleHalfOpen) && openConnCount() < MESH_MAX_REMOTES) {
              let h = 0;
              for (let i = 0; i < myPeerId.length; i++) h = ((h * 31) + myPeerId.charCodeAt(i)) | 0;
              const pick = msg.offers[Math.abs(h) % msg.offers.length];
              if (pick && pick.offer && pick.offer_id) {
                await handleTrackerMsg(stEntry, JSON.stringify({
                  info_hash: infoHash,
                  peer_id: msg.peer_id,
                  offer_id: pick.offer_id,
                  offer: pick.offer,
                }));
              }
            } else if (myPeerId < msg.peer_id && (!existing || !existing.open) && pendingOffers.size > 0) {
              sendAnnounce(stEntry, true);
            }
            return;
          }

          // Incoming WebRTC offer from another Free Roam player.
          if (msg.offer && msg.offer.type === "offer" && typeof msg.offer.sdp === "string" && msg.offer_id) {
            if (openConnCount() >= MESH_MAX_REMOTES) {
              return;
            }
            if (myPeerId < msg.peer_id && pendingOffers.size > 0) {
              return; // Deterministic glare resolution: lower peer_id stays the offerer
            }
            const existing = conns.get(msg.peer_id);
            if (existing) {
              if (existing.open || myPeerId < msg.peer_id) return;
              if (existing.offerId && existing.offerId === msg.offer_id) return;
              if (
                performance.now() - (existing.createdAt || 0) < 4500 &&
                existing.pc.connectionState !== "failed" &&
                existing.pc.connectionState !== "closed"
              ) {
                return;
              }
              closePeerConn(existing);
              conns.delete(msg.peer_id);
            }
            const pc = new RTCPeerConnection({ iceServers, bundlePolicy: "max-bundle", rtcpMuxPolicy: "require" });
            attachVoiceHandlers(pc, false);
            const st = pc.createDataChannel("st", { negotiated: true, id: 0, ordered: false, maxRetransmits: 0 });
            const ev = pc.createDataChannel("ev", { negotiated: true, id: 1, ordered: true });
            const c = { pc, st, ev, open: false, bindsId: true, boundId: 0, offerId: msg.offer_id, createdAt: performance.now() };
            attachDataChannels(c, msg.peer_id);
            conns.set(msg.peer_id, c);
            try {
              await pc.setRemoteDescription({ type: "offer", sdp: msg.offer.sdp });
              await ensureAnswererAudio(pc);
              await pc.setLocalDescription(await pc.createAnswer());
              await iceGathered(pc, 2400);
              if (closed || signalingSuspended || !pc.localDescription) return;
              const answerObj = {
                action: "announce",
                info_hash: infoHash,
                peer_id: myPeerId,
                to_peer_id: msg.peer_id,
                offer_id: msg.offer_id,
                answer: { type: "answer", sdp: pc.localDescription.sdp },
              };
              let sent = false;
              if (stEntry.ws && stEntry.ws.readyState === WebSocket.OPEN) {
                sendSignalObj(stEntry, answerObj);
                sent = true;
              }
              const mqttEntry = trackerStates.find((x) => x.isMqtt && x.ready && x.ws && x.ws.readyState === WebSocket.OPEN);
              if (mqttEntry && mqttEntry !== stEntry) {
                sendSignalObj(mqttEntry, answerObj);
                sent = true;
              }
              if (!sent) {
                const fallbackEntry = trackerStates.find((x) => x.ready && x.ws && x.ws.readyState === WebSocket.OPEN);
                if (fallbackEntry) sendSignalObj(fallbackEntry, answerObj);
              }
            } catch (_) {
              if (conns.get(msg.peer_id) === c) conns.delete(msg.peer_id);
              closePeerConn(c);
            }
            return;
          }

          // Incoming answer to one of our pre-generated offers.
          if (msg.answer && msg.answer.type === "answer" && typeof msg.answer.sdp === "string" && msg.offer_id) {
            const c = pendingOffers.get(msg.offer_id);
            if (!c || c.pc.signalingState !== "have-local-offer") return;
            const dup = conns.get(msg.peer_id);
            if (dup && dup !== c) {
              // Prevent duplicate RTCPeerConnection leaks on simultaneous glare.
              if (dup.open || myPeerId > msg.peer_id) {
                pendingOffers.delete(msg.offer_id);
                closePeerConn(c);
                return;
              }
              closePeerConn(dup);
            }
            pendingOffers.delete(msg.offer_id);
            c.remotePeerId = msg.peer_id;
            c.createdAt = performance.now();
            conns.set(msg.peer_id, c);
            try {
              await c.pc.setRemoteDescription({ type: "answer", sdp: msg.answer.sdp });
            } catch (_) {
              if (conns.get(msg.peer_id) === c) conns.delete(msg.peer_id);
              closePeerConn(c);
            }
          }
        }

        function connectTracker(stEntry) {
          if (closed || signalingSuspended || stEntry.ws || (typeof navigator !== "undefined" && navigator.onLine === false)) return;
          try {
            const ws = stEntry.isMqtt ? new WebSocket(stEntry.url, ["mqtt"]) : new WebSocket(stEntry.url);
            if (stEntry.isMqtt) ws.binaryType = "arraybuffer";
            stEntry.ws = ws;
            stEntry.ready = false;
            stEntry.awaitingPong = false;
            stEntry.pendingAnnounceAt = 0;
            if (stEntry.connectTimer) clearTimeout(stEntry.connectTimer);
            stEntry.connectTimer = setTimeout(() => {
              if (stEntry.ws === ws && ws.readyState === WebSocket.CONNECTING) {
                closeTrackerSocket(stEntry, 4000, "connect-timeout", true);
                if (!closed && !signalingSuspended) scheduleRetry(stEntry);
                refreshPanel();
                updateTelemetry();
              }
            }, 10000);
            ws.onopen = async () => {
              if (stEntry.connectTimer) {
                clearTimeout(stEntry.connectTimer);
                stEntry.connectTimer = null;
              }
              if (closed || signalingSuspended || stEntry.ws !== ws) {
                if (stEntry.ws === ws) closeTrackerSocket(stEntry, 1000, "closed", false);
                else {
                  ws.onopen = ws.onmessage = ws.onerror = ws.onclose = null;
                  try { ws.close(1000, "closed"); } catch (_) {}
                }
                return;
              }
              const now = performance.now();
              stEntry.lastRxAt = now;
              if (stEntry.isMqtt) {
                try { ws.send(mqttConnectPkt("tq_" + myPeerId.slice(6))); } catch (_) {}
                return;
              }
              stEntry.ready = true;
              stEntry.lastReadyAt = now;
              if (!sawFirstSignal) { sawFirstSignal = true; shardJoinedAt = now; }
              updateTrackersUp();
              setStatus(openConnCount() ? ("Connected (" + (net.peers.size + 1) + "/4 | Shard " + (shard + 1) + ")") : ("Searching Cedar Rapids squad (Shard " + (shard + 1) + ", Signal " + trackersUp + "/" + trackerStates.length + ")..."));
              if (openConnCount() < MESH_MAX_REMOTES) await prepareOfferPool(isCellularOrMobile() ? 2 : 3);
              if (closed || signalingSuspended || stEntry.ws !== ws) return;
              sendAnnounce(stEntry, true);
              refreshPanel();
              updateTelemetry();
            };
            ws.onmessage = async (e) => {
              if (stEntry.ws !== ws || closed) return;
              const now = performance.now();
              stEntry.lastRxAt = now;
              stEntry.pendingAnnounceAt = 0;
              if (stEntry.isMqtt && e.data instanceof ArrayBuffer) {
                for (const pkt of mqttDecodePackets(e.data)) {
                  if (pkt.type === 2) {
                    stEntry.ready = true;
                    stEntry.lastReadyAt = now;
                    if (!sawFirstSignal) { sawFirstSignal = true; shardJoinedAt = now; }
                    updateTrackersUp();
                    try { ws.send(mqttSubscribePkt(1, "tendy-quest/v1/" + infoHash)); } catch (_) {}
                    setStatus(openConnCount() ? ("Connected (" + (net.peers.size + 1) + "/4 | Shard " + (shard + 1) + ")") : ("Searching Cedar Rapids squad (Shard " + (shard + 1) + ", Signal " + trackersUp + "/" + trackerStates.length + ")..."));
                    if (openConnCount() < MESH_MAX_REMOTES) await prepareOfferPool(isCellularOrMobile() ? 2 : 3);
                    if (closed || signalingSuspended || stEntry.ws !== ws) return;
                    sendAnnounce(stEntry, true);
                    refreshPanel();
                    updateTelemetry();
                  } else if (pkt.type === 13) {
                    stEntry.awaitingPong = false;
                  } else if (pkt.type === 3 && pkt.text) {
                    handleTrackerMsg(stEntry, pkt.text);
                  }
                }
              } else if (typeof e.data === "string") {
                handleTrackerMsg(stEntry, e.data);
              }
            };
            const onDown = () => {
              if (stEntry.ws !== ws) return;
              closeTrackerSocket(stEntry, 1000, "down", false);
              if (!closed && !signalingSuspended && (typeof navigator === "undefined" || navigator.onLine !== false)) {
                scheduleRetry(stEntry);
              }
              refreshPanel();
              updateTelemetry();
            };
            ws.onerror = onDown;
            ws.onclose = onDown;
          } catch (_) {
            closeTrackerSocket(stEntry, 1000, "err", false);
            if (!closed && !signalingSuspended && (typeof navigator === "undefined" || navigator.onLine !== false)) {
              scheduleRetry(stEntry);
            }
          }
        }

        function bumpShard() {
          for (const c of conns.values()) closePeerConn(c);
          conns.clear();
          for (const id of [...net.peers.keys()]) removePeer(id);
          shard = (shard + 1) % 16;
          net.shard = shard;
          infoHash = makeInfoHash(room, shard);
          shardJoinedAt = performance.now();
          for (const c of pendingOffers.values()) closePeerConn(c);
          pendingOffers.clear();
          prepareOfferPool(isCellularOrMobile() ? 2 : 3).then(() => {
            if (closed || signalingSuspended) return;
            for (const stEntry of trackerStates) {
              if (!stEntry.ready) continue;
              if (stEntry.isMqtt && stEntry.ws && stEntry.ws.readyState === WebSocket.OPEN) {
                try { stEntry.ws.send(mqttSubscribePkt(2 + shard, "tendy-quest/v1/" + infoHash)); } catch (_) {}
              }
              stEntry.lastAnnounceAt = 0;
              sendAnnounce(stEntry, true);
            }
          });
          setStatus("Shard full, trying Shard " + (shard + 1) + "...");
        }

        const startMobile = isCellularOrMobile();
        const startNow = performance.now();
        for (const stEntry of trackerStates) {
          if (!startMobile || stEntry.isMqtt || stEntry.idx === 0) {
            connectTracker(stEntry);
          } else {
            stEntry.nextRetryAt = startNow + stEntry.idx * 600;
          }
        }

        const maintTimer = setInterval(async () => {
          if (closed || net.transport !== t || signalingSuspended || (typeof navigator !== "undefined" && navigator.onLine === false)) return;
          const now = performance.now();
          const mobile = isCellularOrMobile();
          const offerTarget = mobile ? 2 : 3;
          const offerTtlMs = mobile ? 75000 : 45000;
          for (const [oid, c] of [...pendingOffers]) {
            if (now - c.createdAt > offerTtlMs) {
              pendingOffers.delete(oid);
              closePeerConn(c);
            }
          }
          // Prune stale half-open connections older than 10s so retries can proceed.
          for (const [pid, c] of [...conns]) {
            if (!c.open && now - (c.createdAt || 0) > 10000) {
              conns.delete(pid);
              closePeerConn(c);
            }
          }
          const slotsLeft = Math.max(0, MESH_MAX_REMOTES - openConnCount());
          if (slotsLeft > 0 && readyOfferCount() < offerTarget) {
            await prepareOfferPool(offerTarget);
            if (closed || signalingSuspended) return;
          }
          let primaryKeep = null;
          if (slotsLeft === 0) {
            primaryKeep = trackerStates.find((x) => x.isMqtt && x.ready) || trackerStates.find((x) => x.ready) || null;
          }
          for (const stEntry of trackerStates) {
            if (slotsLeft === 0 && primaryKeep && stEntry !== primaryKeep) {
              if (stEntry.ws) closeTrackerSocket(stEntry, 1000, "squad-full", false);
              continue;
            }
            if (stEntry.ready && now - stEntry.lastReadyAt >= 8000) {
              stEntry.backoffMs = 4000;
            }
            if (!stEntry.ws && now >= stEntry.nextRetryAt) {
              connectTracker(stEntry);
              continue;
            }
            if (stEntry.ws && stEntry.ws.readyState === WebSocket.OPEN && stEntry.ws.bufferedAmount > 65536) {
              closeTrackerSocket(stEntry, 4003, "backpressure", true);
              scheduleRetry(stEntry);
              continue;
            }
            if (stEntry.ready) {
              if (stEntry.isMqtt) {
                if (stEntry.awaitingPong && now - stEntry.lastPingSentAt > 8000) {
                  closeTrackerSocket(stEntry, 4001, "ping-timeout", true);
                  scheduleRetry(stEntry);
                  continue;
                }
                if (!stEntry.awaitingPong && now - stEntry.lastRxAt >= 18000 && stEntry.ws && stEntry.ws.readyState === WebSocket.OPEN) {
                  try {
                    stEntry.ws.send(new Uint8Array([0xc0, 0x00]));
                    stEntry.awaitingPong = true;
                    stEntry.lastPingSentAt = now;
                  } catch (_) {} // MQTT PINGREQ
                }
              } else if (stEntry.pendingAnnounceAt > 0 && now - stEntry.pendingAnnounceAt > 15000) {
                closeTrackerSocket(stEntry, 4002, "announce-timeout", true);
                scheduleRetry(stEntry);
                continue;
              }
              const announcePeriod = mobile
                ? (openConnCount() === 0 ? 8000 : (slotsLeft > 0 ? 18000 : 75000))
                : (openConnCount() === 0 ? 4500 : (slotsLeft > 0 ? (now - shardJoinedAt < 45000 ? 6500 : 15000) : 60000));
              if (now - stEntry.lastAnnounceAt >= announcePeriod) {
                sendAnnounce(stEntry, slotsLeft > 0);
              }
            }
          }
          updateTelemetry();
        }, 3000);

        const pingTimer = setInterval(() => {
          if (closed || net.transport !== t) return;
          for (const c of conns.values()) sendPingToConn(c);
          if (conns.size > 0) sendMeta();
        }, PROBE_INTERVAL_MS);

        const t = {
          kind: "mesh",
          isHost: false,
          shard,
          onShardFull() {
            if (!closed && net.peers.size === 0) bumpShard();
          },
          get trackersUp() { return trackersUp; },
          openWsCount,
          debugMetrics() {
            return {
              openWebSockets: openWsCount(),
              pendingOffers: pendingOffers.size,
              signalingSuspended,
              cleanCloses,
              zombieCloses,
            };
          },
          suspendSignaling(reason) {
            if (closed) return;
            signalingSuspended = true;
            if (netResetTimer) {
              clearTimeout(netResetTimer);
              netResetTimer = null;
            }
            for (const stEntry of trackerStates) {
              closeTrackerSocket(stEntry, 1000, reason || "suspend", false);
            }
            for (const c of pendingOffers.values()) closePeerConn(c);
            pendingOffers.clear();
            refreshPanel();
            updateTelemetry();
          },
          resumeSignaling(reason) {
            if (closed || (typeof navigator !== "undefined" && navigator.onLine === false)) return;
            if (netResetTimer) {
              clearTimeout(netResetTimer);
              netResetTimer = null;
            }
            const wasSuspended = signalingSuspended;
            signalingSuspended = false;
            const now = performance.now();
            if (wasSuspended) {
              for (const stEntry of trackerStates) {
                stEntry.backoffMs = 4000;
                stEntry.lastAnnounceAt = 0;
                stEntry.nextRetryAt = now + (stEntry.isMqtt ? 0 : stEntry.idx * 250);
              }
            }
            for (const stEntry of trackerStates) {
              if (!stEntry.ws && (stEntry.idx === 0 || stEntry.isMqtt || now >= stEntry.nextRetryAt)) {
                connectTracker(stEntry);
              }
            }
            if (openConnCount() < MESH_MAX_REMOTES) {
              void prepareOfferPool(isCellularOrMobile() ? 2 : 3);
            }
            setStatus(openConnCount() ? ("Connected (" + (net.peers.size + 1) + "/4 | Shard " + (shard + 1) + ")") : ("Searching Cedar Rapids squad (Shard " + (shard + 1) + ")..."));
            refreshPanel();
            updateTelemetry();
          },
          resetForNetworkChange(reason) {
            if (closed) return;
            t.suspendSignaling(reason || "net-change");
            for (const [pid, c] of [...conns]) {
              const cs = c.pc ? c.pc.connectionState : "closed";
              const ice = c.pc ? c.pc.iceConnectionState : "closed";
              if (cs === "disconnected" || cs === "failed" || cs === "closed" || ice === "disconnected" || ice === "failed" || ice === "closed") {
                conns.delete(pid);
                closePeerConn(c);
                if (c.boundId) removePeer(c.boundId);
              }
            }
            netResetTimer = setTimeout(() => {
              netResetTimer = null;
              if (!closed) t.resumeSignaling(reason || "net-change");
            }, 700);
          },
          send(buf, reliable, except) {
            let n = 0;
            for (const c of conns.values()) {
              if (c === except || !c.open) continue;
              const ch = reliable || c.st.readyState !== "open" ? c.ev : c.st;
              try { if (ch.readyState === "open") { ch.send(buf); n++; } } catch (_) {}
            }
            return n;
          },
          close() {
            closed = true;
            signalingSuspended = true;
            if (netResetTimer) {
              clearTimeout(netResetTimer);
              netResetTimer = null;
            }
            clearInterval(maintTimer);
            clearInterval(pingTimer);
            for (const stEntry of trackerStates) {
              closeTrackerSocket(stEntry, 1000, "close", false);
            }
            for (const c of pendingOffers.values()) closePeerConn(c);
            pendingOffers.clear();
            for (const c of conns.values()) closePeerConn(c);
            conns.clear();
          },
          connCount() { return openConnCount(); },
        };
        return t;
      }

      // ---- Copy/paste invite encoding (legacy ?mp=rtc) ----
      const b64u = (bytes) => {
        let s = "";
        for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      };
      const unb64u = (s) => {
        const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      };
      async function pipeBytes(bytes, stream, cap) {
        const reader = new Blob([bytes]).stream().pipeThrough(stream).getReader();
        const chunks = [];
        let total = 0;
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          total += value.length;
          if (total > cap) { try { reader.cancel(); } catch (_) {} throw new Error("code too large"); }
          chunks.push(value);
        }
        const out = new Uint8Array(total);
        let o = 0;
        for (const c of chunks) { out.set(c, o); o += c.length; }
        return out;
      }
      async function encodeCode(kind, sdp) {
        const json = new TextEncoder().encode(JSON.stringify({ v: 1, t: kind, s: sdp }));
        if (typeof CompressionStream === "function") {
          try { return "TQ1." + b64u(await pipeBytes(json, new CompressionStream("deflate-raw"), 65536)); } catch (_) {}
        }
        return "TQ0." + b64u(json);
      }
      async function decodeCode(text, kind) {
        const code = String(text || "").replace(/\s+/g, "");
        const m = /^TQ([01])\.([A-Za-z0-9_-]{16,12000})$/.exec(code);
        if (!m) throw new Error("That does not look like a game code.");
        let bytes = unb64u(m[2]);
        if (m[1] === "1") {
          if (typeof DecompressionStream !== "function") throw new Error("This browser cannot read compressed codes.");
          bytes = await pipeBytes(bytes, new DecompressionStream("deflate-raw"), 32768);
        }
        let obj;
        try { obj = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes)); } catch (_) { throw new Error("Code is damaged."); }
        if (!obj || typeof obj !== "object" || obj.v !== 1 || typeof obj.s !== "string" || obj.s.length > 20000 || !obj.s.startsWith("v=0")) {
          throw new Error("Code is damaged.");
        }
        if (obj.t !== kind) throw new Error(kind === "o" ? "That is a reply code; paste the invite code." : "That is an invite code; paste the reply code.");
        return obj.s;
      }

      // ---- Session control ----
      let hiddenSuspendTimer = null;
      let suspendedByPagehide = false;
      let netChangeDebounce = null;

      function leave() {
        if (hiddenSuspendTimer) { clearTimeout(hiddenSuspendTimer); hiddenSuspendTimer = null; }
        if (netChangeDebounce) { clearTimeout(netChangeDebounce); netChangeDebounce = null; }
        suspendedByPagehide = false;
        sendBye();
        if (net.transport) { try { net.transport.close(); } catch (_) {} }
        net.transport = null;
        for (const id of [...net.peers.keys()]) removePeer(id);
        net.myChar = 0;
        net.charLocked = false;
        net.charSelectOpen = false;
        net.charClaimedAt = 0;
        net.charSelectNotice = "";
        net.anchorId = myId;
        net.anchorRttMs = -1;
        setStatus(net.onlinePref ? "Paused / offline" : "Solo (offline)");
        refreshCharSelect();
      }

      function joinMesh(room) {
        leave();
        net.transportKind = "mesh";
        net.room = String(room || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12) || "MAIN";
        net.shard = 0;
        net.joinedAt = performance.now();
        net.myChar = 0;
        net.charLocked = true;
        net.charClaimedAt = performance.now();
        net.transport = meshTransport(net.room, 0);
        setStatus("Searching squad (Shard 1)...");
        refreshPanel();
        updateTelemetry();
      }

      function joinTabs(room) {
        leave();
        room = String(room || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12) || "MAIN";
        if (typeof BroadcastChannel !== "function") return setStatus("This browser has no BroadcastChannel.");
        net.transportKind = "tabs";
        net.room = room;
        net.joinedAt = performance.now();
        net.myChar = 0;
        net.transport = tabsTransport(room);

        sendHello();
        sendMeta();
        if (net.inFreeRoam) openCharSelect("");
      }

      async function rtcCreateInvite() {
        if (!net.transport || net.transport.kind !== "rtc" || !net.transport.isHost) {
          leave();
          net.transportKind = "rtc";
          net.transport = rtcTransport(true);
        }
        const t = net.transport;
        if (t.conns.length >= maxRemotes()) return setStatus("Room is full.");
        if (t.pending && !t.pending.open) { try { t.pending.pc.close(); } catch (_) {} t.conns.splice(t.conns.indexOf(t.pending), 1); }
        const c = t.newConn();
        t.pending = c;
        setStatus("Creating invite...");
        try {
          await c.pc.setLocalDescription(await c.pc.createOffer());
          await iceGathered(c.pc, 5000);
          ui.offerOut.value = await encodeCode("o", c.pc.localDescription.sdp);
          setStatus("Invite ready: send it to the other player, then paste their reply below.");
        } catch (e) {
          setStatus("Could not create invite: " + (e && e.message ? e.message : e));
        }
      }
      async function rtcAcceptReply() {
        const t = net.transport;
        if (!t || t.kind !== "rtc" || !t.isHost || !t.pending) return setStatus("Create an invite first.");
        try {
          const sdp = await decodeCode(ui.answerIn.value, "a");
          await t.pending.pc.setRemoteDescription({ type: "answer", sdp });
          t.pending = null;
          ui.answerIn.value = "";
          setStatus("Connecting...");
        } catch (e) {
          setStatus(e && e.message ? e.message : "Could not use that reply code.");
        }
      }
      async function rtcMakeReply() {
        let sdp;
        try { sdp = await decodeCode(ui.offerIn.value, "o"); } catch (e) { return setStatus(e.message); }
        leave();
        net.transportKind = "rtc";
        net.transport = rtcTransport(false);
        const c = net.transport.newConn();
        setStatus("Making reply...");
        try {
          await c.pc.setRemoteDescription({ type: "offer", sdp });
          await ensureAnswererAudio(c.pc);
          await c.pc.setLocalDescription(await c.pc.createAnswer());
          await iceGathered(c.pc, 5000);
          ui.answerOut.value = await encodeCode("a", c.pc.localDescription.sdp);
          setStatus("Reply ready: send it back to the host. It connects once they paste it.");
        } catch (e) {
          setStatus("Could not make reply: " + (e && e.message ? e.message : e));
        }
      }

      setInterval(() => {
        const now = performance.now();
        if (net.transport && now - net.lastSendAt > KEEPALIVE_MS - 100) {
          if (net.charLocked && net.lastBuf) {
            sendBuf(net.lastBuf, false);
          } else {
            sendMeta();
          }
          net.lastSendAt = now;
        }
        for (const [id, p] of [...net.peers]) if (now - p.last > PEER_TIMEOUT_MS) removePeer(id);
        updateTelemetry();
      }, KEEPALIVE_MS);

      const handlePageLeave = (e) => {
        if (hiddenSuspendTimer) { clearTimeout(hiddenSuspendTimer); hiddenSuspendTimer = null; }
        if (netChangeDebounce) { clearTimeout(netChangeDebounce); netChangeDebounce = null; }
        sendBye();
        if (net.transport) {
          if (e && e.type === "pagehide") suspendedByPagehide = true;
          try { net.transport.close(); } catch (_) {}
          net.transport = null;
          updateTelemetry();
        }
      };
      window.addEventListener("pagehide", handlePageLeave);
      window.addEventListener("beforeunload", handlePageLeave);
      window.addEventListener("pageshow", (e) => {
        if (e.persisted && suspendedByPagehide && net.onlinePref && !net.transport) {
          suspendedByPagehide = false;
          if (net.transportKind === "tabs") joinTabs(net.room);
          else if (net.transportKind !== "rtc") joinMesh(net.room);
        }
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          if (hiddenSuspendTimer) clearTimeout(hiddenSuspendTimer);
          hiddenSuspendTimer = setTimeout(() => {
            hiddenSuspendTimer = null;
            if (document.visibilityState === "hidden" && net.transport && net.transport.suspendSignaling) {
              net.transport.suspendSignaling("hidden");
              setStatus("Paused in background");
            }
          }, 6000);
        } else if (document.visibilityState === "visible") {
          if (hiddenSuspendTimer) { clearTimeout(hiddenSuspendTimer); hiddenSuspendTimer = null; }
          if (suspendedByPagehide && net.onlinePref && !net.transport) {
            suspendedByPagehide = false;
            if (net.transportKind === "tabs") joinTabs(net.room);
            else if (net.transportKind !== "rtc") joinMesh(net.room);
          } else if (net.transport && net.transport.resumeSignaling) {
            net.transport.resumeSignaling("visible");
          }
        }
      });
      window.addEventListener("offline", () => {
        if (netChangeDebounce) { clearTimeout(netChangeDebounce); netChangeDebounce = null; }
        if (net.transport && net.transport.suspendSignaling) {
          net.transport.suspendSignaling("offline");
          setStatus("Offline (waiting for network...)");
        }
      });
      window.addEventListener("online", () => {
        if (netChangeDebounce) clearTimeout(netChangeDebounce);
        netChangeDebounce = setTimeout(() => {
          netChangeDebounce = null;
          if (document.visibilityState !== "hidden" && net.transport && net.transport.resetForNetworkChange) {
            net.transport.resetForNetworkChange("online");
          }
        }, 800);
      });
      (() => {
        const nc = getNetConnection();
        if (!nc || typeof nc.addEventListener !== "function") return;
        const connSig = () => (nc.type || "") + "|" + (nc.effectiveType || "") + "|" + (nc.saveData ? "1" : "0");
        let lastConnSig = connSig();
        nc.addEventListener("change", () => {
          const sig = connSig();
          if (sig === lastConnSig) return;
          lastConnSig = sig;
          if (document.visibilityState === "hidden" || !net.onlinePref) return;
          if (netChangeDebounce) clearTimeout(netChangeDebounce);
          netChangeDebounce = setTimeout(() => {
            netChangeDebounce = null;
            if (document.visibilityState !== "hidden" && net.transport && net.transport.resetForNetworkChange) {
              net.transport.resetForNetworkChange("net-change");
            }

        });
      })();

      // ---- Collapsible Panel (shown only in Free Mode or explicit ?mp=tabs/rtc) ----
      const ui = {};
      function el(tag, props, kids) {

      function copyFrom(area) {

      function setStatus(s) {

          const card = ui.charCards[i];
          const badge = ui.charBadges[i];

        ui.btnLeave.disabled = !net.transport;
        if (ui.btnChangeChar) ui.btnChangeChar.disabled = !net.transport || net.sceneId < 3;
      }
      function buildPanel() {

            background:#0d1626;border:1px solid #4a6a99;border-radius:6px;padding:5px}

        ui.panel = el("div", { id: "mp-panel", role: "dialog", "aria-label": "Free Mode Multiplayer" }, [
          el("h2", { text: "Free Mode Multiplayer" }),
